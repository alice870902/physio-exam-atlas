<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shoulder · Physio Exam Atlas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left index (course → category → test), scrolling reading pane with player on top. */
:root{
  --bg:#f7f5f1; --panel:#ffffff; --fg:#1d1b17; --muted:#6b665c; --line:#e3ded4;
  --accent:#1f5f6b; --accent-ink:#ffffff; --accent-soft:#e3eff1; --mark:#c8731b;
  --done:#2f7d4f; --code:#f0ede6;
  --display:"Fraunces","Noto Sans TC",Georgia,serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --sidebar:300px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#15171a; --panel:#1d2024; --fg:#ebe7df; --muted:#a19b90; --line:#2d3137;
  --accent:#6fb9c6; --accent-ink:#0f1a1d; --accent-soft:#1d3237; --mark:#e49a4c;
  --done:#6cc68f; --code:#24282d; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#15171a; --panel:#1d2024; --fg:#ebe7df; --muted:#a19b90; --line:#2d3137;
  --accent:#6fb9c6; --accent-ink:#0f1a1d; --accent-soft:#1d3237; --mark:#e49a4c;
  --done:#6cc68f; --code:#24282d; color-scheme:dark; }

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.65;display:flex;overflow:hidden}
a{color:var(--accent)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
h1,h2,h3{text-wrap:balance;margin:0}

/* ---- sidebar ---- */
#side{width:var(--sidebar);flex:0 0 auto;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;height:100%;padding-left:env(safe-area-inset-left,0px)}
.brand{padding:18px 18px 12px;border-bottom:1px solid var(--line)}
.brand .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.brand h1{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.2;margin-top:4px}
.brand .sub{color:var(--muted);font-size:12.5px;margin-top:4px}
.search{padding:10px 14px;border-bottom:1px solid var(--line)}
.search input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit;font-size:14px}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px}
.progress{padding:8px 18px;font-family:var(--mono);font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.bar{height:4px;background:var(--line);border-radius:2px;flex:1;margin:0 10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--done);width:0}
nav{overflow-y:auto;flex:1;padding:6px 0 24px}
.cat>summary{list-style:none;cursor:pointer;padding:9px 18px;display:flex;align-items:baseline;gap:8px;user-select:none}
.cat>summary::-webkit-details-marker{display:none}
.cat>summary .n{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:1.6em}
.cat>summary .zh{font-weight:700}
.cat>summary .en{color:var(--muted);font-size:12px;margin-left:auto;text-align:right}
.cat>summary::before{content:"";width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);margin-right:2px;transition:transform .15s;flex:none;position:relative;top:-2px}
.cat[open]>summary::before{transform:rotate(45deg)}
.cat ul{list-style:none;margin:0;padding:0 0 6px}
.cat li a{display:flex;gap:8px;align-items:flex-start;padding:6px 18px 6px 34px;text-decoration:none;color:var(--fg);font-size:13.5px;line-height:1.4;border-left:3px solid transparent}
.cat li a:hover{background:var(--accent-soft)}
.cat li a.active{border-left-color:var(--accent);background:var(--accent-soft);font-weight:500}
.cat li a .tick{flex:none;width:14px;height:14px;border:1.5px solid var(--line);border-radius:50%;margin-top:4px}
.cat li a.done .tick{background:var(--done);border-color:var(--done)}
.cat li a .t{flex:1;min-width:0}
.cat li a .t small{display:block;color:var(--muted);font-size:11.5px}
.cat li[hidden]{display:none}
.cat.nomatch{display:none}

/* ---- main ---- */
#main{flex:1;min-width:0;height:100%;overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:18px}
#menu{display:none;padding:6px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px}
.crumb{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb b{color:var(--fg);font-weight:500}
.navbtns{margin-left:auto;display:flex;gap:6px}
.navbtns button{padding:6px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px;background:var(--panel)}
.navbtns button:disabled{opacity:.4;cursor:default}

article{max-width:860px}
.player{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.18)}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vids{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.vids button{font-family:var(--mono);font-size:11.5px;padding:3px 9px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
.vids button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.vids a{font-family:var(--mono);font-size:11.5px;margin-left:auto;align-self:center}

.head{margin:22px 0 14px}
.head .eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.head h2{font-family:var(--display);font-size:30px;font-weight:600;line-height:1.15;margin-top:6px}
.head h2 .en{display:block;font-family:var(--body);font-size:16px;font-weight:400;color:var(--muted);margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tags span{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--code);color:var(--muted)}
.doneRow{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13.5px}
.doneRow input{width:16px;height:16px;accent-color:var(--done)}

.sec{display:grid;grid-template-columns:150px 1fr;gap:10px 18px;padding:14px 0;border-top:1px solid var(--line)}
.sec h3{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.02em;padding-top:2px}
.sec h3 small{display:block;font-family:var(--mono);font-weight:400;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.sec p{margin:0;max-width:65ch}
.sec.positive p{border-left:3px solid var(--mark);padding-left:12px}
.acc{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.acc div{background:var(--code);border-radius:6px;padding:8px 10px}
.acc b{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.acc span{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.acc .src{grid-column:1/-1;background:none;padding:2px 0;font-size:12px;color:var(--muted)}
.foot{margin-top:18px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.welcome h2{font-family:var(--display);font-size:30px;margin-bottom:8px}
.welcome p{max-width:65ch;color:var(--muted)}
.welcome .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:18px}
.welcome .grid button{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.welcome .grid b{display:block}
.welcome .grid small{color:var(--muted);font-size:12px}
.welcome .grid i{display:block;font-family:var(--mono);font-size:11px;color:var(--accent);margin-top:6px;font-style:normal}

#scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:9}
@media (max-width:820px){
  #side{position:fixed;left:0;top:0;bottom:0;z-index:10;transform:translateX(-100%);transition:transform .2s;width:min(var(--sidebar),88vw);padding-top:env(safe-area-inset-top,0px)}
  body.nav-open #side{transform:none}
  body.nav-open #scrim{display:block}
  #menu{display:inline-block}
  .sec{grid-template-columns:1fr;gap:4px}
  .head h2{font-size:24px}
  .cat>summary .en{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>

p", "zh": "肩胛骨與肌力測試", "en": "Scapula & Muscle Strength", "slugs": ["scapular-dyskinesis-test", "scapular-assistance-test", "scapular-retraction-test", "serratus-anterior-strength-test", "trapezius-strength-test", "rhomboid-strength-test", "latissimus-dorsi-strength-test"]}, {"id": "tos", "zh": "胸廓出口症候群", "en": "Thoracic Outlet Syndrome (TOS)", "slugs": ["adson-test", "costoclavicular-maneuver", "eden-test", "cyriax-release-test", "tinel-sign-tos"]}, {"id": "ex", "zh": "運動治療", "en": "Exercise & Rehab", "slugs": ["best-shoulder-pain-relief-exercises", "scapula-strengthening-exercises", "best-scapular-dyskinesis-exercise"]}], "tests": [{"slug": "shoulder-assessment", "title_en": "Shoulder Assessment", "link": "https://www.physiotutors.com/wiki/shoulder-assessment/", "youtube_ids": ["cP4LLJie9kw", "n9HQIw1LHDY", "xvst7l2ykMQ"], "accuracy": {"sensitivity": null, "specificity": null, "lr_plus": null, "lr_minus": null, "source": "No test accuracy given; epidemiology from Luime et al. 2004 (point prevalence 7-26%, 40-50% still symptomatic at 1 year, recurrence 20-50%), Kuijpers et al. 2006 (54% recovered at 6 months), van der Windt et al. 1996 (median duration 21 weeks)"}, "title_zh": "肩關節理學檢查總論 Shoulder Assessment", "name_zh": "肩關節理學檢查總論", "purpose_zh": "介紹肩關節複合體 (shoulder complex) 並提供評估肩痛的基本架構。", "structure_zh": "盂肱關節 (glenohumeral joint)、胸鎖關節 (sternoclavicular joint)、肩鎖關節 (acromioclavicular joint) 與肩胛胸廓關節 (scapulothoracic joint)", "procedure_zh": "先將肩痛分為三類：被動活動受限合併盂肱關節疼痛、有疼痛弧 (painful arc) 但被動活動不受限、以及兩者皆無的其他主訴。評估由主動活動度 (active range of motion, AROM) 開始並觀察疼痛弧，接著以被動活動度 (passive range of motion, PROM) 比較雙側的活動範圍與末端感覺 (end-feel)。最後以 Stenvers 等人 (1977) 的五項快速肩帶活動度測試 (shoulder-girdle mobility tests) 完成篩檢。", "positive_zh": "不適用（總論頁面）。", "notes_zh": "在將疼痛歸因於肩關節之前，須先篩檢紅旗 (red flags)（腫瘤、感染、缺血性壞死 (avascular necrosis)）與內臟轉移痛 (visceral referral)（心臟、肝臟、脾臟、膽道）；若合併頸部疼痛，應同時檢查頸椎 (cervical spine)。流行病學：盛行率 7–26%，約 40–50% 一年後仍有症狀，復發率 20–50%。", "tags": ["總論 overview", "紅旗 red flags", "頸椎鑑別 cervical differential"]}, {"slug": "shoulder-active-range-of-motion", "title_en": "Shoulder Active Range of Motion", "link": "https://www.physiotutors.com/wiki/shoulder-active-range-of-motion/", "youtube_ids": ["cP4LLJie9kw"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "none"}, "title_zh": "肩關節主動活動度 Shoulder Active Range of Motion", "name_zh": "肩關節主動活動度", "purpose_zh": "評估肩關節複合體 (shoulder complex) 的主動活動範圍，同時觀察動作品質與代償。", "structure_zh": "肩關節複合體（盂肱關節 (glenohumeral) 與肩胛胸廓 (scapulothoracic) 動作）；例如冰凍肩 (frozen shoulder)、旋轉肌袖病變 (rotator cuff pathology)", "procedure_zh": "病人採坐姿或站姿（疼痛劇烈或術後可改仰臥）。觀察主動屈曲、伸展、外展、內收、水平內收、內旋與外旋，以及肩胛骨 (scapula) 的前突/後縮與上提/下壓。內旋可用拇指向上沿背部往上摸 (hitchhiker thumb，正常可達 T5–T10) 或在 90 度外展位檢查。", "positive_zh": "冰凍肩 (frozen shoulder)：AROM 與 PROM 明顯受限但疼痛不多，尤其是 0 度外展位的外旋。旋轉肌袖 (rotator cuff)：外展 60–120 度出現疼痛弧 (painful arc)，可能合併肩胛骨運動障礙 (scapular dyskinesis)。", "notes_zh": "疼痛劇烈或術後肩關節建議採仰臥檢查；曾有脫臼 (dislocation) 病史者，外旋測試須謹慎。", "tags": ["主動活動度 AROM", "疼痛弧 painful arc", "冰凍肩 frozen shoulder"]}, {"slug": "shoulder-passive-range-of-motion", "title_en": "Shoulder Passive Range of Motion", "link": "https://www.physiotutors.com/wiki/shoulder-passive-range-of-motion/", "youtube_ids": ["n9HQIw1LHDY"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Werner et al. 2014 (JSES) - reliability only; smartphone inclinometer most reliable"}, "title_zh": "肩關節被動活動度 Shoulder Passive Range of Motion", "name_zh": "肩關節被動活動度", "purpose_zh": "測量盂肱關節 (glenohumeral joint) 的被動骨運動學 (osteokinematic) 活動度，並在活動受限時評估末端感覺 (end-feel)。", "structure_zh": "盂肱關節 (glenohumeral joint) 與肩帶 (shoulder girdle)：關節囊 (capsule)、末端感覺 (end-feel)", "procedure_zh": "病人坐於治療床上。檢查者固定肩胛骨 (scapula) 與鎖骨 (clavicle)，帶動肱骨 (humerus) 做屈曲、伸展、外展、內收、水平內收/外展與內外旋。旋轉亦可在 90 度外展位測試，此時檢查者以大腿與手臂穩定肩帶。", "positive_zh": "與參考值比較（固定肩胛骨時盂肱關節屈曲約 80–90 度、伸展 60 度、外展 90 度、水平內收 110 度、外旋 60 度、內旋 100 度），並評估末端感覺的性質。", "notes_zh": "慣用側與非慣用側常有差異，不一定代表有症狀；有無固定肩胛骨會影響測得的終點。Werner 等人 (2014) 僅報告信度，智慧型手機傾斜儀 (smartphone inclinometer) 信度最佳。", "tags": ["被動活動度 PROM", "末端感覺 end-feel", "關節囊 capsule"]}, {"slug": "joint-play-shoulder", "title_en": "Joint Play Shoulder", "link": "https://www.physiotutors.com/wiki/joint-play-shoulder/", "youtube_ids": ["hKjQw-blrZ4"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "none"}, "title_zh": "肩關節關節間隙活動 Joint Play Shoulder", "name_zh": "肩關節關節間隙活動", "purpose_zh": "以盂肱關節 (glenohumeral joint) 的附屬關節運動學 (arthrokinematic) 滑動判斷關節囊 (capsule) 鬆弛或僵硬。", "structure_zh": "盂肱關節囊 (glenohumeral joint capsule)", "procedure_zh": "多在鬆弛位 (loose-packed position，約 40–55 度外展、30 度水平內收) 執行。前後向滑動 (AP glide)：病人仰臥於床緣，將肱骨 (humerus) 向後推移；後前向滑動 (PA glide)：肩關節懸於床外，將肱骨向前推移。另有側向牽引 (lateral distraction)、尾向滑動 (caudal glide，即牽引) 及 90 度外展位的尾向滑動。", "positive_zh": "無正式定義；與對側相比滑動量增加或減少，或末端感覺 (end-feel) 改變。", "notes_zh": "若肘關節 (elbow) 有問題，可改握肱骨上髁 (humeral epicondyles)；滑動應以全身帶動而非只用手臂出力。無診斷準確度資料。", "tags": ["關節間隙 joint play", "關節囊 capsule", "滑動 glide"]}, {"slug": "apley-scratch-test", "title_en": "Apley Scratch Test", "link": "https://www.physiotutors.com/wiki/apley-scratch-test/", "youtube_ids": ["oORkZ2gLlbA"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "no reliability or validity studies known"}, "title_zh": "Apley 抓癢測試 Apley Scratch Test", "name_zh": "Apley 抓癢測試", "purpose_zh": "快速功能性篩檢肩關節複合動作的主動活動度 (AROM)。", "structure_zh": "肩關節 AROM：外旋/外展/屈曲，以及內旋/伸展/內收", "procedure_zh": "病人將雙手伸到背後試圖互相碰觸，一手從肩上方往下、另一手從下方往上。接著交換兩手位置，比較兩側。", "positive_zh": "無明確切點；活動受限或雙側差異明顯即為異常（慣用側通常較緊）。", "notes_zh": "受限無法定位到盂肱關節 (glenohumeral joint)，因為肩胛骨 (scapula) 與鎖骨 (clavicle) 的動作也參與其中；肩胛骨控制不佳是常見原因。目前無已知的信度或效度研究。", "tags": ["主動活動度 AROM", "功能性篩檢 functional screen", "肩胛控制 scapular control"]}, {"slug": "scapulohumeral-rythm", "title_en": "Scapulohumeral Rhythm", "link": "https://www.physiotutors.com/wiki/scapulohumeral-rythm/", "youtube_ids": ["kkNnc6ssbPI"], "accuracy": {"sensitivity": null, "specificity": null, "lr_plus": null, "lr_minus": null, "source": "None reported; page cites Kirby, Showalter & Cook 2007 (Physiother Res Int) without accuracy data"}, "title_zh": "肩胛肱骨節律 Scapulohumeral Rhythm", "name_zh": "肩胛肱骨節律", "purpose_zh": "描述手臂完全上舉時肱骨 (humerus)、肩胛骨 (scapula) 與鎖骨 (clavicle) 的協調動作，作為肩胛骨控制的觀察性篩檢。", "structure_zh": "肩胛胸廓 (scapulothoracic) 與盂肱 (glenohumeral) 動作模式；節律紊亂或反轉（肩胛骨動得比肱骨多）提示肩胛或肱骨穩定肌 (stabilizers) 功能受損，反轉模式為冰凍肩 (frozen shoulder) 的典型表現", "procedure_zh": "並非正式測試；病人主動外展手臂，檢查者觀察三個階段。前約 30 度肩胛骨幾乎不動，鎖骨輕微上提；接著肱骨外展約 40 度，同時肩胛骨上旋 (upward rotation) 約 20 度，鎖骨上提並開始後旋；最後肱骨再外展約 60 度並外旋約 90 度，肩胛骨再上旋約 40 度並開始上提。", "positive_zh": "無正式判準；節律紊亂或反轉即為異常，最好與對側比較判斷。", "notes_zh": "正常值在個體與文獻間差異大，故應雙側比較。上舉與放下階段都要觀察，肩胛骨控制喪失在放下手臂時更明顯。無準確度資料。", "tags": ["肩胛肱骨節律 scapulohumeral rhythm", "肩胛骨運動障礙 scapular dyskinesis", "觀察 observation"]}, {"slug": "shoulder-resisted-isometric-testing", "title_en": "Shoulder Resisted Isometric Testing", "link": "https://www.physiotutors.com/wiki/shoulder-resisted-isometric-testing/", "youtube_ids": ["zW8SE6WOxD0"], "accuracy": {"sensitivity": "n/a", "specificity": "n/a", "lr_plus": "n/a", "lr_minus": "n/a", "source": "none given"}, "title_zh": "肩關節阻力等長測試 Shoulder Resisted Isometric Testing", "name_zh": "肩關節阻力等長測試", "purpose_zh": "快速篩檢肩帶 (shoulder girdle) 的肌肉肌腱單位 (musculotendinous unit) 是否受影響，通常在主動與被動活動度測試之後進行。", "structure_zh": "肩帶肌群的肌肉肌腱單位，加上肱二頭肌 (biceps) 與肱三頭肌 (triceps)", "procedure_zh": "病人仰臥，手臂輕微外展、肘關節屈曲 90 度。檢查者托住肱骨遠端，病人依序抵抗屈曲、伸展、外展、內收、內旋與外旋的阻力。肩胛骨前突、後縮、上提與下壓則採坐姿測試。", "positive_zh": "來源未明確定義；一般解讀為阻力收縮時出現疼痛和/或無力。", "notes_zh": "因肱二頭肌 (biceps) 與肱三頭肌 (triceps) 跨越肩與肘兩個關節，應一併測試肘屈曲與伸展。無準確度資料。", "tags": ["等長阻力測試 resisted isometric", "肌肉肌腱單位 musculotendinous unit", "篩檢 screen"]}, {"slug": "shoulder-symptom-modification-procedure", "title_en": "Shoulder Symptom Modification Procedure", "link": "https://www.physiotutors.com/wiki/shoulder-symptom-modification-procedure/", "youtube_ids": ["sYTW7u6ZoCI"], "accuracy": {"sensitivity": "n/a", "specificity": "n/a", "lr_plus": "n/a", "lr_minus": "n/a", "source": "Inter-rater reliability kappa 0.47 (Meakins et al. 2018)"}, "title_zh": "肩關節症狀修正程序 Shoulder Symptom Modification Procedure", "name_zh": "肩關節症狀修正程序", "purpose_zh": "將肩痛視為力學問題，找出能減輕或誘發疼痛的姿勢與動作修正方式。", "structure_zh": "肩峰下疼痛 (subacromial pain)/旋轉肌袖 (rotator cuff) 與滑囊 (bursa)；影響因子包括胸椎姿勢、肩胛骨位置、肱骨頭位置與肌肉活化", "procedure_zh": "先找出一個會痛的動作（例如屈曲）。接著依序進行四個階段並在每階段後重測：胸椎修正（伸展提示、徒手治療或貼紮）、肩胛骨重新定位（徒手或貼紮）、肱骨頭 (humeral head) 重新定位（吊帶或前後/後前向滑動），最後在周圍肌肉（如外旋肌群 (external rotators)）共同收縮下重複該動作。", "positive_zh": "疼痛動作中的疼痛有意義地減輕；某階段後疼痛完全緩解，即指引治療應針對該區域。", "notes_zh": "此程序是因誘發測試 (provocation tests) 特異度差而發展出來；評估者間信度僅中等 (kappa 0.47，Meakins 等人 2018)，解讀須謹慎。", "tags": ["症狀修正 symptom modification", "SAPS", "信度 reliability"]}, {"slug": "shoulder-joint-positioning-sense", "title_en": "Shoulder Joint Positioning Sense", "link": "https://www.physiotutors.com/wiki/shoulder-joint-positioning-sense/", "youtube_ids": ["M4gJCkgdXt0"], "accuracy": {"sensitivity": "n/a", "specificity": "n/a", "lr_plus": "n/a", "lr_minus": "n/a", "source": "Reliability ICC 0.86 and 0.78 (Vafadar et al. 2016)"}, "title_zh": "肩關節位置覺測試 Shoulder Joint Positioning Sense", "name_zh": "肩關節位置覺測試", "purpose_zh": "以簡易雷射筆方法測量肩關節位置覺（本體感覺 (proprioception)），不需實驗室設備。", "structure_zh": "肩關節本體感覺 (proprioception)；缺損與鬆弛 (laxity)、不穩定 (instability)、過頂運動、疲勞及疼痛有關", "procedure_zh": "病人站在距牆約 1 公尺處手持雷射筆，將手臂屈曲至 90 度（以手機傾斜儀確認），並將靶板中心對準光點。屈曲、外展與自外旋回復三種動作各在睜眼下練習三次，第四次閉眼執行並計分（每個動作最高 10 分，總分 30）。", "positive_zh": "無正式切點；雙側差異大於約 10% 視為異常。", "notes_zh": "各研究的操作流程不一，臨床價值中等；適合作為基準值與追蹤用。信度 ICC 0.86 與 0.78 (Vafadar 等人 2016)。", "tags": ["本體感覺 proprioception", "位置覺 joint position sense", "不穩定 instability"]}, {"slug": "frozen-shoulder-diagnosis", "title_en": "Frozen Shoulder Diagnosis", "link": "https://www.physiotutors.com/wiki/frozen-shoulder-diagnosis/", "youtube_ids": ["5zpXbvEf9j0"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Hollmann et al. 2015 cited for muscle guarding findings"}, "title_zh": "冰凍肩的診斷 Frozen Shoulder Diagnosis", "name_zh": "冰凍肩的診斷", "purpose_zh": "以理學檢查診斷沾黏性關節囊炎 (adhesive capsulitis) 的方法。", "structure_zh": "盂肱關節囊 (glenohumeral capsule) 與關節囊韌帶複合體 (capsuloligamentous complex)", "procedure_zh": "檢查者穩定肩胛骨 (scapula)（身體貼住病人軀幹、一手放在喙突 (coracoid)），在零位 (zero position) 測量被動外旋並與對側比較。接著固定鎖骨 (clavicle) 與肩胛骨，測量盂肱關節的外展與屈曲，以分離出真正的關節動作。", "positive_zh": "外旋較對側喪失至少 50%（或小於 30 度），加上其他兩個以上平面喪失至少 25%。", "notes_zh": "主動與被動活動度等量喪失、阻力測試少有疼痛，指向關節囊 (capsule) 問題；喙突疼痛測試 (Coracoid Pain Test) 有助區分真性與假性冰凍肩。Hollmann 等人 (2015) 指出肌肉防衛 (muscle guarding) 也會造成活動度喪失。", "tags": ["冰凍肩 frozen shoulder", "沾黏性關節囊炎 adhesive capsulitis", "被動活動度 PROM"]}, {"slug": "shoulder-impingement-explained", "title_en": "Shoulder Impingement Explained", "link": "https://www.physiotutors.com/wiki/shoulder-impingement-explained/", "youtube_ids": ["z9a3RWzGX0o", "WgQG4aXjovc"], "accuracy": {"sensitivity": "n/a", "specificity": "n/a", "lr_plus": "n/a", "lr_minus": "n/a", "source": "Cools et al. 2008 (BJSM) clinical reasoning algorithm"}, "title_zh": "肩夾擠理論解析 Shoulder Impingement Explained", "name_zh": "肩夾擠理論解析", "purpose_zh": "說明夾擠 (impingement) 理論，以及如何推論夾擠型症狀背後的真正病理。", "structure_zh": "肩峰下夾擠 (subacromial impingement)（滑囊 (bursa) 與旋轉肌袖肌腱 (rotator cuff tendons) 在肩峰弓 (acromial arch) 下）與內夾擠 (internal impingement)（旋轉肌袖撞擊關節盂 (glenoid) 前上或後上緣）；影響因子包括旋轉肌袖病變、肩胛骨運動障礙 (scapular dyskinesis)、不穩定 (instability)、肱二頭肌/SLAP 病灶 (SLAP lesion) 與盂肱內旋缺損 (GIRD)", "procedure_zh": "並非單一測試。前上內夾擠 (anterosuperior internal impingement) 以屈曲合併內旋誘發；後上內夾擠 (posterosuperior impingement) 以外展合併最大外旋與水平外展誘發（投擲的晚期揮臂期 (late-cocking) 姿勢）。", "positive_zh": "無明確陽性定義；主動外展時中段的疼痛弧 (painful arc) 是典型的肩峰下表現。", "notes_zh": "「夾擠 (impingement)」被視為過時的症狀群標籤；應以臨床測試縮小可能的機轉。參考 Cools 等人 (2008) 的臨床推理流程。", "tags": ["夾擠 impingement", "SAPS", "內夾擠 internal impingement", "臨床推理 clinical reasoning"]}, {"slug": "neer-test", "title_en": "Neer Test", "link": "https://www.physiotutors.com/wiki/neer-test/", "youtube_ids": ["nNyax0iocZo"], "accuracy": {"sensitivity": "59-72%", "specificity": "~60% (page lists 6%, likely a typo; Hegedus 2012 reports ~60%)", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Hegedus et al. 2012; Gismervik et al. 2017"}, "title_zh": "尼爾氏測試 Neer Test", "name_zh": "尼爾氏測試", "purpose_zh": "肩峰下疼痛症候群 (subacromial pain syndrome, SAPS，舊稱肩夾擠) 的誘發測試。", "structure_zh": "肩峰下空間 (subacromial space)；旋轉肌袖肌腱 (rotator cuff tendons) 受喙肩韌帶 (coracoacromial ligament) 與肩峰 (acromion) 前三分之一壓迫（Neer 理論）", "procedure_zh": "病人坐姿。檢查者站在病人身後，一手穩定肩胛骨 (scapula)，另一手將手臂被動帶到最大肩屈曲。部分作者會加上內旋，但這不在 Neer 原始描述中。", "positive_zh": "誘發出病人熟悉的肩痛。", "notes_zh": "單獨使用證據力弱，應與 Hawkins-Kennedy 測試 (Hawkins-Kennedy Test) 及疼痛弧徵象 (Painful Arc Sign) 組成測試群 (cluster) 使用。敏感度 59–72%、特異度約 60%（原頁面寫 6% 疑為筆誤）。", "tags": ["SAPS", "誘發測試 provocation", "cluster"]}, {"slug": "hawkins-kennedy-test", "title_en": "Hawkins-Kennedy Test", "link": "https://www.physiotutors.com/wiki/hawkins-kennedy-test/", "youtube_ids": ["X9YiuvQJVJc"], "accuracy": {"sensitivity": "58-80%", "specificity": "56-67%", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Hegedus et al. 2012; Gismervik et al. 2017; inter-rater reliability kappa 0.38 (Cadogan et al. 2011)"}, "title_zh": "Hawkins-Kennedy 測試 Hawkins-Kennedy Test", "name_zh": "Hawkins-Kennedy 測試", "purpose_zh": "肩峰下疼痛症候群 (subacromial pain syndrome, SAPS) 的誘發測試。", "structure_zh": "肩峰下空間 (subacromial space)；喙肩弓 (coracoacromial arch) 下的旋轉肌袖肌腱 (rotator cuff tendons)", "procedure_zh": "病人坐姿，肩關節與肘關節各屈曲 90 度。檢查者一手穩定肩胛骨 (scapula)，另一手握住肘部，被動將盂肱關節 (glenohumeral joint) 內旋。", "positive_zh": "誘發出病人熟悉的肩痛。", "notes_zh": "評估者間信度低 (kappa 0.38，Cadogan 等人 2011)，單獨使用價值有限；通常與尼爾氏測試 (Neer Test) 及疼痛弧徵象 (Painful Arc Sign) 合併使用。敏感度 58–80%、特異度 56–67%。", "tags": ["SAPS", "誘發測試 provocation", "cluster"]}, {"slug": "painful-arc-sign", "title_en": "Painful Arc Sign", "link": "https://www.physiotutors.com/wiki/painful-arc-sign/", "youtube_ids": ["7-aXHIBRsbU"], "accuracy": {"sensitivity": "53%", "specificity": "76%", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Hegedus et al. 2012 (BJSM meta-analysis)"}, "title_zh": "疼痛弧徵象 Painful Arc Sign", "name_zh": "疼痛弧徵象", "purpose_zh": "評估肩峰下疼痛症候群 (subacromial pain syndrome, SAPS) 的標誌性徵象。", "structure_zh": "肩峰下構造（旋轉肌袖肌腱 (rotator cuff tendons)、滑囊 (bursa)）；可與肩鎖關節 (AC joint) 病變區分", "procedure_zh": "病人站姿，拇指朝上，雙臂緩慢外展至全範圍後再放下。檢查者觀察疼痛出現在弧線的哪個區段。", "positive_zh": "外展約 60–120 度的中段出現疼痛，動作起始與終末疼痛較少。", "notes_zh": "準確度中等，單獨使用證據力弱（敏感度 53%、特異度 76%，Hegedus 等人 2012）。若疼痛在 170–180 度出現，指向肩鎖關節 (AC joint) 病變而非肩峰下疼痛。", "tags": ["SAPS", "疼痛弧 painful arc", "肩鎖關節 AC joint", "cluster"]}, {"slug": "coracoid-pain-test", "title_en": "Coracoid Pain Test", "link": "https://www.physiotutors.com/wiki/coracoid-pain-test/", "youtube_ids": ["rqCBa2zqASo"], "accuracy": {"sensitivity": "96%", "specificity": "87-89%", "lr_plus": "not reported (approx. 7.4-8.7 derived)", "lr_minus": "not reported (approx. 0.05 derived)", "source": "Carbone et al. 2010 (Int Orthop)"}, "title_zh": "喙突疼痛測試 Coracoid Pain Test", "name_zh": "喙突疼痛測試", "purpose_zh": "協助區分真性冰凍肩（沾黏性關節囊炎 (adhesive capsulitis)）與假性冰凍肩及其他造成肩僵硬的原因。", "structure_zh": "喙肱韌帶 (coracohumeral ligament)、旋轉肌間隙 (rotator interval) 與喙突三角 (coracoid triangle)，在沾黏性關節囊炎中對壓力敏感", "procedure_zh": "檢查者以拇指依序按壓肩鎖關節 (AC joint)、前外側肩峰下區域 (anterolateral subacromial area) 與喙突 (coracoid process)。每個部位按壓後，病人以視覺類比量表 (VAS) 評分疼痛。", "positive_zh": "喙突疼痛 VAS 大於 30 mm，且高於肩鎖關節與前外側肩峰下區域。", "notes_zh": "僅有一篇驗證研究 (Carbone 等人 2010，敏感度 96%、特異度 87–89%)，但臨床上被認為實用。Hollmann 等人 (2015) 指出主動肌肉防衛 (muscle guarding) 也會造成冰凍肩的活動度喪失。", "tags": ["冰凍肩 frozen shoulder", "沾黏性關節囊炎 adhesive capsulitis", "喙突 coracoid"]}, {"slug": "subacromial-pain-syndrome-cluster", "title_en": "Subacromial Pain Syndrome Cluster", "link": "https://www.physiotutors.com/wiki/subacromial-pain-syndrome-cluster/", "youtube_ids": ["UErH4NUsDWQ"], "accuracy": {"sensitivity": "not stated", "specificity": "not stated", "lr_plus": "2.93 (3+ positive)", "lr_minus": "0.34 (<3 positive)", "source": "Michener et al. 2009 (Arch Phys Med Rehabil)"}, "title_zh": "肩峰下疼痛症候群測試群 Subacromial Pain Syndrome Cluster", "name_zh": "肩峰下疼痛症候群測試群", "purpose_zh": "診斷肩峰下疼痛症候群 (subacromial pain syndrome, SAPS) 的五項測試組合。", "structure_zh": "肩峰下空間 (subacromial space) 與旋轉肌袖肌腱 (rotator cuff tendons)：肌腱病變 (tendinopathy)、部分撕裂 (partial tears)、滑囊炎 (bursitis)", "procedure_zh": "依序執行 Hawkins-Kennedy 測試 (Hawkins-Kennedy Test)、尼爾氏測試 (Neer Test)、疼痛弧徵象 (Painful Arc Sign)、空罐測試 (Empty Can Test) 與阻力外旋測試 (resisted external rotation)。疼痛弧與空罐測試採站姿，尼爾氏與阻力外旋採坐姿，Hawkins-Kennedy 在 90 度前屈位進行。", "positive_zh": "五項中有 3 項以上陽性即測試群陽性（尼爾氏與 Hawkins-Kennedy 以疼痛再現為準；疼痛弧以中段疼痛為準；空罐與阻力外旋以疼痛和/或無力為準）。", "notes_zh": "臨床價值有限，因為檢後機率改變幅度小 (LR+ 2.93、LR− 0.34，Michener 等人 2009)。空罐測試並不能單獨分離棘上肌 (supraspinatus)。", "tags": ["SAPS", "cluster", "旋轉肌袖 rotator cuff"]}, {"slug": "empty-can-test", "title_en": "Empty Can Test", "link": "https://www.physiotutors.com/wiki/empty-can-test/", "youtube_ids": ["z9a3RWzGX0o", "DeO50UTxwoo"], "accuracy": {"sensitivity": "74%", "specificity": "30%", "lr_plus": "not reported (approx. 1.06 derived)", "lr_minus": "not reported (approx. 0.87 derived)", "source": "Hegedus et al. 2012 (BJSM)"}, "title_zh": "空罐測試 Empty Can Test", "name_zh": "空罐測試", "purpose_zh": "肩峰下疼痛症候群 (subacromial pain syndrome, SAPS) 中評估肌力與激惹性的阻力測試，傳統上針對棘上肌 (supraspinatus)。", "structure_zh": "棘上肌 (supraspinatus)/旋轉肌袖 (rotator cuff)；肩峰下疼痛症候群 (SAPS)", "procedure_zh": "病人站姿或坐姿，雙臂在肩胛平面 (scapular plane) 上舉 90 度並完全內旋（拇指朝下）。檢查者向下壓雙臂，病人抵抗。", "positive_zh": "患側相較健側出現無力和/或疼痛。", "notes_zh": "幾乎不改變檢後機率（敏感度 74%、特異度 30%，Hegedus 等人 2012），應與 Hawkins-Kennedy 測試 (Hawkins-Kennedy Test)、尼爾氏測試 (Neer Test)、滿罐測試 (Full Can Test) 及疼痛弧徵象 (Painful Arc Sign) 合併使用。此姿勢並不能分離棘上肌 (supraspinatus)。", "tags": ["棘上肌 supraspinatus", "SAPS", "cluster"]}, {"slug": "full-can-test", "title_en": "Full Can Test", "link": "https://www.physiotutors.com/wiki/full-can-test/", "youtube_ids": ["NuBOHdm20cc"], "accuracy": {"sensitivity": "70%", "specificity": "81%", "lr_plus": "not reported (approx. 3.7 derived)", "lr_minus": "not reported (approx. 0.37 derived)", "source": "Jain et al. 2017 (ROW cohort, Am J Phys Med Rehabil)"}, "title_zh": "滿罐測試 Full Can Test", "name_zh": "滿罐測試", "purpose_zh": "測試棘上肌 (supraspinatus) 的肌力與激惹性，以偵測棘上肌撕裂與肩峰下疼痛。", "structure_zh": "棘上肌肌腱 (supraspinatus tendon)（旋轉肌袖撕裂 (rotator cuff tears)）；肩峰下疼痛症候群 (SAPS)", "procedure_zh": "病人雙臂在肩胛平面 (scapular plane) 上舉 90 度，拇指朝上。檢查者施加向下的力，病人抵抗。", "positive_zh": "測試側出現肩痛（常位於三角肌 (deltoid) 區域）或無力。", "notes_zh": "肌電圖研究 (Boettcher 等人 2009) 顯示另有八條肩部肌肉活化程度相近，故此測試無法分離棘上肌 (supraspinatus)；對於確認或排除撕裂的價值中等（敏感度 70%、特異度 81%，Jain 等人 2017）。", "tags": ["棘上肌 supraspinatus", "旋轉肌袖撕裂 rotator cuff tear", "SAPS"]}, {"slug": "drop-arm-sign", "title_en": "Drop Arm Sign", "link": "https://www.physiotutors.com/wiki/drop-arm-sign/", "youtube_ids": ["JXgRBeqToik"], "accuracy": {"sensitivity": "73% (supraspinatus/infraspinatus FT tears); 43% (infraspinatus tears)", "specificity": "77%; 81%", "lr_plus": "not reported (approx. 3.2 and 2.3 derived)", "lr_minus": "not reported (approx. 0.35 and 0.70 derived)", "source": "Miller et al. 2008; Sgroi et al. 2019"}, "title_zh": "落臂徵象 Drop Arm Sign", "name_zh": "落臂徵象", "purpose_zh": "篩檢棘上肌 (supraspinatus) 與棘下肌 (infraspinatus) 的全層撕裂 (full-thickness tear)。", "structure_zh": "棘上肌 (supraspinatus) 與棘下肌 (infraspinatus) 肌腱（旋轉肌袖全層撕裂 (full-thickness rotator cuff tears)）", "procedure_zh": "病人坐姿或站姿。檢查者被動將手臂放在 90 度外展合併外旋的位置，請病人維持該姿勢，然後放開支撐。", "positive_zh": "病人無法控制手臂緩慢放下，手臂直接掉落。", "notes_zh": "臨床價值中等（棘上肌/棘下肌全層撕裂敏感度 73%、特異度 77%；棘下肌撕裂敏感度 43%、特異度 81%），應與落後徵象 (lag signs)、棘下肌測試 (Infraspinatus Test) 及裂隙測試 (Rent Test) 搭配使用。", "tags": ["棘上肌 supraspinatus", "棘下肌 infraspinatus", "全層撕裂 full-thickness tear"]}, {"slug": "lateral-rotation-lag-sign", "title_en": "Lateral Rotation Lag Sign", "link": "https://www.physiotutors.com/wiki/lateral-rotation-lag-sign/", "youtube_ids": ["iUTxEAOrEMY"], "accuracy": {"sensitivity": "46%", "specificity": "94%", "lr_plus": "7.2", "lr_minus": "not reported", "source": "Miller, Forrester, Lewis 2008 (Arch Phys Med Rehabil)"}, "title_zh": "外旋落後徵象 Lateral Rotation Lag Sign", "name_zh": "外旋落後徵象", "purpose_zh": "評估棘上肌 (supraspinatus)、棘下肌 (infraspinatus) 與小圓肌 (teres minor) 無力或疼痛的落後測試 (lag test)，又稱棘下肌回彈測試 (infraspinatus spring-back test)。", "structure_zh": "旋轉肌袖全層撕裂 (full-thickness rotator cuff tears)，主要為棘上肌 (supraspinatus) 與棘下肌 (infraspinatus)", "procedure_zh": "病人站姿。檢查者將肩關節帶到肩胛平面 (scapular plane) 90 度外展、肘關節屈曲，被動外旋至末端，請病人維持該姿勢後放開支撐。", "positive_zh": "病人無法維持姿勢，手臂向前回彈進入內旋。", "notes_zh": "適合確認全層撕裂但不適合排除（敏感度 46%、特異度 94%、LR+ 7.2，Miller 等人 2008）；應與落臂徵象 (Drop Arm Sign)、內旋落後徵象 (Internal Rotation Lag Sign)、棘下肌測試 (Infraspinatus Test) 及裂隙測試 (Rent Test) 合併使用。", "tags": ["棘下肌 infraspinatus", "落後徵象 lag sign", "全層撕裂 full-thickness tear"]}, {"slug": "hornblowers-sign", "title_en": "Hornblower's Sign", "link": "https://www.physiotutors.com/wiki/hornblowers-sign/", "youtube_ids": ["am5XZ1VnoLc"], "accuracy": {"sensitivity": "100% (Walch, teres minor fatty degeneration); 17% (Jain, infraspinatus tear)", "specificity": "93%; 96%", "lr_plus": "4.25 (Jain 2017)", "lr_minus": "not reported", "source": "Walch et al. 1998 (high risk of bias); Jain et al. 2017 (ROW cohort)"}, "title_zh": "吹號手徵象 Hornblower's Sign", "name_zh": "吹號手徵象", "purpose_zh": "測試小圓肌 (teres minor) 與棘下肌 (infraspinatus) 的全層撕裂 (full-thickness tear)。", "structure_zh": "小圓肌 (teres minor) 與棘下肌 (infraspinatus)（外旋肌群 (external rotators)），包括無法修補的脂肪變性 (fatty degeneration)", "procedure_zh": "病人坐姿，手臂在肩胛平面 (scapular plane) 外展 90 度、肘關節屈曲 90 度。檢查者請病人在此姿勢下抵抗阻力做外旋。", "positive_zh": "在此姿勢下無法外旋。", "notes_zh": "品質較佳的研究顯示敏感度低（Jain 等人 2017 棘下肌撕裂敏感度 17%、特異度 96%、LR+ 4.25；Walch 等人 1998 針對小圓肌脂肪變性報告敏感度 100%、特異度 93%，但偏差風險高），因此陰性結果不能排除棘下肌撕裂。相關測試：外旋落後徵象 (Lateral Rotation Lag Sign)、落臂徵象 (Drop Arm Sign)、棘下肌測試 (Infraspinatus Test)、裂隙測試 (Rent Test)。", "tags": ["小圓肌 teres minor", "棘下肌 infraspinatus", "全層撕裂 full-thickness tear"]}, {"slug": "lift-off-sign", "title_en": "Lift Off Sign", "link": "https://www.physiotutors.com/wiki/lift-off-sign/", "youtube_ids": ["AgkTH52_PBI"], "accuracy": {"sensitivity": "22%", "specificity": "94%", "lr_plus": "not reported (approx. 3.7 derived)", "lr_minus": "not reported (approx. 0.83 derived)", "source": "Jain et al. 2017 (ROW cohort)"}, "title_zh": "離背測試 Lift Off Sign", "name_zh": "離背測試", "purpose_zh": "懷疑肩胛下肌 (subscapularis) 全層撕裂時評估其肌力。", "structure_zh": "肩胛下肌肌肉肌腱單位 (subscapularis muscle-tendon unit)", "procedure_zh": "病人站姿，手背貼在腰椎中段，然後將手抬離背部。檢查者觀察是否出現肩胛骨 (scapula) 代償動作。若病人能完成，可再施加阻力以分級肌力。", "positive_zh": "無法將手抬離背部，提示肩胛下肌 (subscapularis) 病灶。", "notes_zh": "敏感度低（22%）故陰性不能排除撕裂，特異度高（94%）故陽性中度支持撕裂 (Jain 等人 2017)。熊抱測試 (Bear Hug Test) 與壓腹測試 (Belly Press Test) 為替代方案，尤其當手背後動作受限時。", "tags": ["肩胛下肌 subscapularis", "全層撕裂 full-thickness tear", "內旋 internal rotation"]}, {"slug": "belly-press", "title_en": "Belly Press Test", "link": "https://www.physiotutors.com/wiki/belly-press/", "youtube_ids": ["RDfStbLsj6Q"], "accuracy": {"sensitivity": "28%", "specificity": "87%", "lr_plus": "not reported (approx. 2.2 derived)", "lr_minus": "not reported (approx. 0.83 derived)", "source": "Jain et al. 2017 (ROW cohort, MRI-confirmed tears)"}, "title_zh": "壓腹測試 Belly Press Test", "name_zh": "壓腹測試", "purpose_zh": "簡單評估肩胛下肌 (subscapularis) 肌力與疼痛的測試。", "structure_zh": "肩胛下肌 (subscapularis) 肌肉與肌腱（撕裂）", "procedure_zh": "病人以手掌壓向腹部，抵抗檢查者的手，並保持肘部朝前。可在手與腹部之間放置血壓計袖帶以量化施力。適合無法將手伸到背後或無法耐受 90 度上舉的病人。", "positive_zh": "相較對側出現無力，或誘發疼痛。", "notes_zh": "因準確度低而評為弱（敏感度 28%、特異度 87%，Jain 等人 2017，MRI 確診撕裂）。肌電圖 (Pennock 等人 2011) 顯示肩胛下肌活化程度與熊抱測試 (Bear Hug Test)、離背測試 (Lift Off Sign) 相近，同時能限制胸大肌 (pectoralis)、闊背肌 (latissimus) 與大圓肌 (teres major) 的參與。", "tags": ["肩胛下肌 subscapularis", "全層撕裂 full-thickness tear", "內旋 internal rotation"]}, {"slug": "bear-hug-test", "title_en": "Bear Hug Test", "link": "https://www.physiotutors.com/wiki/bear-hug-test/", "youtube_ids": ["30C3DNq-w4g"], "accuracy": {"sensitivity": "19-75% (range across studies)", "specificity": "56-99%", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Barth 2006; Pennock 2011; Schiefer 2012; Yoon 2013; Takeda 2016; Kappe 2018"}, "title_zh": "熊抱測試 Bear Hug Test", "name_zh": "熊抱測試", "purpose_zh": "評估肩胛下肌 (subscapularis) 的肌力與疼痛。", "structure_zh": "肩胛下肌肌肉肌腱單位 (subscapularis muscle-tendon unit)，主要為全層撕裂 (full-thickness tears)", "procedure_zh": "病人站姿，患側手掌放在對側肩上，手指伸直、肘部在身體前方。檢查者施加與前臂垂直的外旋力量，病人以保持手掌在原位來抵抗。", "positive_zh": "病人無法將手保持在對側肩上，或誘發出可辨識的肩痛。", "notes_zh": "各研究敏感度差異大 (19–75%) 且偏低、特異度中至高 (56–99%)，因此主要用於確認而非排除肩胛下肌 (subscapularis) 撕裂。", "tags": ["肩胛下肌 subscapularis", "全層撕裂 full-thickness tear", "內旋 internal rotation"]}, {"slug": "apprehension-test", "title_en": "Apprehension Test", "link": "https://www.physiotutors.com/wiki/apprehension-test/", "youtube_ids": ["jZ29dAXKA5M"], "accuracy": {"sensitivity": "65.6%", "specificity": "95.4%", "lr_plus": "not reported (~14 calculated)", "lr_minus": "not reported (~0.36 calculated)", "source": "Hegedus et al. 2012, Br J Sports Med"}, "title_zh": "恐懼測試 Apprehension Test", "name_zh": "恐懼測試", "purpose_zh": "藉由在末端外轉 (end-range external rotation) 時誘發病人對肩關節半脫位 (subluxation) 的恐懼感，篩檢前向盂肱關節不穩定 (anterior glenohumeral instability)。", "structure_zh": "前向盂肱關節不穩定 (anterior glenohumeral instability)；前側關節囊盂唇複合體 (anterior capsulolabral complex)", "procedure_zh": "病人仰臥，受測肩位於床緣，肩外展 (abduction) 90 度。檢查者緩慢增加外轉 (external rotation)，同時請病人回報是否出現恐懼感或即將脫臼的感覺。", "positive_zh": "隨外轉角度增加，病人表示害怕肩關節脫臼 (apprehension)；僅有疼痛不算陽性。", "notes_zh": "特異度高 (95.4%)，適合用來確認 (rule in) 前向不穩定；加入水平外展 (horizontal abduction) 可讓肱骨頭 (humeral head) 更有效向前滑動。通常接著做復位測試 (Relocation Test) 與釋放測試 (Release Test)。", "tags": ["前向不穩定 anterior instability", "恐懼 apprehension", "cluster"]}, {"slug": "relocation-test", "title_en": "Relocation Test", "link": "https://www.physiotutors.com/wiki/relocation-test/", "youtube_ids": ["10uSROESJdo"], "accuracy": {"sensitivity": "64.6%", "specificity": "90.2%", "lr_plus": "not reported (~6.6 calculated)", "lr_minus": "not reported (~0.39 calculated)", "source": "Hegedus et al. 2012, Br J Sports Med"}, "title_zh": "復位測試 Relocation Test", "name_zh": "復位測試", "purpose_zh": "恐懼測試 (Apprehension Test) 陽性後的接續測試，檢查向後方施力是否能緩解病人的恐懼感，以支持前向不穩定 (anterior instability) 的診斷。", "structure_zh": "前向盂肱關節不穩定 (anterior glenohumeral instability)", "procedure_zh": "病人仰臥，手臂維持在 90 度外展 (abduction) 與剛才誘發恐懼感的外轉 (external rotation) 角度。檢查者對肱骨頭 (humeral head) 施加由前向後 (anterior-to-posterior) 的力量，並詢問病人即將脫臼的感覺是否改變。", "positive_zh": "施加向後壓力後，病人的恐懼感減輕或消失。", "notes_zh": "單獨使用價值中等，但與恐懼測試 (Apprehension Test) 組成群集 (cluster) 時效力很強。若只是疼痛減輕而非恐懼感減輕，不視為真正的陽性。", "tags": ["前向不穩定 anterior instability", "復位 relocation", "cluster"]}, {"slug": "shoulder-relocation-test", "title_en": "Shoulder Relocation Test", "link": "https://www.physiotutors.com/wiki/shoulder-relocation-test/", "youtube_ids": ["YX1uJhjhwWg"], "accuracy": {"sensitivity": "64.6%", "specificity": "90.2%", "lr_plus": "not reported (~6.6 calculated)", "lr_minus": "not reported (~0.39 calculated)", "source": "Hegedus et al. 2012"}, "title_zh": "肩關節復位測試 Shoulder Relocation Test", "name_zh": "肩關節復位測試", "purpose_zh": "藉由將肱骨頭 (humeral head) 向後穩定，檢查是否能緩解恐懼測試 (Apprehension Test) 所引發的恐懼感，以確認前向肩關節不穩定 (anterior shoulder instability)。", "structure_zh": "前向盂肱關節不穩定 (anterior glenohumeral instability)", "procedure_zh": "緊接在恐懼測試 (Apprehension Test) 陽性之後進行。肩關節維持約 90 度外展 (abduction) 及出現恐懼感時的最大外轉 (external rotation) 角度，檢查者對肱骨頭 (humeral head) 施加由前向後的壓力。", "positive_zh": "向後方施壓後，病人對脫臼的恐懼感減輕。", "notes_zh": "此為復位測試 (Relocation Test) 的舊版重複條目，僅影片不同；用於確認前向不穩定的價值評為中等。", "tags": ["前向不穩定 anterior instability", "復位 relocation"]}, {"slug": "release-test", "title_en": "Release Test", "link": "https://www.physiotutors.com/wiki/release-test/", "youtube_ids": ["10uSROESJdo"], "accuracy": {"sensitivity": "81.8%", "specificity": "86.1%", "lr_plus": "not reported (~5.9 calculated)", "lr_minus": "not reported (~0.21 calculated)", "source": "Hegedus et al. 2012, Br J Sports Med"}, "title_zh": "釋放測試 Release Test", "name_zh": "釋放測試", "purpose_zh": "恐懼測試序列的第三步（又稱驚嚇測試 Surprise Test），檢查突然放開復位壓力時恐懼感是否重新出現。", "structure_zh": "前向盂肱關節不穩定 (anterior glenohumeral instability)", "procedure_zh": "在復位測試 (Relocation Test) 已使病人恐懼感減輕之後，檢查者放開施加於肱骨頭 (humeral head) 的由前向後壓力，過程中不再將手臂推往更大的外轉 (external rotation) 或水平外展 (horizontal abduction)。", "positive_zh": "壓力一放開，病人對脫臼的恐懼感立即重新出現。", "notes_zh": "單獨使用價值評為中等；釋放時切勿再把手臂推向更末端的角度，以免真的引發脫臼。", "tags": ["前向不穩定 anterior instability", "驚嚇測試 surprise test", "cluster"]}, {"slug": "anterior-shoulder-instability-cluster", "title_en": "Anterior Shoulder Instability Cluster", "link": "https://www.physiotutors.com/wiki/anterior-shoulder-instability-cluster/", "youtube_ids": ["jZ29dAXKA5M"], "accuracy": {"sensitivity": "81% (cluster); apprehension 65.6%, relocation 64.6%", "specificity": "98% (cluster); apprehension 95.4%, relocation 90.2%", "lr_plus": "not reported (~40 calculated for cluster)", "lr_minus": "not reported (~0.19 calculated for cluster)", "source": "Farber et al. 2006 (cluster); Hegedus et al. 2012 (single tests)"}, "title_zh": "前向肩關節不穩定測試群集 Anterior Shoulder Instability Cluster", "name_zh": "前向肩關節不穩定測試群集", "purpose_zh": "將恐懼測試 (Apprehension Test) 與復位測試 (Relocation Test) 組合成群集，以比單一測試更高的準確度診斷前向盂肱關節不穩定 (anterior glenohumeral instability)。", "structure_zh": "前向盂肱關節不穩定 (anterior glenohumeral instability)", "procedure_zh": "病人仰臥，肩關節 90 度外展 (abduction) 並靠近床緣。檢查者緩慢將手臂外轉 (external rotation)，病人回報恐懼感；一旦出現恐懼感，檢查者在同一姿勢下對肱骨頭 (humeral head) 施加由前向後的壓力，觀察恐懼感是否緩解。", "positive_zh": "外轉增加時出現恐懼感，且向後方施壓後恐懼感緩解（兩個成分皆為陽性）。", "notes_zh": "群集的特異度極高 (98%)，是臨床上確認前向不穩定的建議方式；判定標準是恐懼感而非疼痛。", "tags": ["前向不穩定 anterior instability", "cluster", "恐懼 apprehension"]}, {"slug": "sulcus-sign", "title_en": "Sulcus Sign", "link": "https://www.physiotutors.com/wiki/sulcus-sign/", "youtube_ids": ["vV7u2JtdYWI"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Inter-rater reliability kappa 0.48 (moderate), Eshoj et al. 2018, BMJ Open"}, "title_zh": "溝槽徵象 Sulcus Sign", "name_zh": "溝槽徵象", "purpose_zh": "評估下方盂肱關節鬆弛 (inferior glenohumeral laxity) 或下向不穩定 (inferior instability)。", "structure_zh": "下方盂肱關節囊 (inferior glenohumeral capsule)；下向不穩定／多方向鬆弛 (multidirectional laxity)", "procedure_zh": "病人坐姿或站姿，手臂放鬆垂於身側。檢查者握住手肘下方的前臂，沿肱骨 (humerus) 長軸向遠端牽拉。", "positive_zh": "肩峰 (acromion) 下方出現可見的凹陷，或病人表示有半脫位 (subluxation) 的感覺。", "notes_zh": "雙側皆有溝槽徵象的意義遠低於僅症狀側單側出現；目前沒有診斷準確度資料，評估者間信度僅為中等 (kappa 0.48)。", "tags": ["下向不穩定 inferior instability", "多方向不穩定 MDI", "鬆弛 laxity"]}, {"slug": "load-and-shift-test", "title_en": "Load and Shift Test", "link": "https://www.physiotutors.com/wiki/load-and-shift-test/", "youtube_ids": ["txARar71h5E"], "accuracy": {"sensitivity": "37.5%", "specificity": "89.2%", "lr_plus": "not reported (~3.5 calculated)", "lr_minus": "not reported (~0.70 calculated)", "source": "Morey et al. 2016 (posterior labral tears); inter-rater kappa 0.48, Eshoj et al. 2018"}, "title_zh": "負荷位移測試 Load and Shift Test", "name_zh": "負荷位移測試", "purpose_zh": "分級評估肱骨頭 (humeral head) 的前向與後向位移量，以評估盂肱關節鬆弛 (laxity) 或不穩定 (instability)。", "structure_zh": "盂肱關節前向與後向穩定度 (anterior and posterior glenohumeral stability)", "procedure_zh": "病人端坐，手臂放鬆置於大腿上。檢查者一手固定鎖骨 (clavicle) 與肩胛骨 (scapula)，另一手握住肱骨頭 (humeral head)，先將其壓入關節盂 (glenoid) 中央（load），再分別向前、向後推移（shift）。", "positive_zh": "重現症狀，且位移量明顯大於健側；正常約為肱骨頭直徑的 25%（前向）與 50%（後向），第 1 到 3 級依序增加，第 3 級為無法自行復位的半脫位 (subluxation)。", "notes_zh": "前向鬆弛常合併後側關節囊 (posterior capsule) 緊縮，反之亦然；敏感度低 (37.5%)，陰性結果無法排除不穩定。", "tags": ["不穩定 instability", "鬆弛 laxity", "位移分級 translation grading"]}, {"slug": "jerk-test", "title_en": "Jerk Test", "link": "https://www.physiotutors.com/wiki/jerk-test/", "youtube_ids": ["j_qG1MNOws8"], "accuracy": {"sensitivity": "90% (Kim 2004); 62.5% (Morey 2016)", "specificity": "85% (Kim 2004); 96.4% (Morey 2016)", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Kim et al. 2004; Morey et al. 2016"}, "title_zh": "急推測試 Jerk Test", "name_zh": "急推測試", "purpose_zh": "誘發性測試，用於檢測後下盂唇撕裂 (posteroinferior labral tear) 與後下向盂肱關節不穩定 (posteroinferior glenohumeral instability)。", "structure_zh": "後下盂唇 (posteroinferior glenoid labrum)；後向不穩定 (posterior instability)", "procedure_zh": "病人坐姿，檢查者站在身後，一手固定肩胛骨 (scapula)。手臂置於 90 度外展 (abduction) 並內轉 (internal rotation)，經手肘沿肱骨 (humerus) 施加軸向負荷，再將手臂帶入水平內收 (horizontal adduction)。", "positive_zh": "肱骨頭 (humeral head) 半脫位再復位時，出現突發的後側肩痛並伴隨喀噠聲 (click/clunk)。", "notes_zh": "急推測試若引發疼痛，可預測保守治療失敗；對後下盂唇病灶的評價為「確認 (rule in) 中等、排除 (rule out) 良好」。", "tags": ["後向不穩定 posterior instability", "後下盂唇 posteroinferior labrum", "誘發測試 provocation"]}, {"slug": "kims-test", "title_en": "Kim's Test", "link": "https://www.physiotutors.com/wiki/kims-test/", "youtube_ids": ["-knsALCdv_A"], "accuracy": {"sensitivity": "80%", "specificity": "94%", "lr_plus": "not reported (~13.3 calculated)", "lr_minus": "not reported (~0.21 calculated)", "source": "Kim et al. 2005, Am J Sports Med"}, "title_zh": "Kim 氏測試 Kim's Test", "name_zh": "Kim 氏測試", "purpose_zh": "評估造成後下向肩關節不穩定 (posteroinferior shoulder instability) 的後下盂唇撕裂 (posteroinferior labral tear)。", "structure_zh": "後下盂唇 (posteroinferior glenoid labrum)", "procedure_zh": "病人坐姿，檢查者站在身後固定肩胛骨 (scapula)。手臂置於 90 度外展 (abduction) 與內轉 (internal rotation)，經手肘施加軸向壓迫力，再將手臂帶入水平內收 (horizontal adduction)，同時把肱骨頭 (humeral head) 向後下方推。", "positive_zh": "出現突發的後側肩痛，可伴隨或不伴隨喀噠聲 (click)。", "notes_zh": "準確度數據 (敏感度 80%、特異度 94%) 來自測試發明者本身，尚未經獨立驗證，故臨床價值評為中等；若測試引發疼痛，亦可預測保守治療失敗。", "tags": ["後向不穩定 posterior instability", "後下盂唇 posteroinferior labrum", "未獨立驗證 unvalidated"]}, {"slug": "porcellini-test", "title_en": "Porcellini Test", "link": "https://www.physiotutors.com/wiki/porcellini-test/", "youtube_ids": ["XqkMk_-LvS4"], "accuracy": {"sensitivity": "100%", "specificity": "99%", "lr_plus": "not reported (~100 calculated)", "lr_minus": "not reported (~0 calculated)", "source": "Morey et al. 2016, Musculoskeletal Surgery"}, "title_zh": "Porcellini 測試 Porcellini Test", "name_zh": "Porcellini 測試", "purpose_zh": "分兩階段的阻抗上舉測試，用於檢測造成後向不穩定 (posterior instability) 的後下盂唇撕裂 (posteroinferior labral tear)。", "structure_zh": "後下盂唇 (posteroinferior glenoid labrum)；後下向不穩定 (posteroinferior instability)", "procedure_zh": "病人坐姿或站姿，肩關節屈曲 (flexion) 90 度、內收 (adduction) 10-15 度並最大內轉 (internal rotation，拇指朝下)；檢查者站在身後固定肩胛骨 (scapula)，並對上舉動作給予阻力。第二階段重複相同動作，但檢查者將拇指置於後側關節線 (posterior joint line)，把肱骨頭 (humeral head) 向前推，以阻擋後向半脫位。", "positive_zh": "第一階段出現疼痛或無力，第二階段減輕或消失；若第二階段疼痛持續，則指向肩鎖關節 (acromioclavicular joint) 病變。", "notes_zh": "原始研究中表現優於急推測試 (Jerk Test)、Kim 氏測試 (Kim's Test) 與負荷位移測試 (Load and Shift Test)，且檢查者間信度高；但數據 (敏感度 100%、特異度 99%) 僅來自單一未經驗證的研究，故價值評為中等。", "tags": ["後向不穩定 posterior instability", "後下盂唇 posteroinferior labrum", "單一研究 single study"]}, {"slug": "miniaci-test", "title_en": "Miniaci Test", "link": "https://www.physiotutors.com/wiki/miniaci-test/", "youtube_ids": ["rMAk8MnscBM"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "No reliability or accuracy studies available"}, "title_zh": "Miniaci 測試 Miniaci Test", "name_zh": "Miniaci 測試", "purpose_zh": "針對後下盂唇撕裂 (posteroinferior labral tear) 與後向肩關節不穩定 (posterior shoulder instability) 的「誘發再復位」操作。", "structure_zh": "後下盂唇 (posteroinferior glenoid labrum)；後下向不穩定 (posteroinferior instability)", "procedure_zh": "病人坐姿。肩關節置於內收 (adduction)、70-90 度屈曲 (flexion) 與內轉 (internal rotation)，同時沿肱骨 (humerus) 施加向後的力量；檢查者另一手觸診前、後側關節線。接著將手臂帶入水平外展 (horizontal abduction) 與外轉 (external rotation)。", "positive_zh": "向後半脫位的肱骨頭 (humeral head) 復位回關節盂 (glenoid) 時產生喀噠聲 (clunk)。", "notes_zh": "此測試從未被研究過，沒有任何信度或準確度資料，臨床使用價值存疑；Porcellini 測試 (Porcellini Test)、急推測試 (Jerk Test) 與 Kim 氏測試 (Kim's Test) 是有實證依據的替代選擇。", "tags": ["後向不穩定 posterior instability", "後下盂唇 posteroinferior labrum", "無實證 no evidence"]}, {"slug": "obrien-test", "title_en": "O'Brien Test", "link": "https://www.physiotutors.com/wiki/obrien-test/", "youtube_ids": ["qkDvVBi0gg8"], "accuracy": {"sensitivity": "67% for SLAP; 14% for AC joint", "specificity": "37% for SLAP; 92% for AC joint", "lr_plus": "not reported (~1.1 SLAP, ~1.8 AC calculated)", "lr_minus": "not reported (~0.9 SLAP, ~0.9 AC calculated)", "source": "Hegedus et al. 2012 (SLAP); Krill et al. 2018 (AC)"}, "title_zh": "O'Brien 測試 O'Brien Test", "name_zh": "O'Brien 測試", "purpose_zh": "主動壓迫測試 (active compression test)，目的在檢測 SLAP 病灶 (SLAP lesion) 與肩鎖關節 (acromioclavicular joint) 病變。", "structure_zh": "上盂唇 (superior labrum / SLAP lesion)；肩鎖關節 (acromioclavicular joint)", "procedure_zh": "病人肩關節屈曲 (flexion) 90 度、內收 (adduction) 約 10 度並完全內轉 (internal rotation，拇指朝下)；檢查者向下壓手臂，病人抵抗。接著在肩關節完全外轉 (external rotation，掌心朝上) 的姿勢下重複。", "positive_zh": "拇指朝下時疼痛，掌心朝上時疼痛減輕或消失；深層疼痛指向盂唇 (labrum)，表淺疼痛指向肩鎖關節 (AC joint)。", "notes_zh": "對 SLAP 與肩鎖關節兩種適應症的臨床價值皆弱 (SLAP 敏感度 67%、特異度 37%)；肌電圖研究 (Green 2008) 發現掌心朝上時肱二頭肌 (biceps) 活動反而較多，與測試原理相矛盾。可考慮改用肱二頭肌負荷 II 測試 (Biceps Load II Test) 或 Yergason 測試 (Yergason's Test)。", "tags": ["SLAP", "肩鎖關節 AC joint", "主動壓迫 active compression", "價值弱 weak"]}, {"slug": "crank-test", "title_en": "Crank Test", "link": "https://www.physiotutors.com/wiki/crank-test/", "youtube_ids": ["HTpejI3FGG4"], "accuracy": {"sensitivity": "46%", "specificity": "72%", "lr_plus": "not reported (~1.6 calculated)", "lr_minus": "not reported (~0.75 calculated)", "source": "Gismervik et al. 2017, meta-analysis"}, "title_zh": "曲柄測試 Crank Test", "name_zh": "曲柄測試", "purpose_zh": "壓迫加旋轉的操作，用於檢測 SLAP 病灶 (SLAP lesion) 與近端肱二頭肌 (proximal biceps) 病變。", "structure_zh": "上盂唇 (superior labrum / SLAP lesion)；肱二頭肌長頭近端 (proximal long head of biceps)", "procedure_zh": "病人坐姿或仰臥，肩關節在肩胛骨平面 (scapular plane) 上舉約 160 度，手肘屈曲 90 度。檢查者沿肱骨 (humerus) 施加軸向負荷，並反覆將肩關節內轉 (internal rotation) 與外轉 (external rotation)，以夾住盂唇 (labrum)。", "positive_zh": "關節內出現喀噠聲 (clicking)，可伴隨或不伴隨疼痛或恐懼感。", "notes_zh": "對 SLAP 撕裂的臨床價值弱 (敏感度 46%、特異度 72%)；應與其他檢查結果合併判讀。", "tags": ["SLAP", "壓迫旋轉 compression-rotation", "價值弱 weak"]}, {"slug": "biceps-load-i-test", "title_en": "Biceps Load I Test", "link": "https://www.physiotutors.com/wiki/biceps-load-i-test/", "youtube_ids": ["sL_5OKlqSA8"], "accuracy": {"sensitivity": "11.9%", "specificity": "87.5%", "lr_plus": "not reported (~0.95 calculated)", "lr_minus": "not reported (~1.0 calculated)", "source": "Somerville et al. 2017, Surgery Journal"}, "title_zh": "肱二頭肌負荷 I 測試 Biceps Load I Test", "name_zh": "肱二頭肌負荷 I 測試", "purpose_zh": "在有前向不穩定 (anterior instability) 的病人身上，測試負荷肱二頭肌 (biceps) 是否改變恐懼感，作為 SLAP 病灶 (SLAP lesion) 的徵象。", "structure_zh": "上盂唇與肱二頭肌附著點 (superior labrum and biceps anchor / SLAP lesion)", "procedure_zh": "病人仰臥，手臂外展 (abduction) 90 度，前臂旋後 (supination)，手肘屈曲 90 度。檢查者先執行恐懼測試 (Apprehension Test) 的操作，在出現恐懼感的角度停住，然後在不改變肩關節姿勢下，請病人抵抗阻力屈曲手肘。", "positive_zh": "抵抗屈肘時恐懼感不變，或肩部疼痛加劇；若恐懼感減輕則為陰性。", "notes_zh": "臨床價值弱 (敏感度 11.9%、特異度 87.5%)，概似比接近 1，既無法確認也無法排除 SLAP 撕裂；MR 關節攝影 (MR arthrography) 仍是較佳的診斷方式 (Symanski 2017)。", "tags": ["SLAP", "肱二頭肌負荷 biceps load", "前向不穩定 anterior instability", "價值弱 weak"]}, {"slug": "biceps-load-ii-test", "title_en": "Biceps Load II Test", "link": "https://www.physiotutors.com/wiki/biceps-load-ii-test/", "youtube_ids": ["dPh5wQmKTfk"], "accuracy": {"sensitivity": "30% (Oh 2008); 27.6% (Somerville 2017); 67% (Cook 2012 meta-analysis)", "specificity": "78% (Oh 2008); 77.8% (Somerville 2017); 51% (Cook 2012)", "lr_plus": "not reported (~1.2-1.4 calculated)", "lr_minus": "not reported (~0.65-0.93 calculated)", "source": "Oh et al. 2008; Somerville et al. 2017; Cook et al. 2012"}, "title_zh": "肱二頭肌負荷 II 測試 Biceps Load II Test", "name_zh": "肱二頭肌負荷 II 測試", "purpose_zh": "在高角度外展下阻抗肱二頭肌 (biceps) 負荷，用於檢測上盂唇撕裂 (SLAP lesion)。", "structure_zh": "上盂唇與肱二頭肌長頭附著點 (superior labrum and long head of biceps anchor / SLAP lesion)", "procedure_zh": "病人仰臥，肩關節外展 (abduction) 120 度並外轉 (external rotation)，前臂旋後 (supination)，手肘屈曲 90 度。病人抵抗檢查者的阻力屈曲手肘。", "positive_zh": "抵抗屈肘時重現疼痛。", "notes_zh": "雖然廣受使用，但綜合準確度有限（敏感度 28-67%、特異度 51-78%，依研究而異），臨床價值評為弱；單獨陽性所能增加的診斷確定性不多。", "tags": ["SLAP", "肱二頭肌負荷 biceps load", "價值弱 weak"]}, {"slug": "passive-compression-test", "title_en": "Passive Compression Test", "link": "https://www.physiotutors.com/wiki/passive-compression-test/", "youtube_ids": ["G2n0Mu9BmEA"], "accuracy": {"sensitivity": "82%", "specificity": "86%", "lr_plus": "not reported (~5.9 calculated)", "lr_minus": "not reported (~0.21 calculated)", "source": "Kim et al. 2007, Am J Sports Med"}, "title_zh": "被動壓迫測試 Passive Compression Test", "name_zh": "被動壓迫測試", "purpose_zh": "將上盂唇 (superior labrum) 壓迫至關節盂 (glenoid) 上，以檢測 SLAP 病灶 (SLAP lesion)。", "structure_zh": "上盂唇 (superior labrum / SLAP lesion)", "procedure_zh": "病人以健側側臥，檢查者站在身後。一手固定肩鎖關節 (AC joint)，另一手握住手肘；在約 30 度外展 (abduction) 下將手臂外轉 (external rotation)，再向近端推壓並同時伸展 (extension) 肩關節，使盂唇 (labrum) 被壓迫於關節盂上。", "positive_zh": "盂肱關節 (glenohumeral joint) 內出現疼痛或疼痛性喀噠聲 (painful click)。", "notes_zh": "數據 (敏感度 82%、特異度 86%) 看來不錯，但僅來自單一研究且未經獨立驗證，故臨床價值評為中等。側臥時可用鏡子觀察病人的反應。", "tags": ["SLAP", "側臥 side-lying", "單一研究 single study"]}, {"slug": "labral-tension-test", "title_en": "Labral Tension Test", "link": "https://www.physiotutors.com/wiki/labral-tension-test/", "youtube_ids": ["G2n0Mu9BmEA"], "accuracy": {"sensitivity": "40%", "specificity": "75%", "lr_plus": "not reported (~1.6 calculated)", "lr_minus": "not reported (~0.8 calculated)", "source": "Cook et al. 2012, J Shoulder Elbow Surg"}, "title_zh": "盂唇張力測試 Labral Tension Test", "name_zh": "盂唇張力測試", "purpose_zh": "在末端外轉 (end-range external rotation) 下以阻抗旋後 (resisted supination) 拉緊肱二頭肌-盂唇複合體 (biceps-labral complex)，以檢測 SLAP 病灶 (SLAP lesion)。", "structure_zh": "上盂唇 (superior labrum / SLAP lesion)", "procedure_zh": "病人仰臥，手臂約 120 度外展 (abduction)，前臂中立位。檢查者將肩關節帶至末端外轉 (external rotation)，握住病人的手，請病人抵抗阻力做前臂旋後 (supination)。", "positive_zh": "阻抗旋後時出現與主訴一致的肩痛加劇。", "notes_zh": "臨床價值弱 (敏感度 40%、特異度 75%)；單獨的 SLAP 病灶並不常見，通常合併旋轉肌袖撕裂 (rotator cuff tear) 或不穩定 (instability)。", "tags": ["SLAP", "阻抗旋後 resisted supination", "價值弱 weak"]}, {"slug": "passive-distraction-test", "title_en": "Passive Distraction Test", "link": "https://www.physiotutors.com/wiki/passive-distraction-test/", "youtube_ids": ["cbHRPFJ5jm8"], "accuracy": {"sensitivity": "53%", "specificity": "94%", "lr_plus": "not reported (~8.8 calculated)", "lr_minus": "not reported (~0.5 calculated)", "source": "Schlechter et al. 2009, Arthroscopy"}, "title_zh": "被動牽張測試 Passive Distraction Test", "name_zh": "被動牽張測試", "purpose_zh": "在高角度上舉下藉由前臂旋前 (pronation) 將肱二頭肌附著點 (biceps anchor) 自關節盂 (glenoid) 剝離，以檢測 SLAP 病灶 (SLAP lesion)。", "structure_zh": "上盂唇與肱二頭肌長頭附著點 (superior labrum and long head of biceps anchor / SLAP lesion)", "procedure_zh": "病人仰臥於床緣。檢查者將手臂在冠狀面 (coronal plane) 上舉至約 150 度，手肘伸直、前臂旋後 (supination)；固定上臂以阻擋肱骨 (humerus) 旋轉，然後輕柔地將前臂旋前 (pronation)。", "positive_zh": "盂肱關節 (glenohumeral joint) 內出現深層疼痛，位於前側或後側。", "notes_zh": "特異度高 (94%)，對確認上盂唇撕裂具中等價值；旋前時橈骨粗隆 (radial tuberosity) 轉動，使肱二頭肌附著點 (biceps anchor) 受到張力。", "tags": ["SLAP", "旋前 pronation", "確認 rule in"]}, {"slug": "compression-rotation-test", "title_en": "Compression Rotation Test", "link": "https://www.physiotutors.com/wiki/compression-rotation-test/", "youtube_ids": ["ONk0DHLKKJk"], "accuracy": {"sensitivity": "43%", "specificity": "89%", "lr_plus": "not reported (~3.9 calculated)", "lr_minus": "not reported (~0.64 calculated)", "source": "Gismervik et al. 2017, BMC Musculoskelet Disord (meta-analysis)"}, "title_zh": "壓迫旋轉測試 Compression Rotation Test", "name_zh": "壓迫旋轉測試", "purpose_zh": "對肱骨頭 (humeral head) 施加軸向壓迫並旋轉，以夾住撕裂的上盂唇 (superior labrum / SLAP lesion)。", "structure_zh": "上盂唇 (superior labrum / SLAP lesion)", "procedure_zh": "病人仰臥，檢查者站在患側。肩關節外展 (abduction) 90 度、手肘屈曲 90 度；檢查者經手肘沿肱骨 (humerus) 施加壓迫，同時透過手腕反覆將手臂內轉 (internal rotation) 與外轉 (external rotation)。", "positive_zh": "關節內出現卡住感或彈響 (catching/snapping)，類似膝關節的 McMurray 測試 (McMurray test)。", "notes_zh": "在 Gismervik 統合分析中為最準確的 SLAP 測試 (敏感度 43%、特異度 89%)；確認 (rule in) 價值中等，但排除 (rule out) 價值弱，陰性結果無法排除病灶。", "tags": ["SLAP", "壓迫旋轉 compression-rotation", "確認 rule in"]}, {"slug": "dynamic-labral-shear-test", "title_en": "Dynamic Labral Shear Test", "link": "https://www.physiotutors.com/wiki/dynamic-labral-shear-test/", "youtube_ids": ["Vo7YBDwZAbk"], "accuracy": {"sensitivity": "78% isolated SLAP; 57% with concomitant pathology", "specificity": "51% isolated SLAP; 52% with concomitant pathology", "lr_plus": "not reported (~1.6 / ~1.2 calculated)", "lr_minus": "not reported (~0.43 / ~0.83 calculated)", "source": "Sodha et al. 2017, Am J Sports Med"}, "title_zh": "動態盂唇剪力測試 Dynamic Labral Shear Test", "name_zh": "動態盂唇剪力測試", "purpose_zh": "在上舉過程中讓上盂唇 (superior labrum) 與關節盂 (glenoid) 之間產生剪力，以檢測 SLAP 病灶 (SLAP lesion)。", "structure_zh": "上盂唇與肱二頭肌附著點 (superior labrum and biceps anchor / SLAP lesion)", "procedure_zh": "檢查者站在病人身後，握住患側手腕，手肘屈曲，肩關節外展 (abduction) 並外轉 (external rotation)。另一手在近端肱骨 (proximal humerus) 靠近關節線處施加向前的力量，同時將手臂從 90 度上舉至約 150 度。", "positive_zh": "在約 90 到 120 度上舉之間，病人回報疼痛，或檢查者在後側關節線 (posterior joint line) 感覺到喀噠聲 (click)。", "notes_zh": "合併其他肩部病變時準確度下降（特異度僅約 51-52%），而這正是常見的臨床情境，故臨床價值評為低；應與其他肱二頭肌／SLAP 測試合併使用。", "tags": ["SLAP", "剪力 shear", "價值弱 weak"]}, {"slug": "anterior-slide-test", "title_en": "Anterior Slide Test", "link": "https://www.physiotutors.com/wiki/anterior-slide-test/", "youtube_ids": ["nLRNIiJfPIg"], "accuracy": {"sensitivity": "20%", "specificity": "73.8%", "lr_plus": "not reported (~0.76 calculated)", "lr_minus": "not reported (~1.08 calculated)", "source": "Somerville et al. 2017, Surgery Journal"}, "title_zh": "前向滑動測試 Anterior Slide Test", "name_zh": "前向滑動測試", "purpose_zh": "將肱骨頭 (humeral head) 向前上方推向肱二頭肌附著點 (biceps anchor)，以檢測 SLAP 病灶 (SLAP lesion)。", "structure_zh": "上盂唇與肱二頭肌附著點 (superior labrum and biceps anchor / SLAP lesion)", "procedure_zh": "病人坐姿或站姿，雙手叉腰、拇指朝後。檢查者一手放在肩上，食指置於肩峰 (acromion) 前緣的關節線上；另一手在手肘後方向前並略向上推，病人抵抗。", "positive_zh": "檢查者手指下方出現前側肩痛、該處出現彈響或喀噠聲 (pop/click)，或重現病人過頭動作時的症狀。", "notes_zh": "臨床價值弱 (敏感度 20%、特異度 73.8%)，概似比接近 1 甚至更差；MR 關節攝影 (MR arthrography) 是 SLAP 撕裂較佳的診斷方式 (Symanski 2017)。", "tags": ["SLAP", "前向滑動 anterior slide", "價值弱 weak"]}, {"slug": "speeds-test", "title_en": "Speed's Test", "link": "https://www.physiotutors.com/wiki/speeds-test/", "youtube_ids": ["gbG_O9Gv8aQ"], "accuracy": {"sensitivity": "20% (SLAP)", "specificity": "78% (SLAP)", "lr_plus": "~0.9 (derived, not reported)", "lr_minus": "~1.0 (derived, not reported)", "source": "Hegedus et al. 2012 (meta-analysis, BJSM)"}, "title_zh": "Speed 測試 Speed's Test", "name_zh": "Speed 測試", "purpose_zh": "篩檢肱二頭肌長頭 (long head of biceps) 病變（肌腱病變 tendinopathy）與 SLAP 病灶 (SLAP lesion)。", "structure_zh": "肱二頭肌長頭肌腱 (long head of biceps tendon)；上盂唇 (superior labrum / SLAP)", "procedure_zh": "病人手肘伸直、前臂完全旋後 (supination)，肩關節屈曲 (flexion) 至 90 度。檢查者向下壓手臂，病人抵抗。較舊的版本則是在 0 到 60 度屈曲範圍內阻抗。", "positive_zh": "疼痛局限於肱二頭肌溝 (bicipital groove)，即肌腱進入關節囊處。", "notes_zh": "對 SLAP 病灶或肱二頭肌病變的確認與排除價值皆低 (SLAP 敏感度 20%、特異度 78%)；應與其他測試合併使用，例如上勾拳測試 (Upper Cut Test)。", "tags": ["肱二頭肌長頭 LHB", "SLAP", "價值弱 weak"]}, {"slug": "yergasons-test", "title_en": "Yergason's Test", "link": "https://www.physiotutors.com/wiki/yergasons-test/", "youtube_ids": ["_Cjahul5yuI"], "accuracy": {"sensitivity": "32% (biceps pathology); 12% (SLAP)", "specificity": "88% (biceps pathology); 87% (SLAP)", "lr_plus": "~2.7 biceps / ~0.9 SLAP (derived)", "lr_minus": "~0.8 biceps / ~1.0 SLAP (derived)", "source": "Micheroli et al. 2015 (biceps); Oh et al. 2008 (SLAP)"}, "title_zh": "Yergason 測試 Yergason's Test", "name_zh": "Yergason 測試", "purpose_zh": "評估肱骨橫韌帶 (transverse humeral ligament)、肱二頭肌長頭 (long head of biceps) 病變與 SLAP 病灶 (SLAP lesion)。", "structure_zh": "肱骨橫韌帶 (transverse humeral ligament)；肱二頭肌長頭肌腱 (long head of biceps tendon)；上盂唇 (superior labrum)", "procedure_zh": "手肘屈曲 90 度，前臂旋前 (pronation) 並貼住軀幹。病人抵抗檢查者的阻力做旋後 (supination)，檢查者同時在肱二頭肌溝 (bicipital groove) 觸診肱二頭肌肌腱。", "positive_zh": "肌腱自溝中彈出，提示肱骨橫韌帶 (transverse humeral ligament) 撕裂；僅有疼痛或壓痛而無彈出，提示肱二頭肌肌腱病變 (biceps tendinosis) 或 SLAP 病灶。", "notes_zh": "敏感度低（肱二頭肌病變 32%、SLAP 12%），陰性結果無法排除任何病灶；針對 SLAP，建議改用肱二頭肌負荷 II 測試 (Biceps Load II Test) 或 O'Brien 測試 (O'Brien Test)。", "tags": ["肱二頭肌長頭 LHB", "肱骨橫韌帶 transverse humeral ligament", "SLAP"]}, {"slug": "upper-cut-test", "title_en": "Upper Cut Test", "link": "https://www.physiotutors.com/wiki/upper-cut-test/", "youtube_ids": ["G1JnCksdhLM"], "accuracy": {"sensitivity": "79%", "specificity": "78%", "lr_plus": "not reported (~3.6 derived)", "lr_minus": "not reported (~0.27 derived)", "source": "Kibler et al. 2009 (AJSM); values refer to biceps tendinopathy"}, "title_zh": "上勾拳測試 Upper Cut Test", "name_zh": "上勾拳測試", "purpose_zh": "針對上方肱二頭肌-盂唇複合體 (superior biceps-labrum complex) 與肱二頭肌肌腱 (biceps tendon) 病變的誘發測試。", "structure_zh": "肱二頭肌長頭肌腱 (long head of biceps tendon)；上盂唇 (superior labrum / SLAP)", "procedure_zh": "肩關節中立位，手肘屈曲 90 度，前臂旋後 (supination) 並握拳。檢查者握住手腕給予阻力，病人快速將拳頭向上、向對側朝下巴方向揮出，如同上勾拳 (uppercut) 動作。", "positive_zh": "前側肩部出現疼痛或疼痛性彈響 (painful pop)。", "notes_zh": "在 Kibler 的研究中是肱二頭肌肌腱病變 (biceps tendinopathy) 最準確的單一測試 (敏感度 79%、特異度 78%)；與 Speed 測試 (Speed's Test) 合併可得到最佳的迴歸模型。", "tags": ["肱二頭肌長頭 LHB", "肌腱病變 tendinopathy", "cluster"]}, {"slug": "biceps-squeeze-test", "title_en": "Biceps Squeeze Test", "link": "https://www.physiotutors.com/wiki/biceps-squeeze-test/", "youtube_ids": ["EGKj3rB2Jn8"], "accuracy": {"sensitivity": "96%", "specificity": "not determinable (too few negatives in study)", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Ruland & Bowen 2005 (CORR)"}, "title_zh": "肱二頭肌擠壓測試 Biceps Squeeze Test", "name_zh": "肱二頭肌擠壓測試", "purpose_zh": "藉由觀察擠壓肌腹是否仍能引發前臂旋後 (supination)，檢查遠端肱二頭肌肌腱斷裂 (distal biceps tendon rupture)。", "structure_zh": "遠端肱二頭肌肌腱 (distal biceps tendon)，斷裂 (rupture)", "procedure_zh": "病人坐姿，前臂置於大腿上，手肘屈曲約 60-80 度，前臂略為旋前 (pronation) 以拉緊肌腱。檢查者握住肱二頭肌 (biceps) 的肌腹與遠端肌腱交界處 (myotendinous junction)，用力擠壓。", "positive_zh": "擠壓時觀察不到前臂旋後 (supination)。", "notes_zh": "相當於阿基里斯腱 (Achilles tendon) 的 Thompson 測試 (Thompson test)；原始研究方法學有限制（特異度無法計算），故臨床價值評為弱。", "tags": ["遠端肱二頭肌 distal biceps", "肌腱斷裂 rupture", "價值弱 weak"]}, {"slug": "biceps-crease-interval", "title_en": "Biceps Crease Interval", "link": "https://www.physiotutors.com/wiki/biceps-crease-interval/", "youtube_ids": ["i30_n5oZEOA"], "accuracy": {"sensitivity": "88%", "specificity": "50%", "lr_plus": "not reported (~1.8 derived)", "lr_minus": "not reported (~0.24 derived)", "source": "ElMaraghy et al. 2008; updated values Devereaux & ElMaraghy 2013; ICC 0.79"}, "title_zh": "肱二頭肌皺褶間距 Biceps Crease Interval", "name_zh": "肱二頭肌皺褶間距", "purpose_zh": "測量遠端肱二頭肌 (distal biceps) 的回縮程度，以辨識需要及早轉介手術的完全斷裂 (complete rupture)。", "structure_zh": "遠端肱二頭肌肌腱 (distal biceps tendon)，完全斷裂合併肌肉回縮 (complete rupture with muscle retraction)", "procedure_zh": "先標記肘前窩屈曲皺褶 (antecubital flexion crease)；接著在手肘伸直、前臂旋後 (supination) 下，沿長軸撫觸遠端肱二頭肌，找出肌肉急轉向肘窩的「肱二頭肌尖 (biceps cusp)」並標記。測量兩個標記間的距離（精確至 0.1 公分），並於對側手臂重複。", "positive_zh": "間距大於 6 公分，或患側／健側比值大於 1.2。", "notes_zh": "單獨使用價值弱 (敏感度 88%、特異度 50%，ICC 0.79)；應搭配 Hook 測試 (Hook test) 或 Ludington 測試 (Ludington's test)。", "tags": ["遠端肱二頭肌 distal biceps", "肌腱斷裂 rupture", "測量 measurement"]}, {"slug": "3-pack-examination", "title_en": "3-Pack Examination", "link": "https://www.physiotutors.com/wiki/3-pack-examination/", "youtube_ids": ["r_bfAzWzINY"], "accuracy": {"sensitivity": "Active compression 88-96%; tunnel palpation 82-98%; throwing test 73-76%", "specificity": "Active compression 46-64%; tunnel palpation 65-79%; throwing test 65-79%", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Taylor et al. 2017 (Arthroscopy)"}, "title_zh": "三合一檢查 3-Pack Examination", "name_zh": "三合一檢查", "purpose_zh": "由三項測試組成的檢查組合，評估肱二頭肌-盂唇複合體 (biceps-labrum complex) 的關節內區、交界區與肱二頭肌隧道區 (bicipital tunnel) 三個區域。", "structure_zh": "肱二頭肌長頭肌腱 (long head of biceps tendon) 與盂唇 (labrum)；SLAP 病灶 (SLAP lesion)、肱二頭肌隧道疾病 (bicipital tunnel disease)", "procedure_zh": "主動壓迫測試 (Active Compression Test)：肩關節屈曲 90 度、內收 10-15 度、拇指朝下，抵抗向下壓力，再以掌心朝上重複。投擲測試 (Throwing Test)：肩外展 90 度、手肘屈曲 90 度並最大外轉 (external rotation)，病人進入投擲早期加速期動作時給予等長阻力。肱二頭肌隧道觸診 (Bicipital Tunnel Palpation)：手臂中立位，觸診關節外的肌腱段，並旋轉手臂以確認位置。", "positive_zh": "深層肩痛；主動壓迫測試為拇指朝下疼痛而掌心朝上減輕，觸診則為疼痛局限於肱二頭肌隧道 (bicipital tunnel)。", "notes_zh": "兩項高敏感度測試（主動壓迫 88-96%、隧道觸診 82-98%）有助於排除 (rule out) 肱二頭肌-盂唇病灶；但僅有一項研究評估過此組合，證據等級評為中等。", "tags": ["肱二頭肌-盂唇複合體 biceps-labrum complex", "SLAP", "cluster", "排除 rule out"]}, {"slug": "ac-joint-pain", "title_en": "AC Joint Pain", "link": "https://www.physiotutors.com/wiki/ac-joint-pain/", "youtube_ids": ["JsOe9kuvrDg"], "accuracy": {"sensitivity": "96% (fewer than 2/5 items rules out)", "specificity": "95% (4+/5 items)", "lr_plus": "4.98", "lr_minus": "0.09", "source": "Cadogan et al. 2013 (BMC Musculoskelet Disord)"}, "title_zh": "肩鎖關節疼痛病史與理學檢查組合 AC Joint Pain", "name_zh": "肩鎖關節疼痛病史與理學檢查組合", "purpose_zh": "以病史與理學檢查組成的臨床組合 (cluster)，用於辨識非外傷性的肩鎖關節 (acromioclavicular joint, AC joint) 疼痛。", "structure_zh": "肩鎖關節 (AC joint)，非外傷性疼痛", "procedure_zh": "共檢查五個項目：(1) 發病機轉為重複性動作；(2) 疼痛未轉移至手肘以下；(3) 肩鎖關節 (AC joint) 增厚或腫脹；(4) 被動盂肱關節 (glenohumeral joint) 外展時沒有典型疼痛；(5) 肩外展 90 度下做外旋 (external rotation) 時沒有典型疼痛。", "positive_zh": "五項中有四項以上符合即為陽性。", "notes_zh": "疼痛轉移至手肘遠端時，肩鎖關節 (AC joint) 疼痛的可能性極低；少於 2/5 項可用來排除。由於信賴區間 (confidence interval) 很寬，此組合的臨床價值僅屬中等。", "tags": ["肩鎖關節 AC joint", "cluster", "病史 history"]}, {"slug": "cross-body-adduction-test", "title_en": "Cross Body Adduction Test", "link": "https://www.physiotutors.com/wiki/cross-body-adduction-test/", "youtube_ids": ["DKLvt816x6o"], "accuracy": {"sensitivity": "77%", "specificity": "79%", "lr_plus": "not reported (~3.7 derived)", "lr_minus": "not reported (~0.29 derived)", "source": "Chronopoulos et al. 2004 (AJSM)"}, "title_zh": "跨體內收測試 Cross Body Adduction Test", "name_zh": "跨體內收測試", "purpose_zh": "誘發敏感化的肩鎖關節 (acromioclavicular joint, AC joint)，例如肩鎖關節退化性關節炎 (AC joint osteoarthritis)。", "structure_zh": "肩鎖關節 (AC joint)", "procedure_zh": "病人的手臂先抬至肩屈曲 (flexion) 90 度，接著檢查者將手臂帶往身體對側，做最大幅度的水平內收 (horizontal adduction)。", "positive_zh": "肩膀頂端、靠近肩鎖關節 (AC joint) 處出現疼痛。", "notes_zh": "不建議單獨使用，應納入肩鎖關節測試組合 (AC joint cluster) 中判讀；敏感度 77%、特異度 79%。", "tags": ["肩鎖關節 AC joint", "誘發測試 provocation", "cluster"]}, {"slug": "ac-joint-line-tenderness", "title_en": "AC Joint Line Tenderness", "link": "https://www.physiotutors.com/wiki/ac-joint-line-tenderness/", "youtube_ids": ["U31quA3ZsjY"], "accuracy": {"sensitivity": "96%", "specificity": "10%", "lr_plus": "~1.1 (derived)", "lr_minus": "0.4", "source": "Walton et al. 2004 (JBJS)"}, "title_zh": "肩鎖關節線壓痛 AC Joint Line Tenderness", "name_zh": "肩鎖關節線壓痛", "purpose_zh": "藉由觸診肩鎖關節 (acromioclavicular joint, AC joint) 的關節線，偵測敏感化的關節。", "structure_zh": "肩鎖關節 (AC joint)", "procedure_zh": "病人坐姿，手臂自然垂放於體側。檢查者先找到肩峰 (acromion)，沿其邊緣向前內側觸診直到鎖骨 (clavicle)，即可找到關節線，然後施加壓力。", "positive_zh": "在肩鎖關節 (AC joint) 上方重現疼痛。", "notes_zh": "敏感度 96% 但特異度僅 10%，幾乎沒有特異性；儘管敏感度很高，LR- 0.4 仍偏高，無法可靠排除肩鎖關節 (AC joint) 病變。", "tags": ["肩鎖關節 AC joint", "觸診 palpation", "高敏感度 high sensitivity"]}, {"slug": "paxinos-sign", "title_en": "Paxinos Sign", "link": "https://www.physiotutors.com/wiki/paxinos-sign/", "youtube_ids": ["fiEeyT9VsCc"], "accuracy": {"sensitivity": "79%", "specificity": "50%", "lr_plus": "not reported (~1.6 derived)", "lr_minus": "not reported (~0.42 derived)", "source": "Walton et al. 2004 (JBJS)"}, "title_zh": "Paxinos 徵象 Paxinos Sign", "name_zh": "Paxinos 徵象", "purpose_zh": "針對肩鎖關節 (acromioclavicular joint, AC joint) 病變的壓迫測試。", "structure_zh": "肩鎖關節 (AC joint)", "procedure_zh": "病人坐姿、手臂放鬆。檢查者站在病人後方，以拇指勾住肩峰 (acromion) 的後外側下緣，食指與中指放在鎖骨 (clavicle) 中段。接著拇指將肩峰向前上方推，同時手指將鎖骨向下壓。", "positive_zh": "肩鎖關節 (AC joint) 區域出現疼痛。", "notes_zh": "敏感度 79%、特異度 50%，單獨使用因特異度低而臨床價值薄弱；主要用於 Krill 2018 的肩鎖關節測試組合 (AC joint clusters) 中。", "tags": ["肩鎖關節 AC joint", "壓迫測試 compression", "cluster"]}, {"slug": "ac-resisted-extension-test", "title_en": "AC Resisted Extension Test", "link": "https://www.physiotutors.com/wiki/ac-resisted-extension-test/", "youtube_ids": ["CHTIvg9a13M"], "accuracy": {"sensitivity": "72%", "specificity": "85%", "lr_plus": "not reported (~4.8 derived)", "lr_minus": "not reported (~0.33 derived)", "source": "Chronopoulos et al. 2004 (AJSM)"}, "title_zh": "肩鎖關節阻抗伸展測試 AC Resisted Extension Test", "name_zh": "肩鎖關節阻抗伸展測試", "purpose_zh": "用於誘發有症狀的肩鎖關節 (acromioclavicular joint, AC joint) 的激發測試。", "structure_zh": "肩鎖關節 (AC joint)", "procedure_zh": "病人坐姿，手臂屈曲 (flexion) 至 90 度。檢查者將手放在病人手臂外側，請病人向外推（抵抗水平內收 / 朝水平伸展方向用力），檢查者給予阻力。", "positive_zh": "肩膀頂端、靠近肩鎖關節 (AC joint) 處出現疼痛。", "notes_zh": "敏感度 72%、特異度 85%，不是可單獨診斷的測試，但作為肩鎖關節測試組合 (AC joint cluster) 的一部分相當有用。", "tags": ["肩鎖關節 AC joint", "阻抗測試 resisted", "cluster"]}, {"slug": "ac-shear-test", "title_en": "AC Shear Test", "link": "https://www.physiotutors.com/wiki/ac-shear-test/", "youtube_ids": ["lI_iAiJMnOM"], "accuracy": {"sensitivity": "not studied", "specificity": "not studied", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Davies et al. 1981 (description only; no accuracy study)"}, "title_zh": "肩鎖關節剪力測試 AC Shear Test", "name_zh": "肩鎖關節剪力測試", "purpose_zh": "意圖單獨誘發肩鎖關節 (acromioclavicular joint, AC joint) 病變的壓迫激發測試。", "structure_zh": "肩鎖關節 (AC joint)", "procedure_zh": "病人坐姿。檢查者雙手呈杯狀罩住肩膀，一手置於鎖骨 (clavicle)，另一手置於肩胛棘 (scapular spine)。接著將兩手掌根互相擠壓，使肩鎖關節 (AC joint) 產生剪力。", "positive_zh": "肩鎖關節 (AC joint) 出現異常活動或疼痛。", "notes_zh": "此測試僅有 Davies 1981 的描述，沒有任何效度 (validity) 研究資料，臨床價值存疑。", "tags": ["肩鎖關節 AC joint", "剪力測試 shear", "無效度資料 no validity data"]}, {"slug": "ac-joint-cluster", "title_en": "AC Joint Cluster", "link": "https://www.physiotutors.com/wiki/ac-joint-cluster/", "youtube_ids": ["npHPXrV6_JI"], "accuracy": {"sensitivity": "25%", "specificity": "97%", "lr_plus": "not reported (~8.3 derived)", "lr_minus": "not reported (~0.77 derived)", "source": "Chronopoulos et al. 2004 (AJSM)"}, "title_zh": "肩鎖關節測試組合 AC Joint Cluster", "name_zh": "肩鎖關節測試組合", "purpose_zh": "由三項激發測試組成的組合 (cluster)，用於辨識肩鎖關節 (acromioclavicular joint, AC joint) 是否為肩痛來源。", "structure_zh": "肩鎖關節 (AC joint)", "procedure_zh": "病人坐姿，依序進行三項測試。跨體內收測試 (cross body adduction test)：手臂屈曲 90 度後帶至最大水平內收。肩鎖關節阻抗伸展測試 (AC resisted extension test)：手臂屈曲 90 度，病人抵抗檢查者施加的水平內收力。O'Brien 測試 (O'Brien's active compression test)：手臂屈曲 90 度並水平內收 10 度，先在內旋 (internal rotation) 再在外旋 (external rotation) 下抵抗向下的壓力。", "positive_zh": "三項全部陽性：前兩項在肩鎖關節 (AC joint) 區域出現疼痛，O'Brien 測試在內旋時疼痛、外旋時疼痛消失。", "notes_zh": "三項全陽性時特異度高達 97%，但敏感度僅 25%，因此陰性組合無法排除肩鎖關節 (AC joint) 問題。典型病人為男性體力勞動者與健身族群。", "tags": ["肩鎖關節 AC joint", "cluster", "高特異度 high specificity"]}, {"slug": "diagnosis-of-a-symptomatic-ac-joint", "title_en": "Diagnosis of a Symptomatic AC Joint", "link": "https://www.physiotutors.com/wiki/diagnosis-of-a-symptomatic-ac-joint/", "youtube_ids": ["iyM5HJd7aLg"], "accuracy": {"sensitivity": "93.7% (negative Paxinos + negative Hawkins-Kennedy)", "specificity": "95.8% (positive Paxinos + positive O'Brien)", "lr_plus": "2.71 (Paxinos + O'Brien)", "lr_minus": "0.35 (Paxinos + Hawkins-Kennedy)", "source": "Krill et al. 2018 (systematic review, Phys Sportsmed)"}, "title_zh": "有症狀肩鎖關節的診斷組合 Diagnosis of a Symptomatic AC Joint", "name_zh": "有症狀肩鎖關節的診斷組合", "purpose_zh": "以兩組特殊測試組合 (clusters) 分別用於確診 (rule in) 與排除 (rule out) 有症狀的肩鎖關節 (acromioclavicular joint, AC joint)。", "structure_zh": "肩鎖關節 (AC joint)", "procedure_zh": "確診組合 (rule-in cluster)：先做 Paxinos 徵象 (Paxinos sign)，再做 O'Brien 主動壓迫測試 (O'Brien's active compression test)——手臂屈曲 90 度、內旋拇指朝下抵抗向下壓力，再改為掌心朝上重複。排除組合 (rule-out cluster)：Paxinos 徵象 (Paxinos sign) 加上 Hawkins-Kennedy 測試 (Hawkins-Kennedy test)——手臂屈曲 90 度、肘屈曲 90 度，檢查者固定肩胛骨 (scapula) 後被動內旋。", "positive_zh": "Paxinos 與 O'Brien 皆陽性，提示肩鎖關節 (AC joint) 受累（特異度 95.8%）；Paxinos 與 Hawkins-Kennedy 皆陰性，則肩鎖關節病變不太可能（敏感度 93.7%）。", "notes_zh": "兩組組合皆被評為中等價值 (moderate value)；準確度雖不算高（LR+ 2.71、LR- 0.35），但仍是目前最好的理學檢查，而較早的 Chronopoulos 組合在方法學上有缺陷。", "tags": ["肩鎖關節 AC joint", "cluster", "rule in / rule out"]}, {"slug": "scapular-dyskinesis-test", "title_en": "Scapular Dyskinesis Test", "link": "https://www.physiotutors.com/wiki/scapular-dyskinesis-test/", "youtube_ids": ["btp9l6vD330"], "accuracy": {"sensitivity": null, "specificity": null, "lr_plus": null, "lr_minus": null, "source": "Reliability only: kappa 0.48-0.61 (moderate to substantial), McClure et al. 2009, J Athl Train"}, "title_zh": "肩胛骨動作障礙測試 Scapular Dyskinesis Test", "name_zh": "肩胛骨動作障礙測試", "purpose_zh": "一種標準化的觀察法，用於偵測肩胛骨動作障礙 (scapular dyskinesis)，可作為 Kibler 四型分類 (Kibler's four-type classification) 的替代方案。", "structure_zh": "肩胛骨動作障礙 (scapular dyskinesis)，依 McClure 等人 2009 年的分類", "procedure_zh": "病人手持啞鈴（體重低於約 68 公斤者用 1.4 公斤，否則用 2.3 公斤）。先做 5 次雙側肩屈曲 (bilateral shoulder flexion)，再做 5 次雙側額狀面外展 (frontal-plane abduction)，過程中手肘打直，上抬與下放各以 3 秒的節奏進行。檢查者從後方觀察兩側肩胛骨 (scapula) 是否出現翼狀突出 (winging) 及/或節律異常 (dysrhythmia)。", "positive_zh": "動作中出現肩胛骨翼狀突出 (scapular winging) 及/或節律異常 (dysrhythmia)，分級為正常 (normal)、輕微 (subtle) 或明顯 (obvious) 的動作障礙。", "notes_zh": "目前僅有信度 (reliability) 資料（kappa 0.48–0.61，中等至相當程度），沒有效度 (validity) 研究。其他替代方案包括 Kibler 四型分類 (Kibler's four-type classification) 與簡單的是/否判斷。", "tags": ["肩胛骨動作障礙 scapular dyskinesis", "觀察 observation", "信度 reliability"]}, {"slug": "scapular-assistance-test", "title_en": "Scapular Assistance Test", "link": "https://www.physiotutors.com/wiki/scapular-assistance-test/", "youtube_ids": ["pfXdmXL9ouM"], "accuracy": {"sensitivity": null, "specificity": null, "lr_plus": null, "lr_minus": null, "source": "Reliability only: inter-rater kappa 0.53 (scapular plane) and 0.62 (sagittal plane), Rabin et al. 2006, JOSPT"}, "title_zh": "肩胛骨輔助測試 Scapular Assistance Test", "name_zh": "肩胛骨輔助測試", "purpose_zh": "一種症狀修飾測試 (symptom-modification test)，檢查以手輔助肩胛骨 (scapula) 動作是否能減輕病人的肩痛。", "structure_zh": "肩胛骨動作障礙 (scapular dyskinesis) 情境下的肩胛穩定肌 (scapular stabilizers) 功能；並非診斷動作障礙本身的測試", "procedure_zh": "病人站姿。檢查者一手固定鎖骨 (clavicle) 與肩胛棘 (scapular spine)，另一手握住肩胛骨下角 (inferior angle of scapula)。病人抬高手臂（例如空罐測試 (empty can) 的姿勢），同時檢查者協助肩胛骨做向上旋轉 (upward rotation) 與後傾 (posterior tilt)，並將疼痛反應與未輔助的抬臂動作比較。", "positive_zh": "輔助下抬臂的疼痛比未輔助時減輕，提示肩胛穩定肌 (scapular stabilizers) 無力。", "notes_zh": "僅有信度資料（評估者間 kappa：肩胛面 0.53、矢狀面 0.62）。陽性結果支持在治療計畫中加入肩胛穩定運動 (scapular stabilization exercises)。", "tags": ["肩胛骨 scapula", "症狀修飾測試 symptom modification", "肩胛穩定肌 scapular stabilizers"]}, {"slug": "scapular-retraction-test", "title_en": "Scapular Retraction Test (SRT)", "link": "https://www.physiotutors.com/wiki/scapular-retraction-test/", "youtube_ids": ["tyxDTbVn_gg"], "accuracy": {"sensitivity": null, "specificity": null, "lr_plus": null, "lr_minus": null, "source": "None reported; page cites Kibler, Sciascia & Dome 2006, Am J Sports Med"}, "title_zh": "肩胛骨後縮測試 Scapular Retraction Test (SRT)", "name_zh": "肩胛骨後縮測試", "purpose_zh": "一種症狀修飾測試 (symptom-modification test)，檢查將肩胛骨 (scapula) 穩定於後縮 (retraction) 位置是否能減輕肩痛或增加肌力。", "structure_zh": "有肩痛與肩胛骨動作障礙 (scapular dyskinesis) 病人的肩胛穩定肌 (scapular stabilizers) 無力", "procedure_zh": "病人站姿或坐姿。檢查者一手固定鎖骨 (clavicle) 與肩胛棘 (scapular spine)，並以前臂將肩胛骨 (scapula) 壓向胸廓壁 (thoracic wall)，維持在後縮位置。接著在此穩定狀態下進行空罐測試 (empty can test)，並與未輔助的空罐測試比較。", "positive_zh": "輔助下的空罐測試疼痛較少（或肌力較強），提示肩胛穩定肌 (scapular stabilizers) 無力。", "notes_zh": "沒有診斷準確度資料（來源為 Kibler 等人 2006）。陽性結果支持加入肩胛穩定運動 (scapular stabilization exercises)；肩胛骨輔助測試 (scapular assistance test) 為其搭配使用的測試。", "tags": ["肩胛骨 scapula", "症狀修飾測試 symptom modification", "空罐測試 empty can"]}, {"slug": "serratus-anterior-strength-test", "title_en": "Serratus Anterior Strength Test", "link": "https://www.physiotutors.com/wiki/serratus-anterior-strength-test/", "youtube_ids": ["jatVx3v7qDI"], "accuracy": {"sensitivity": null, "specificity": null, "lr_plus": null, "lr_minus": null, "source": "None reported; page cites Magee, Orthopedic Physical Assessment, 2014"}, "title_zh": "前鋸肌肌力測試 Serratus Anterior Strength Test", "name_zh": "前鋸肌肌力測試", "purpose_zh": "徒手肌力測試前鋸肌 (serratus anterior)，此肌為肩胛骨 (scapula) 前突 (protraction)、向上旋轉 (upward rotation) 與穩定的重要肌肉。", "structure_zh": "前鋸肌 (serratus anterior)，由長胸神經 (long thoracic nerve) 支配；無力時產生肩胛骨翼狀突出 (scapular winging)", "procedure_zh": "病人站姿，手臂屈曲 (flexion) 90 度、手肘伸直。檢查者將手臂向後推，病人抵抗，同時觀察肩胛骨內緣 (medial border of scapula)。另可改用靠牆伏地挺身 (wall push-up) 或地板伏地挺身 (floor push-up) 來施加負荷。", "positive_zh": "抵抗阻力時出現肩胛骨內緣翼狀突出 (medial scapular winging)，表示前鋸肌 (serratus anterior) 無力。", "notes_zh": "沒有診斷準確度資料（來源為 Magee 2014）。前鋸肌 (serratus anterior) 是主要的肩胛穩定肌，常常訓練不足。", "tags": ["前鋸肌 serratus anterior", "肌力測試 strength test", "翼狀肩胛 scapular winging"]}, {"slug": "trapezius-strength-test", "title_en": "Trapezius Strength Test (All 3 Parts)", "link": "https://www.physiotutors.com/wiki/trapezius-strength-test/", "youtube_ids": ["9tfVeIhlY-o"], "accuracy": {"sensitivity": null, "specificity": null, "lr_plus": null, "lr_minus": null, "source": "None reported; page cites Ekstrom et al. 2003, JOSPT (EMG study)"}, "title_zh": "斜方肌肌力測試（上、中、下三部分）Trapezius Strength Test (All 3 Parts)", "name_zh": "斜方肌肌力測試（上、中、下三部分）", "purpose_zh": "徒手肌力測試斜方肌 (trapezius) 整體以及上、中、下三個部分。", "structure_zh": "上斜方肌 (upper/descending trapezius)、中斜方肌 (middle/transverse trapezius)、下斜方肌 (lower/ascending trapezius)；未指定特定病變", "procedure_zh": "整體：病人坐姿，雙手舉過頭約 120 度外展，病人將手肘向前推，檢查者觀察肩胛骨 (scapula) 的穩定度。上斜方肌 (upper trapezius)：手臂略外展下做聳肩 (shoulder shrug)，或在同側頭部側彎 (ipsilateral side-bending) 下做阻抗外展。中斜方肌 (middle trapezius)：俯臥，手臂外展 90 度並外旋，抵抗水平伸展 (horizontal extension)。下斜方肌 (lower trapezius)：俯臥，手臂外展約 120 度並外旋，抵抗斜向伸展 (diagonal extension)。", "positive_zh": "中斜方肌：無法做肩胛骨後縮 (scapular retraction)。下斜方肌：抵抗時出現肩胛骨前突 (scapular protraction)。各自代表該部分無力。", "notes_zh": "沒有診斷準確度資料（來源為 Ekstrom 等人 2003 的肌電圖研究）。測試上斜方肌 (upper trapezius) 時讓手臂略外展，可減少菱形肌 (rhomboids) 與提肩胛肌 (levator scapulae) 的參與。", "tags": ["斜方肌 trapezius", "肌力測試 strength test", "肩胛穩定肌 scapular stabilizers"]}, {"slug": "rhomboid-strength-test", "title_en": "Rhomboid Strength Test", "link": "https://www.physiotutors.com/wiki/rhomboid-strength-test/", "youtube_ids": ["Gn3s7sVtyWo"], "accuracy": {"sensitivity": null, "specificity": null, "lr_plus": null, "lr_minus": null, "source": "None reported; page cites Magee, Orthopedic Physical Assessment, 2014"}, "title_zh": "菱形肌肌力測試 Rhomboid Strength Test", "name_zh": "菱形肌肌力測試", "purpose_zh": "徒手肌力測試作為肩胛骨後縮肌 (scapular retractors) 的大菱形肌 (rhomboid major) 與小菱形肌 (rhomboid minor)。", "structure_zh": "大、小菱形肌 (rhomboid major and minor)，由肩胛背神經 (dorsal scapular nerve) 支配；未指定特定病變", "procedure_zh": "病人俯臥，受測手臂放在背後，手置於對側後口袋的高度。檢查者將食指沿肩胛骨內緣 (medial scapular border) 滑入其下方，同時請病人輕輕將肩膀向前推以放鬆斜方肌 (trapezius)。接著病人將前臂與手抬離背部，檢查者給予阻力。", "positive_zh": "正常時檢查者的手指會被肩胛骨 (scapula) 下方推出；若無法推出，表示菱形肌 (rhomboids) 無力。", "notes_zh": "沒有診斷準確度資料（來源為 Magee 2014）。測試前必須先放鬆斜方肌 (trapezius)，才能單獨評估菱形肌 (rhomboids)。", "tags": ["菱形肌 rhomboids", "肌力測試 strength test", "肩胛骨後縮 scapular retraction"]}, {"slug": "latissimus-dorsi-strength-test", "title_en": "Latissimus Dorsi Strength Test", "link": "https://www.physiotutors.com/wiki/latissimus-dorsi-strength-test/", "youtube_ids": ["BIQtRi0-ECQ"], "accuracy": {"sensitivity": null, "specificity": null, "lr_plus": null, "lr_minus": null, "source": "None reported; page cites Magee, Orthopedic Physical Assessment, 2014"}, "title_zh": "闊背肌肌力測試 Latissimus Dorsi Strength Test", "name_zh": "闊背肌肌力測試", "purpose_zh": "徒手肌力測試作為肱骨 (humerus) 伸展肌、內收肌與內旋肌的闊背肌 (latissimus dorsi)。", "structure_zh": "闊背肌 (latissimus dorsi)，由胸背神經 (thoracodorsal nerve) 支配；未指定特定病變", "procedure_zh": "病人將手臂在肩胛面 (scapular plane) 抬至約 90 度。檢查者觸診闊背肌 (latissimus dorsi) 肌腹，接著在病人做手臂伸展 (extension) 與內旋 (internal rotation) 時給予阻力。", "positive_zh": "來源未明確定義；一般以與對側相比，抵抗阻力時出現無力或疼痛來判讀。", "notes_zh": "沒有診斷準確度資料（來源為 Magee 2014），原頁面內容簡短。通常與斜方肌 (trapezius)、菱形肌 (rhomboids) 及前鋸肌 (serratus anterior) 肌力測試一併進行。", "tags": ["闊背肌 latissimus dorsi", "肌力測試 strength test"]}, {"slug": "adson-test", "title_en": "Adson Test", "link": "https://www.physiotutors.com/wiki/adson-test/", "youtube_ids": ["BnwwvuSagIU"], "accuracy": {"sensitivity": "79%", "specificity": "76%", "lr_plus": null, "lr_minus": null, "source": "Gillard et al. 2001, Joint Bone Spine"}, "title_zh": "Adson 測試 Adson Test", "name_zh": "Adson 測試", "purpose_zh": "藉由縮窄斜角肌三角 (interscalene triangle) 來篩檢胸廓出口症候群 (thoracic outlet syndrome, TOS)。", "structure_zh": "斜角肌三角 (interscalene triangle)：前斜角肌 (anterior scalene)、中斜角肌 (middle scalene) 與第一肋骨 (first rib) 之間；壓迫臂神經叢 (brachial plexus) 及/或鎖骨下血管 (subclavian vessels)", "procedure_zh": "病人坐直，雙臂有支撐。請病人將頭轉向並後仰至受測側，深吸一口氣並閉氣最長 30 秒，檢查者同時觸診橈動脈 (radial artery) 脈搏。另一變化版本是將肩膀置於 15 度外展，頭部維持受測姿勢，正常呼吸 1 分鐘。", "positive_zh": "橈動脈 (radial artery) 脈搏消失，或重現病人熟悉的症狀。", "notes_zh": "敏感度 79%、特異度 76%，準確度僅屬中等，且參考研究 (Gillard 2001) 未以 MRI 作為黃金標準，因此臨床價值薄弱。", "tags": ["TOS", "斜角肌三角 interscalene triangle", "橈動脈脈搏 radial pulse"]}, {"slug": "costoclavicular-maneuver", "title_en": "Costoclavicular Maneuver", "link": "https://www.physiotutors.com/wiki/costoclavicular-maneuver/", "youtube_ids": ["XEWO_cFy5YI"], "accuracy": {"sensitivity": null, "specificity": null, "lr_plus": null, "lr_minus": null, "source": "No diagnostic accuracy studies; page cites Illig et al. 2016 and Watson et al. 2009 as background"}, "title_zh": "肋鎖操作測試 Costoclavicular Maneuver", "name_zh": "肋鎖操作測試", "purpose_zh": "對肋鎖間隙 (costoclavicular space) 施加壓力，找出誘發或緩解胸廓出口症候群 (thoracic outlet syndrome, TOS) 症狀的姿勢。", "structure_zh": "肋鎖間隙 (costoclavicular space)；鎖骨下動脈 (subclavian artery)、鎖骨下靜脈 (subclavian vein) 或臂神經叢 (brachial plexus) 受壓，例如被鎖骨下肌 (subclavius) 或肋喙韌帶 (costocoracoid ligament) 壓迫", "procedure_zh": "病人坐姿，前臂放在大腿上。檢查者依序將肩帶 (shoulder girdle) 帶入後縮 (retraction)、下壓 (depression)、上提 (elevation) 與前突 (protraction)，每個姿勢維持最長 30 秒，同時監測橈動脈 (radial artery) 脈搏與症狀。變化版本包括手臂置於體側維持 1 分鐘，或採用軍姿 (military brace position)。", "positive_zh": "沒有嚴格判定標準；檢查者記錄哪些姿勢會重現症狀或改變脈搏，其中軍姿 (military brace position) 最可能使脈搏消失。", "notes_zh": "沒有診斷準確度研究，臨床價值存疑；主要用途是找出誘發與緩解症狀的姿勢，以引導治療方向。", "tags": ["TOS", "肋鎖間隙 costoclavicular space", "姿勢測試 positional test"]}, {"slug": "eden-test", "title_en": "Eden Test (Military Brace Test)", "link": "https://www.physiotutors.com/wiki
