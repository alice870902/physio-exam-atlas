/eden-test/", "youtube_ids": ["Mifo6ZzkNLA"], "accuracy": {"sensitivity": null, "specificity": null, "lr_plus": null, "lr_minus": null, "source": "No diagnostic accuracy studies; page cites Watson, Pizzari & Balster 2009, Man Ther"}, "title_zh": "Eden 測試（軍姿測試）Eden Test (Military Brace Test)", "name_zh": "Eden 測試（軍姿測試）", "purpose_zh": "藉由壓迫肋鎖間隙 (costoclavicular space) 內的神經血管束 (neurovascular bundle) 來篩檢胸廓出口症候群 (thoracic outlet syndrome, TOS)。", "structure_zh": "肋鎖間隙 (costoclavicular space)；臂神經叢 (brachial plexus) 及/或鎖骨下血管 (subclavian vessels)（肋鎖症候群 costoclavicular syndrome）", "procedure_zh": "病人坐直，採軍姿 (military posture)：挺胸、雙肩向後向下拉。檢查者將肩膀（單側或雙側）帶入伸展 (extension)，同時觸診橈動脈 (radial artery) 脈搏最長 1 分鐘。部分作者會加上深吸氣閉氣，以進一步縮窄間隙。", "positive_zh": "橈動脈 (radial artery) 脈搏減弱或消失，或重現病人熟悉的症狀。", "notes_zh": "沒有診斷準確度研究（來源為 Watson 等人 2009），臨床價值存疑；加上閉氣可能同時縮窄其他出口間隙而造成偽陽性 (false positive)。", "tags": ["TOS", "肋鎖間隙 costoclavicular space", "軍姿 military brace"]}, {"slug": "cyriax-release-test", "title_en": "Cyriax Release Test", "link": "https://www.physiotutors.com/wiki/cyriax-release-test/", "youtube_ids": ["kX1mUhyjZwk"], "accuracy": {"sensitivity": null, "specificity": "97.4% at 1 min; 87.8% at 3 min", "lr_plus": null, "lr_minus": null, "source": "Brismee et al. 2004, J Man Manip Ther (asymptomatic population)"}, "title_zh": "Cyriax 釋放測試 Cyriax Release Test", "name_zh": "Cyriax 釋放測試", "purpose_zh": "針對胸廓出口症候群 (thoracic outlet syndrome, TOS) 的症狀釋放測試，藉由被動上提肩帶 (shoulder girdle) 來減輕臂神經叢 (brachial plexus) 神經血管束的負荷。", "structure_zh": "斜角肌三角 (interscalene triangle)、肋鎖間隙 (costoclavicular space) 或胸小肌後間隙 (retropectoralis minor space) 內的臂神經叢 (brachial plexus) 及/或鎖骨下血管 (subclavian vessels) 受壓", "procedure_zh": "病人坐姿，檢查者站在後方，從前臂下方托住病人，手肘約 80–90 度，前臂、手腕與手保持中立位。檢查者讓病人軀幹向後靠約 15 度，並被動將雙側肩帶 (shoulder girdle) 上提至接近末端範圍，維持最長 3 分鐘。", "positive_zh": "出現釋放現象 (release phenomenon)——壓迫解除時產生感覺異常 (paresthesia)、麻木 (numbness) 或疼痛——或重現病人熟悉的症狀。", "notes_zh": "特異度 1 分鐘 97.4%、3 分鐘 87.8%（Brismee 2004，無症狀族群），但缺乏敏感度資料，臨床價值不確定。釋放症狀以感覺異常 (paresthesia) 最常見，其次為麻木，再其次為疼痛。", "tags": ["TOS", "釋放測試 release test", "臂神經叢 brachial plexus"]}, {"slug": "tinel-sign-tos", "title_en": "Tinel Sign for TOS", "link": "https://www.physiotutors.com/wiki/tinel-sign-tos/", "youtube_ids": ["jvWvW3Bk4R8"], "accuracy": {"sensitivity": "46%", "specificity": "56%", "lr_plus": null, "lr_minus": null, "source": "Gillard et al. 2001, Joint Bone Spine"}, "title_zh": "胸廓出口症候群 Tinel 徵象 Tinel Sign for TOS", "name_zh": "胸廓出口症候群 Tinel 徵象", "purpose_zh": "以叩擊臂神經叢 (brachial plexus) 來篩檢胸廓出口症候群 (thoracic outlet syndrome, TOS) 中的臂神經叢刺激。", "structure_zh": "斜角肌三角 (interscalene triangle)、肋鎖間隙 (costoclavicular space) 或胸小肌後間隙 (retropectoralis minor space) 內的臂神經叢 (brachial plexus)（及鎖骨下血管 subclavian vessels）", "procedure_zh": "病人坐直，雙臂放鬆垂於體側。檢查者以反射鎚 (reflex hammer) 或以食指與中指叩擊鎖骨上窩 (supraclavicular fossa)。", "positive_zh": "局部壓痛，或重現病人熟悉的症狀。", "notes_zh": "敏感度 46%、特異度 56%，準確度非常低，臨床價值有限；在胸廓出口症候群 (TOS) 與頸神經根病變 (cervical radiculopathy) 都可能呈陽性，無法區分兩者。", "tags": ["TOS", "Tinel 徵象 Tinel sign", "臂神經叢 brachial plexus"]}, {"slug": "best-shoulder-pain-relief-exercises", "title_en": "Best Shoulder Pain Relief Exercises · Rotator Cuff Tendinopathy", "link": "https://www.physiotutors.com/wiki/best-shoulder-pain-relief-exercises/", "youtube_ids": ["npIr82HHjXA"], "accuracy": {"sensitivity": null, "specificity": null, "lr_plus": null, "lr_minus": null, "source": "Koltyn et al. 2001 (isometric analgesia); Hoeger Bement et al. 2008 (~80% MVC sustained contractions gave greatest analgesic effect)"}, "title_zh": "最佳肩痛緩解運動：旋轉肌袖肌腱病變 Best Shoulder Pain Relief Exercises | Rotator Cuff Tendinopathy", "name_zh": "最佳肩痛緩解運動：旋轉肌袖肌腱病變", "purpose_zh": "介紹等長收縮運動 (isometric exercises)，用於減輕旋轉肌袖肌腱病變 (rotator cuff tendinopathy) 的疼痛並讓肌腱能早期承受負荷。", "structure_zh": "旋轉肌袖肌腱 (rotator cuff tendons)：棘上肌 (supraspinatus)、棘下肌 (infraspinatus)／小圓肌 (teres minor)、肩胛下肌 (subscapularis)", "procedure_zh": "棘上肌 (supraspinatus)：在肩胛面 (scapular plane，約額狀面前方 30 度) 以手背推牆。棘下肌／小圓肌 (infraspinatus/teres minor)：手肘屈曲 90 度，以手背向外推牆或推另一隻手（外旋 external rotation）。肩胛下肌 (subscapularis)：手放在腹部做腹部按壓 (belly press)。每次以強力強度維持 15–30 秒，重複 3–5 次，每天數回。", "positive_zh": "不適用（運動頁面）；運動中疼痛應維持在 4–5/10 以下。", "notes_zh": "先以滿罐測試 (full can test)、外旋落後徵象 (external rotation lag sign) 與離背測試 (lift-off test) 確認受累的肌腱，再選擇對應的運動。等長收縮止痛的依據來自 Koltyn 2001 與 Hoeger Bement 2008（約 80% MVC 的持續收縮止痛效果最佳）。", "tags": ["旋轉肌袖 rotator cuff", "等長收縮 isometric", "肌腱病變 tendinopathy", "運動 exercise"]}, {"slug": "scapula-strengthening-exercises", "title_en": "Scapula Strengthening Exercises · Early Shoulder Rehab", "link": "https://www.physiotutors.com/wiki/scapula-strengthening-exercises/", "youtube_ids": ["4D6_sK6hxLQ"], "accuracy": {"sensitivity": null, "specificity": null, "lr_plus": null, "lr_minus": null, "source": "EMG data: Kibler et al. 2008, Am J Sports Med (high serratus anterior and lower trapezius activity in inferior glide; balanced upper/lower trapezius and serratus activity in lawnmower and robbery)"}, "title_zh": "肩胛骨肌力訓練運動：早期肩部復健 Scapula Strengthening Exercises | Early Shoulder Rehab", "name_zh": "肩胛骨肌力訓練運動：早期肩部復健", "purpose_zh": "介紹四種低負荷肩胛骨運動，適用於術後早期或急性期的肩部復健，以建立肩胛胸廓 (scapulothoracic) 肌群的整體活化與肌力。", "structure_zh": "肩胛胸廓穩定肌 (scapulothoracic stabilizers)，主要為上斜方肌 (upper trapezius)、下斜方肌 (lower trapezius) 與前鋸肌 (serratus anterior)", "procedure_zh": "下滑 (inferior glide)：坐姿，手臂外展 90 度，拳頭壓在平面上，同時做肩胛骨內收與下壓 (adduction and depression)，維持 5 秒。低划船 (low row)：站姿，手掌向後推治療床邊緣，並做肩胛骨後縮與下壓 (retraction and depression)，維持 5 秒。割草機 (lawnmower)：軀幹朝訓練側旋轉並伸展，同時做肩胛骨後縮，手肘朝後口袋方向帶。搶劫動作 (robbery)：軀幹前彎 40–50 度，接著軀幹與手臂伸展、手肘屈曲，將兩側肩胛骨 (scapulae) 朝後口袋方向夾緊，維持 5 秒。", "positive_zh": "不適用（運動頁面）。注意觀察肩胛骨是否確實後縮與下壓，再逐步進階到較具功能性的姿勢。", "notes_zh": "肌電圖資料 (Kibler 2008) 顯示下滑 (inferior glide) 有高度前鋸肌 (serratus anterior) 與下斜方肌 (lower trapezius) 活性，割草機與搶劫動作則有平衡的上／下斜方肌與前鋸肌活性。改變個人的肩胛動作模式不太可能，因此重點放在肌力與整體活化而非動作控制；這些運動用來取代早期過於吃力的功能性姿勢。", "tags": ["肩胛骨 scapula", "肌力訓練 strengthening", "早期復健 early rehab", "運動 exercise"]}, {"slug": "best-scapular-dyskinesis-exercise", "title_en": "Best Scapular Dyskinesis Exercise", "link": "https://www.physiotutors.com/wiki/best-scapular-dyskinesis-exercise/", "youtube_ids": ["fvfrZ-OpUG0"], "accuracy": {"sensitivity": null, "specificity": null, "lr_plus": null, "lr_minus": null, "source": "Page attributes the claim that ~120° elevation gives strongest supraspinatus activation to Ekstrom et al. 2003 and Reinold et al. 2007"}, "title_zh": "最佳肩胛骨動作障礙運動 Best Scapular Dyskinesis Exercise", "name_zh": "最佳肩胛骨動作障礙運動", "purpose_zh": "介紹作者偏好用於肩胛骨動作障礙 (scapular dyskinesis) 的運動——俯臥 Y 字上抬 (prone Y-lift)。", "structure_zh": "與肩峰下疼痛 (subacromial pain) 相關的肩胛骨動作障礙 (scapular dyskinesis)；目標為上斜方肌 (upper trapezius)、下斜方肌 (lower trapezius)、棘上肌 (supraspinatus) 與胸椎伸展 (thoracic extension)", "procedure_zh": "病人俯臥於治療床上，手臂垂於床緣外。將手臂向上、向外抬至頭頂約 120 度的位置，拇指朝上以促進外旋 (external rotation)，再以受控的離心收縮 (eccentric phase) 緩慢放下。也可俯臥在抗力球 (Swiss ball) 上雙側同時進行。", "positive_zh": "不適用（運動頁面）。注意拇指朝上與放下時的離心控制；可由單側進階至抗力球上的雙側版本。", "notes_zh": "應先以肩胛肱骨節律 (scapulohumeral rhythm) 觀察、肩胛骨輔助測試 (scapular assistance test) 或肩胛骨後縮測試 (scapular retraction test) 評估動作障礙；若這些測試可使疼痛減輕，提示病人會從肩胛骨運動中獲益。頁面引用 Ekstrom 2003 與 Reinold 2007，指出約 120 度上抬時棘上肌 (supraspinatus) 活化最強。", "tags": ["肩胛骨動作障礙 scapular dyskinesis", "俯臥 Y 字上抬 prone Y-lift", "運動 exercise"]}]}</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const CATS = DATA.categories, T = DATA.tests;
const order = CATS.flatMap(c => c.slugs);
const bySlug = Object.fromEntries(T.map(t => [t.slug, t]));
const catOf = Object.fromEntries(CATS.flatMap(c => c.slugs.map(s => [s, c])));
const LS = 'physio-atlas-done-shoulder';
let done = new Set(); try { done = new Set(JSON.parse(localStorage.getItem(LS) || '[]')); } catch (e) {}
function saveDone(){ try { localStorage.setItem(LS, JSON.stringify([...done])); } catch (e) {} }
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ----- sidebar ----- */
const nav = document.getElementById('nav');
nav.innerHTML = CATS.map((c, i) => `
<details class="cat" id="cat-${c.id}" ${i === 0 ? 'open' : ''}>
  <summary><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="zh">${esc(c.zh)}</span><span class="en">${esc(c.en)}</span></summary>
  <ul>${c.slugs.map(s => { const t = bySlug[s]; return `<li data-slug="${s}"><a href="#${s}" data-slug="${s}"><span class="tick"></span><span class="t">${esc(t.name_zh)}<small>${esc(t.title_en)}</small></span></a></li>`; }).join('')}</ul>
</details>`).join('');

function refreshNav(){
  nav.querySelectorAll('a').forEach(a => {
    a.classList.toggle('done', done.has(a.dataset.slug));
    a.classList.toggle('active', a.dataset.slug === current);
  });
  const n = done.size, N = order.length, pct = Math.round(100 * n / N);
  document.getElementById('pct').textContent = pct + '%';
  document.getElementById('cnt').textContent = `${n} / ${N}`;
  document.getElementById('barfill').style.width = pct + '%';
}

/* ----- search ----- */
document.getElementById('q').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  nav.querySelectorAll('.cat').forEach(cat => {
    let any = false;
    cat.querySelectorAll('li').forEach(li => {
      const t = bySlug[li.dataset.slug];
      const hay = [t.title_zh, t.title_en, t.structure_zh, (t.tags || []).join(' '), t.purpose_zh].join(' ').toLowerCase();
      const hit = !q || hay.includes(q);
      li.hidden = !hit; any = any || hit;
    });
    cat.classList.toggle('nomatch', !any);
    if (q && any) cat.open = true;
  });
});

/* ----- rendering ----- */
let current = null, vidIdx = 0;
const art = document.getElementById('art');
function accRow(label, v){ return v && !/^(n\/a|not reported|none|-)$/i.test(v) ? `<div><b>${label}</b><span>${esc(v)}</span></div>` : ''; }

function render(slug){
  const t = bySlug[slug];
  if (!t) { renderWelcome(); return; }
  current = slug; vidIdx = 0;
  const c = catOf[slug];
  const zh = t.name_zh, enParts = [t.title_en];
  const a = t.accuracy || {};
  const accHtml = [accRow('Sensitivity 敏感度', a.sensitivity), accRow('Specificity 特異度', a.specificity), accRow('LR+', a.lr_plus), accRow('LR−', a.lr_minus)].join('');
  art.innerHTML = `
  <div class="player"><iframe id="yt" src="https://www.youtube-nocookie.com/embed/${t.youtube_ids[0]}?rel=0&modestbranding=1" title="${esc(t.title_en)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
  <div class="vids">${t.youtube_ids.length > 1 ? t.youtube_ids.map((v, i) => `<button data-v="${i}" class="${i === 0 ? 'on' : ''}">影片 ${i + 1}</button>`).join('') : ''}<a href="https://www.youtube.com/watch?v=${t.youtube_ids[0]}" target="_blank" rel="noopener">在 YouTube 開啟 ↗</a></div>
  <header class="head">
    <div class="eyebrow">${esc(c.en)} · ${esc(c.zh)}</div>
    <h2>${esc(zh)}<span class="en">${esc(enParts.join(' ') || t.title_en)}</span></h2>
    <div class="tags">${(t.tags || []).map(x => `<span>${esc(x)}</span>`).join('')}</div>
    <label class="doneRow"><input type="checkbox" id="doneBox" ${done.has(slug) ? 'checked' : ''}> 已看完此測試</label>
  </header>
  <section class="sec"><h3>目的<small>Purpose</small></h3><p>${esc(t.purpose_zh)}</p></section>
  <section class="sec"><h3>檢查結構<small>Structure</small></h3><p>${esc(t.structure_zh)}</p></section>
  <section class="sec"><h3>操作步驟<small>Procedure</small></h3><p>${esc(t.procedure_zh)}</p></section>
  <section class="sec positive"><h3>陽性判讀<small>Positive finding</small></h3><p>${esc(t.positive_zh)}</p></section>
  ${accHtml ? `<section class="sec"><h3>診斷準確度<small>Accuracy</small></h3><div class="acc">${accHtml}${a.source ? `<div class="src">來源 Source：${esc(a.source)}</div>` : ''}</div></section>` : ''}
  <section class="sec"><h3>臨床重點<small>Clinical notes</small></h3><p>${esc(t.notes_zh)}</p></section>
  <div class="foot"><span>原文頁面：<a href="${t.link}" target="_blank" rel="noopener">physiotutors.com ↗</a></span><span>影片版權屬 Physiotutors；本頁僅嵌入播放與整理筆記。</span></div>`;
  art.querySelectorAll('.vids button').forEach(b => b.addEventListener('click', () => {
    vidIdx = +b.dataset.v;
    document.getElementById('yt').src = `https://www.youtube-nocookie.com/embed/${t.youtube_ids[vidIdx]}?rel=0&modestbranding=1`;
    art.querySelectorAll('.vids button').forEach(x => x.classList.toggle('on', x === b));
  }));
  document.getElementById('doneBox').addEventListener('change', e => { e.target.checked ? done.add(slug) : done.delete(slug); saveDone(); refreshNav(); });
  document.getElementById('crumb').innerHTML = `Shoulder / ${esc(c.en)} / <b>${esc(t.title_en)}</b>`;
  const i = order.indexOf(slug);
  document.getElementById('prev').disabled = i <= 0;
  document.getElementById('next').disabled = i >= order.length - 1;
  document.getElementById('cat-' + c.id).open = true;
  refreshNav();
  document.getElementById('main').scrollTo({ top: 0 });
  document.body.classList.remove('nav-open');
  document.title = `${t.title_en} · Physio Exam Atlas`;
}
function renderWelcome(){
  current = null;
  art.innerHTML = `<div class="welcome"><h2>肩部理學檢查影片地圖</h2>
  <p>${order.length} 支 Physiotutors 影片，依 ${CATS.length} 個主題排列。每支影片附繁中段落筆記（目的、操作、陽性判讀、診斷準確度、臨床重點），醫學名詞保留英文。觀看進度存在你的瀏覽器裡。</p>
  <div class="grid">${CATS.map((c, i) => `<button data-cat="${c.id}"><b>${esc(c.zh)}</b><small>${esc(c.en)}</small><i>${c.slugs.length} 支影片 · ${c.slugs.filter(s => done.has(s)).length} 已看</i></button>`).join('')}</div></div>`;
  art.querySelectorAll('button[data-cat]').forEach(b => b.addEventListener('click', () => { location.hash = CATS.find(c => c.id === b.dataset.cat).slugs[0]; }));
  document.getElementById('crumb').textContent = 'Shoulder · 選擇左側測試開始';
  document.getElementById('prev').disabled = true; document.getElementById('next').disabled = false;
  refreshNav();
}
document.getElementById('prev').addEventListener('click', () => { const i = order.indexOf(current); if (i > 0) location.hash = order[i - 1]; });
document.getElementById('next').addEventListener('click', () => { const i = order.indexOf(current); location.hash = order[i + 1] || order[0]; });
document.getElementById('menu').addEventListener('click', () => document.body.classList.toggle('nav-open'));
document.getElementById('scrim').addEventListener('click', () => document.body.classList.remove('nav-open'));
window.addEventListener('hashchange', () => render(location.hash.slice(1)));
render(location.hash.slice(1));
</script>
</body>
</html>
