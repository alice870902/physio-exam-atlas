<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>Knee · Physio Exam Atlas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left index (course → category → test), scrolling reading pane with player on top. */
:root{
  --bg:#f7f5f1; --panel:#ffffff; --fg:#1d1b17; --muted:#6b665c; --line:#e3ded4;
  --accent:#1f5f6b; --accent-ink:#ffffff; --accent-soft:#e3eff1; --mark:#c8731b;
  --done:#2f7d4f; --code:#f0ede6;
  --display:"Fraunces","Noto Sans TC",Georgia,serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --sidebar:300px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#15171a; --panel:#1d2024; --fg:#ebe7df; --muted:#a19b90; --line:#2d3137;
  --accent:#6fb9c6; --accent-ink:#0f1a1d; --accent-soft:#1d3237; --mark:#e49a4c;
  --done:#6cc68f; --code:#24282d; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#15171a; --panel:#1d2024; --fg:#ebe7df; --muted:#a19b90; --line:#2d3137;
  --accent:#6fb9c6; --accent-ink:#0f1a1d; --accent-soft:#1d3237; --mark:#e49a4c;
  --done:#6cc68f; --code:#24282d; color-scheme:dark; }

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.65;display:flex;overflow:hidden}
a{color:var(--accent)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
h1,h2,h3{text-wrap:balance;margin:0}

/* ---- sidebar ---- */
#side{width:var(--sidebar);flex:0 0 auto;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;height:100%;padding-left:env(safe-area-inset-left,0px)}
.brand{padding:18px 18px 12px;border-bottom:1px solid var(--line)}
.brand .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.brand h1{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.2;margin-top:4px}
.brand .sub{color:var(--muted);font-size:12.5px;margin-top:4px}
.search{padding:10px 14px;border-bottom:1px solid var(--line)}
.search input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit;font-size:14px}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px}
.progress{padding:8px 18px;font-family:var(--mono);font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.bar{height:4px;background:var(--line);border-radius:2px;flex:1;margin:0 10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--done);width:0}
nav{overflow-y:auto;flex:1;padding:6px 0 24px}
.cat>summary{list-style:none;cursor:pointer;padding:9px 18px;display:flex;align-items:baseline;gap:8px;user-select:none}
.cat>summary::-webkit-details-marker{display:none}
.cat>summary .n{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:1.6em}
.cat>summary .zh{font-weight:700}
.cat>summary .en{color:var(--muted);font-size:12px;margin-left:auto;text-align:right}
.cat>summary::before{content:"";width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);margin-right:2px;transition:transform .15s;flex:none;position:relative;top:-2px}
.cat[open]>summary::before{transform:rotate(45deg)}
.cat ul{list-style:none;margin:0;padding:0 0 6px}
.cat li a{display:flex;gap:8px;align-items:flex-start;padding:6px 18px 6px 34px;text-decoration:none;color:var(--fg);font-size:13.5px;line-height:1.4;border-left:3px solid transparent}
.cat li a:hover{background:var(--accent-soft)}
.cat li a.active{border-left-color:var(--accent);background:var(--accent-soft);font-weight:500}
.cat li a .tick{flex:none;width:14px;height:14px;border:1.5px solid var(--line);border-radius:50%;margin-top:4px}
.cat li a.done .tick{background:var(--done);border-color:var(--done)}
.cat li a .t{flex:1;min-width:0}
.cat li a .t small{display:block;color:var(--muted);font-size:11.5px}
.cat li[hidden]{display:none}
.cat.nomatch{display:none}

/* ---- main ---- */
#main{flex:1;min-width:0;height:100%;overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:18px}
#menu{display:none;padding:6px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px}
.crumb{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb b{color:var(--fg);font-weight:500}
.navbtns{margin-left:auto;display:flex;gap:6px}
.navbtns button{padding:6px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px;background:var(--panel)}
.navbtns button:disabled{opacity:.4;cursor:default}

article{max-width:860px}
.player{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.18)}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vids{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.vids button{font-family:var(--mono);font-size:11.5px;padding:3px 9px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
.vids button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.vids a{font-family:var(--mono);font-size:11.5px;margin-left:auto;align-self:center}

.head{margin:22px 0 14px}
.head .eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.head h2{font-family:var(--display);font-size:30px;font-weight:600;line-height:1.15;margin-top:6px}
.head h2 .en{display:block;font-family:var(--body);font-size:16px;font-weight:400;color:var(--muted);margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tags span{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--code);color:var(--muted)}
.doneRow{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13.5px}
.doneRow input{width:16px;height:16px;accent-color:var(--done)}

.sec{display:grid;grid-template-columns:150px 1fr;gap:10px 18px;padding:14px 0;border-top:1px solid var(--line)}
.sec h3{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.02em;padding-top:2px}
.sec h3 small{display:block;font-family:var(--mono);font-weight:400;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.sec p{margin:0;max-width:65ch}
.sec.positive p{border-left:3px solid var(--mark);padding-left:12px}
.acc{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.acc div{background:var(--code);border-radius:6px;padding:8px 10px}
.acc b{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.acc span{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.acc .src{grid-column:1/-1;background:none;padding:2px 0;font-size:12px;color:var(--muted)}
.foot{margin-top:18px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.welcome h2{font-family:var(--display);font-size:30px;margin-bottom:8px}
.welcome p{max-width:65ch;color:var(--muted)}
.welcome .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:18px}
.welcome .grid button{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.welcome .grid b{display:block}
.welcome .grid small{color:var(--muted);font-size:12px}
.welcome .grid i{display:block;font-family:var(--mono);font-size:11px;color:var(--accent);margin-top:6px;font-style:normal}

#scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:9}
@media (max-width:820px){
  #side{position:fixed;left:0;top:0;bottom:0;z-index:10;transform:translateX(-100%);transition:transform .2s;width:min(var(--sidebar),88vw);padding-top:env(safe-area-inset-top,0px)}
  body.nav-open #side{transform:none}
  body.nav-open #scrim{display:block}
  #menu{display:inline-block}
  .sec{grid-template-columns:1fr;gap:4px}
  .head h2{font-size:24px}
  .cat>summary .en{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>

: "髕骨肌腱與髂脛束", "en": "Patellar Tendon & Iliotibial Band", "slugs": ["patellar-tendon-palpation", "royal-london-hospital-test-knee", "nobles-test", "rennes-test"]}, {"id": "rtp", "zh": "功能與回場測試", "en": "Functional & Return-to-Play Testing", "slugs": ["hop-test-cluster", "drop-jump-test", "star-excursion-balance-test", "y-balance-test"]}, {"id": "ex", "zh": "運動治療", "en": "Exercise & Rehab", "slugs": ["acl-rehab", "itb-syndrome-rehab", "best-hamstring-exercises", "nordic-hamstring-curl-variations", "askling-protocol"]}], "tests": [{"slug": "knee-active-range-of-motion", "title_en": "Knee Active Range of Motion", "link": "https://www.physiotutors.com/wiki/knee-active-range-of-motion/", "youtube_ids": ["G6eDhgTmNIA"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a"}, "title_zh": "膝關節主動活動度 Knee Active Range of Motion", "name_zh": "膝關節主動活動度", "purpose_zh": "基礎評估四個主動動作：屈曲、伸直，以及脛骨相對股骨的內轉與外轉，同時觀察髕骨 (patella) 的滑動軌跡 (tracking)。", "structure_zh": "脛股關節 (tibiofemoral joint)；髕骨在股骨滑車 (femoral trochlea) 中的移動：伸直時向上向外、屈曲時向下向內。", "procedure_zh": "屈曲：仰臥，腳跟盡量靠近臀部。伸直：仰臥雙腿伸直，請病人收縮股四頭肌或把膝蓋往床面壓，腳跟應抬離床面。旋轉：坐在床緣、小腿自然下垂，可在踝關節上方觸診以分辨是脛股關節真正的旋轉還是踝關節內翻／外翻；腳尖向外為外轉、向內為內轉。", "positive_zh": "非陽性／陰性型檢查：記錄活動範圍、症狀，以及髕骨是否滑動順暢。", "notes_zh": "與膝關節被動活動度 (PROM) 頁面互為配套。原頁未列參考文獻。", "tags": ["活動度 ROM", "基礎評估 basic assessment"]}, {"slug": "knee-passive-range-of-motion", "title_en": "Knee Passive Range of Motion", "link": "https://www.physiotutors.com/wiki/knee-passive-range-of-motion/", "youtube_ids": ["hpYPSX3n_uE"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a"}, "title_zh": "膝關節被動活動度 Knee Passive Range of Motion", "name_zh": "膝關節被動活動度", "purpose_zh": "以被動方式評估膝關節的骨運動學動作、量測角度、受限時評估末端感覺 (end-feel)，並包含髕骨活動度 (patellar mobility)。", "structure_zh": "脛股關節與髕股關節 (patellofemoral joint)。原頁參考值：屈曲 135°、伸直 15°、內轉 20–30°、外轉 30–40°。", "procedure_zh": "屈曲：仰臥，髖屈 90° 並在股骨遠端固定，另一手握脛骨遠端做最大屈曲，評估末端感覺。伸直：仰臥腿平放，固定股骨遠端，從內側握住脛骨遠端做被動伸直（從內側握可讓終末伸直的鎖扣機制 (screw-home mechanism) 發生）。旋轉：仰臥，髖膝各 90° 並固定，另一手從足底握住腳、把距小腿關節 (talocrural joint) 背屈到底鎖住，以腳當槓桿做內轉與外轉。髕骨：腿完全伸直，雙拇指推向內側、食指推向外側、食指加拇指或豌豆骨 (pisiform) 推向遠端、食指加拇指推向近端。", "positive_zh": "非陽性／陰性型檢查：與參考值及對側比較活動範圍，記錄末端感覺。", "notes_zh": "信度：van Trijffel 等人 (2010) 的系統性回顧指出目視或量角器量膝屈伸的施測者間信度可接受至極佳；Mehta 等人 (2017) 用數位量角器與手機傾斜儀，施測者內／間信度良好至極佳且一致優於類比器材。原頁提到的末端感覺一覽表不在 API 文字中。參考值引自 Soucie 2011、McKay 2017。", "tags": ["活動度 ROM", "末端感覺 end-feel", "髕骨活動度 patellar mobility"]}, {"slug": "knee-resisted-isometric-testing", "title_en": "Knee Resisted Isometric Testing", "link": "https://www.physiotutors.com/wiki/knee-resisted-isometric-testing/", "youtube_ids": ["F7LRQARxCpQ"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a"}, "title_zh": "膝關節等長阻力測試 Knee Resisted Isometric Testing", "name_zh": "膝關節等長阻力測試", "purpose_zh": "膝關節複合體的基礎肌力與疼痛誘發測試：膝屈曲、伸直，加上踝背屈與蹠屈。", "structure_zh": "膝屈肌與伸肌；腓腸肌 (gastrocnemius) 從後方跨過膝關節並在蹠屈時作用；踝背屈會帶動脛腓關節 (tibiofibular joint) 並增加其支持韌帶的應力。", "procedure_zh": "屈曲：仰臥，膝屈約 30°，在踝上方給阻力，請病人把腳跟拉向臀部。伸直：腿架在檢查者前臂上，另一手放踝上方，請病人伸膝。背屈：膝屈 90° 固定，在足背往下壓，請病人抵抗。蹠屈：在足底給阻力，請病人抵抗。", "positive_zh": "阻力動作中出現疼痛及／或無力。", "notes_zh": "與主動活動度 (AROM)、被動活動度 (PROM) 同屬基礎膝關節評估。原頁未列參考文獻。", "tags": ["肌力 strength", "基礎評估 basic assessment"]}, {"slug": "myotomes-lower-limb", "title_en": "Myotomes Lower Limb", "link": "https://www.physiotutors.com/wiki/myotomes-lower-limb/", "youtube_ids": ["ptO9ZvsUPDg"], "accuracy": {"sensitivity": "22-40% per myotome (pooled 31%)", "specificity": "62-79% per myotome (pooled 76%)", "lr_plus": "1.02-1.26 (pooled, all neurological examination components)", "lr_minus": "not reported", "source": "Al Nezari et al. 2013 systematic review/meta-analysis, 14 studies, lumbar disc herniation"}, "title_zh": "下肢肌節測試 Myotomes Lower Limb", "name_zh": "下肢肌節測試", "purpose_zh": "懷疑腰椎神經根病變 (radiculopathy) 時的肌節 (myotome) 肌力測試，協助定位病變椎間盤節段。", "structure_zh": "腰薦神經根：L2 髖屈曲、L3 髖伸直（原頁如此列）、L4 脛前肌 (tibialis anterior)／踝背屈、L5 伸拇長肌 (extensor hallucis longus)／大腳趾伸直、S1 小腿肌（反覆提踵）、S2 膝屈曲（神經根病變罕見）。", "procedure_zh": "病人仰臥，逐一測試各肌節，並與健側比較。", "positive_zh": "某一肌節的肌力相較對側減弱 (paresis)。", "notes_zh": "Al Nezari 等人 (2013) 的系統性回顧與統合分析（14 篇研究、腰椎椎間盤突出）：肌節無力的敏感度 22–40%、特異度 62–79%，合併後敏感度 31%、特異度 76%；所有神經學檢查項目的合併陽性概似比 (LR+) 僅 1.02–1.26，陽性或陰性都不太改變檢後機率，臨床價值弱，但仍是理學檢查中最好的工具。⚠ 原頁把 L3 列為髖伸直，未加說明。配套頁面：上下肢皮節 (dermatome) 與反射測試。", "tags": ["神經根病變 radiculopathy", "肌節 myotome", "神經學檢查 neurological"]}, {"slug": "knee-pain-differential-diagnosis-itbs-pfps-jumpers-knee", "title_en": "Atraumatic Knee Pain Differential Diagnosis", "link": "https://www.physiotutors.com/wiki/knee-pain-differential-diagnosis-itbs-pfps-jumpers-knee/", "youtube_ids": ["HbpA0GGYgkg"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a"}, "title_zh": "非創傷性膝痛鑑別診斷 Atraumatic Knee Pain Differential Diagnosis", "name_zh": "非創傷性膝痛鑑別診斷", "purpose_zh": "鑑別活躍年輕族群三種常見的過度使用型膝痛：髕股疼痛症候群 (patellofemoral pain syndrome, PFPS)、髂脛束症候群 (iliotibial band syndrome, ITBS) 與髕骨肌腱病變 (patellar tendinopathy，跳躍膝 jumper's knee)。", "structure_zh": "髕股關節、股骨外上髁處的髂脛束、髕骨肌腱。年長病人較可能是退化性關節炎 (osteoarthritis) 與退化性半月板病變。", "procedure_zh": "三者都是排除性診斷，先排除韌帶或肌肉傷害；特殊測試表現差。改看臨床表現：疼痛位置（ITBS 為股骨外上髁局部尖銳的外側痛；PFPS 與髕骨肌腱病變為前側、可能瀰漫）、典型年齡（ITBS 與髕骨肌腱病變多在成人；PFPS 青少年也常見，典型病人是青少女跑者）、起病型態（三者皆為訓練量快速增加後的過度使用；ITBS 通常突然發作，PFPS 數週內漸進）。", "positive_zh": "不適用（鑑別診斷總論）。", "notes_zh": "原頁提到的比較表是圖片、不在 API 文字中。原頁未列參考文獻。", "tags": ["鑑別診斷 differential", "PFPS", "ITBS", "跳躍膝 jumper's knee"]}, {"slug": "radiographic-knee-oa", "title_en": "Radiographic Knee OA", "link": "https://www.physiotutors.com/wiki/radiographic-knee-oa/", "youtube_ids": ["JUH-ObEhXW8"], "accuracy": {"sensitivity": "95% (3 of 6); 84% (4 of 6)", "specificity": "69% (3 of 6); 89% (4 of 6)", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Altman et al. 1986 (page rates high clinical value to rule out or confirm knee OA)"}, "title_zh": "膝關節退化性關節炎臨床診斷 Radiographic Knee OA", "name_zh": "膝關節退化性關節炎臨床診斷", "purpose_zh": "以 Altman 等人 (1986) 的臨床分類組合診斷膝關節退化性關節炎 (osteoarthritis, OA)，取代只依賴 Kellgren-Lawrence 放射學分級。", "structure_zh": "膝關節：軟骨下骨 (subchondral bone) 神經支配豐富、骨緣壓痛；骨贅 (osteophytes) 造成骨性腫大；捻髮音 (crepitus)。", "procedure_zh": "膝痛加上六項：年齡 > 50 歲；晨僵 (morning stiffness) < 30 分鐘；活動時有捻髮音（可請病人蹲下，區分像老舊門板聲的骨性捻髮音與常見的滑膜彈響）；骨緣觸診壓痛；骨性腫大；無局部溫度上升。", "positive_zh": "六項中 3 項陽性，或 4 項陽性以提高特異度。", "notes_zh": "Altman 等人 (1986)：3/6 陽性敏感度 95%、特異度 69%；4/6 陽性敏感度 84%、特異度 89%，原頁給排除與確認膝 OA 皆為高臨床價值。影像與疼痛相關性差，Altman 研究中 40% 病人無症狀；中樞敏感化 (central sensitization) 與心理社會因素重要，治療以負荷管理、肌力、活動度與衛教為主。原頁也引用 Kim 等人 2015（髖 OA）。", "tags": ["退化性關節炎 OA", "ACR 準則 criteria", "cluster"]}, {"slug": "ottawa-knee-rules", "title_en": "Ottawa Knee Rules", "link": "https://www.physiotutors.com/wiki/ottawa-knee-rules/", "youtube_ids": ["ku_E2aneq-M"], "accuracy": {"sensitivity": "84.6-100% (range across studies)", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Stiell et al. 1995; Yao & Haque 2012; Cheung et al. 2013"}, "title_zh": "渥太華膝部規則 Ottawa Knee Rules", "name_zh": "渥太華膝部規則", "purpose_zh": "判斷急性膝部外傷哪些需要照 X 光的臨床決策規則。", "structure_zh": "膝部：髕骨、腓骨頭、膝屈曲角度、負重能力。", "procedure_zh": "符合任一項即照 X 光：年齡 55 歲以上；髕骨單獨壓痛；腓骨頭壓痛；膝無法屈曲到 90°；受傷當下與急診室都無法連續負重走四步（跛行也算能走）。", "positive_zh": "任一準則成立＝需要影像檢查。", "notes_zh": "各研究敏感度 84.6–100%（Stiell 1995、Yao & Haque 2012、Cheung 2013）。類似規則：Pittsburgh 決策規則，依 Cheung 等人 (2013) 特異度較高。", "tags": ["骨折篩檢 fracture screening", "臨床決策規則 decision rule"]}, {"slug": "pittsburgh-decision-rule", "title_en": "Pittsburgh Decision Rule", "link": "https://www.physiotutors.com/wiki/pittsburgh-decision-rule/", "youtube_ids": ["TMw6SJP784U"], "accuracy": {"sensitivity": "77-100% across evaluations; 100% for the stated rule", "specificity": "57-79% across evaluations; 79% for the stated rule", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Seaberg & Jackson 1994; Cheung et al. 2013"}, "title_zh": "匹茲堡決策規則 Pittsburgh Decision Rule", "name_zh": "匹茲堡決策規則", "purpose_zh": "1994 年提出的臨床決策規則，判斷膝部外傷是否需要 X 光，以減少不必要的攝影。", "structure_zh": "跌倒或鈍挫傷後的膝部。", "procedure_zh": "跌倒或鈍挫傷機轉，合併「無法完全負重走四步」或「年齡小於 12 歲或大於 50 歲」其中之一 → 照 X 光。", "positive_zh": "準則成立＝需要影像檢查。", "notes_zh": "各評估研究敏感度 77–100%、特異度 57–79%；原頁敘述的規則本身敏感度 100%、特異度 79%（Seaberg & Jackson 1994、Cheung 2013）。Cheung 等人 (2013) 中顯著比渥太華膝部規則更特異。原頁的流程圖是圖片、不在 API 文字中。", "tags": ["骨折篩檢 fracture screening", "臨床決策規則 decision rule"]}, {"slug": "brush-test", "title_en": "Brush Test", "link": "https://www.physiotutors.com/wiki/brush-test/", "youtube_ids": ["ySpqA-K5kjo"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Reliability only: Sturgill et al. 2009, inter-rater kappa 0.75 (agreement = same grade or one grade apart)"}, "title_zh": "刷動測試（隆起測試） Brush Test", "name_zh": "刷動測試（隆起測試）", "purpose_zh": "偵測膝關節的少量積液 (effusion)；又稱 stroke test、bulge test、swipe test。", "structure_zh": "膝關節囊／髕上囊 (suprapatellar pouch)；髕骨內外側溝。", "procedure_zh": "病人仰臥、膝伸直。在膝內側由遠端往近端刷 2–3 次，再用另一手在外側由近端往遠端刷 2–3 次。", "positive_zh": "膝內側偏遠端出現液體波動並隆起。", "notes_zh": "Sturgill 等人 (2009)：施測者間 kappa 0.75（同一等級或相差一級算一致），原頁給中等臨床價值。另一積液測試：髕骨敲擊測試 (patellar tap / ballottement test)。", "tags": ["關節積液 effusion", "信度 reliability"]}, {"slug": "patellar-tap-test", "title_en": "Patellar Tap Test", "link": "https://www.physiotutors.com/wiki/patellar-tap-test/", "youtube_ids": ["r18O50lzMGw"], "accuracy": {"sensitivity": "83%", "specificity": "49%", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Kastelein et al. 2009 (traumatic knee patients in general practice)"}, "title_zh": "髕骨敲擊測試（浮髕試驗） Patellar Tap Test", "name_zh": "髕骨敲擊測試（浮髕試驗）", "purpose_zh": "偵測膝關節內積液 (intra-articular effusion)，並協助定位病灶；關節外腫脹（如髕前滑囊炎 prepatellar bursitis、髕骨肌腱炎）會呈陰性。", "structure_zh": "膝關節腔、髕上囊、髕骨。", "procedure_zh": "病人仰臥、腿完全伸直。由上往下推到髕上囊並維持壓力，另一手由下往上推至髕骨下緣下方停住；維持壓力下，用一指按壓髕骨，感覺是否浮動。", "positive_zh": "髕骨浮動、敲擊時撞到股骨，表示其下有液體。", "notes_zh": "Kastelein 等人 (2009)（基層醫療的創傷性膝痛病人）：敏感度 83%、特異度 49%，陰性可中等程度排除積液。另一積液測試：刷動測試。", "tags": ["關節積液 effusion", "排除用 rule-out"]}, {"slug": "bounce-home-test", "title_en": "Bounce Home Test", "link": "https://www.physiotutors.com/wiki/bounce-home-test/", "youtube_ids": ["P570wBELisU"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a: not evaluated in diagnostic accuracy studies as originally described (Malanga et al. 2003)"}, "title_zh": "彈回測試 Bounce Home Test", "name_zh": "彈回測試", "purpose_zh": "偵測會限制或使終末伸直疼痛的關節內病變，例如半月板 (meniscus) 撕裂或游離體 (loose bodies)。", "structure_zh": "半月板、關節內游離體、限制終末伸直的積液。", "procedure_zh": "病人仰臥。檢查者托住腳跟，從膝完全屈曲開始，讓腿被動落入伸直。", "positive_zh": "正常：膝彈回完全伸直、末端清楚。伸直不完全或末端感覺有橡皮感並伴關節線疼痛，可能為半月板撕裂；末端感覺堅硬提示關節內碎片／游離體。", "notes_zh": "原始描述從未經診斷準確度研究評估（Malanga 等人 2003），臨床價值存疑。其他半月板測試：McMurray、關節線壓痛、鴨步／Childress、Apley、Finochietto／跳躍徵象、Thessaly。", "tags": ["半月板 meniscus", "關節內病變 intra-articular", "效度未知 unvalidated"]}, {"slug": "lachman-test", "title_en": "Lachman Test", "link": "https://www.physiotutors.com/wiki/lachman-test/", "youtube_ids": ["JFkbKNNa7xQ"], "accuracy": {"sensitivity": "85%", "specificity": "94%", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Benjaminse et al. 2006 meta-analysis (also cited: van Eck 2013, Huang 2016, Lange 2015)"}, "title_zh": "Lachman 測試 Lachman Test", "name_zh": "Lachman 測試", "purpose_zh": "偵測前十字韌帶 (anterior cruciate ligament, ACL) 撕裂；被統合分析列為效度最高的 ACL 測試（又稱 Ritchie、Trillat 或 Lachman-Trillat 測試）。", "structure_zh": "前十字韌帶；膝屈 30° 時的脛骨前向位移。先排除後十字韌帶 (PCL) 傷害：脛骨後沉 (posterior sag) 會讓前向位移看起來過多而造成偽陽性。", "procedure_zh": "病人仰臥，膝屈 30°。一手固定股骨，將脛骨帶到些微外轉，另一手把脛骨往前拉。", "positive_zh": "末端感覺柔軟或糊爛 (mushy)，或脛骨前向位移比健側多至少 3 公釐。", "notes_zh": "Benjaminse 等人 (2006) 統合分析：敏感度 85%、特異度 94%（另引 van Eck 2013、Huang 2016、Lange 2015）。慢性期的結果比急性期可靠，因為腫脹與肌肉痙攣會影響測試。其他 ACL 測試：前抽屜、Lelli／槓桿徵象、外側樞軸移位。", "tags": ["前十字韌帶 ACL", "首選測試 most valid"]}, {"slug": "anterior-drawer-test", "title_en": "Anterior Drawer Test", "link": "https://www.physiotutors.com/wiki/anterior-drawer-test/", "youtube_ids": ["IdnBKv38EEQ"], "accuracy": {"sensitivity": "92% (chronic)", "specificity": "91% (chronic)", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Benjaminse et al. 2006 meta-analysis; performs far worse in acute injuries"}, "title_zh": "前抽屜測試 Anterior Drawer Test", "name_zh": "前抽屜測試", "purpose_zh": "偵測前十字韌帶 (ACL) 斷裂。", "structure_zh": "前十字韌帶；膝屈 90° 時的脛骨前向位移。先排除 PCL 傷害以避免偽陽性。", "procedure_zh": "髖屈 45°、膝屈 90°，檢查者輕坐在病人腳上固定。雙拇指觸診關節線，以爆發性的動作把脛骨往前拉。", "positive_zh": "脛骨前向位移超過 6 公釐，或末端感覺柔軟糊爛。", "notes_zh": "Benjaminse 等人 (2006) 統合分析：慢性期敏感度 92%、特異度 91%；急性期表現差很多。其他 ACL 測試：Lachman、外側樞軸移位、Lelli／槓桿徵象（另引 van Eck 2013、Huang 2016、Peeler 2010）。", "tags": ["前十字韌帶 ACL", "慢性期 chronic"]}, {"slug": "lateral-pivot-shift-test", "title_en": "Lateral Pivot-Shift Test", "link": "https://www.physiotutors.com/wiki/lateral-pivot-shift-test/", "youtube_ids": ["qqy5IfkEvfw"], "accuracy": {"sensitivity": "24%", "specificity": "98%", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Benjaminse et al. 2006 meta-analysis"}, "title_zh": "外側樞軸移位測試 Lateral Pivot-Shift Test", "name_zh": "外側樞軸移位測試", "purpose_zh": "重現 ACL 缺損膝在步態屈曲 20–40° 時外側脛骨平台的動態前向半脫位，以偵測 ACL 斷裂。", "structure_zh": "前十字韌帶與前外側間室；髂脛束 (iliotibial band) 在屈曲 30–40° 時把半脫位的脛骨復位。", "procedure_zh": "病人仰臥，髖屈曲並外展 30°、些微內轉。握住跟骨使脛骨內轉（部分作者加軸向壓迫），另一手從腓骨後方施加外翻力，使脛骨在伸直位向前半脫位。接著緩慢屈膝。", "positive_zh": "約屈曲 30–40° 時脛骨復位或向後跳動（髂脛束變緊），常有咔噠聲 (clunk)，病人認得這就是「膝蓋跑掉」(giving way) 的感覺。", "notes_zh": "Benjaminse 等人 (2006) 統合分析：敏感度 24%、特異度 98%。急性期的保護性肌肉收縮會造成偽陰性，請病人盡量放鬆並可重複數次。其他 ACL 測試：Lachman、Lelli／槓桿徵象、前抽屜。", "tags": ["前十字韌帶 ACL", "確認用 rule-in", "旋轉不穩定 rotatory instability"]}, {"slug": "lever-sign", "title_en": "Lever Sign", "link": "https://www.physiotutors.com/wiki/lever-sign/", "youtube_ids": ["T9ujIYIctdw"], "accuracy": {"sensitivity": "100% (Lelli et al., 400 patients); 63% (Jarbo et al. 2017)", "specificity": "100% (Lelli et al.); 90% (Jarbo et al. 2017)", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Lelli et al. 2016 (high risk of bias, author is the test's founder); Jarbo et al. 2017; also cited Mulligan 2017, Gürpınar 2019, Massey 2017"}, "title_zh": "槓桿徵象（Lelli 測試） Lever Sign", "name_zh": "槓桿徵象（Lelli 測試）", "purpose_zh": "較新的 ACL 完整性測試，以放在小腿下的拳頭為支點、把腿當槓桿。", "structure_zh": "前十字韌帶；ACL 撕裂時抵銷重力的槓桿作用受損，脛骨平台相對股骨髁向前位移。", "procedure_zh": "病人仰臥、腿完全伸直。一拳放在小腿近端三分之一下方，另一手在股四頭肌遠端三分之一施加中等向下的力。", "positive_zh": "ACL 完整：膝伸直、腳跟抬離床面（陰性）。部分或完全斷裂：腳跟留在床上（陽性）。", "notes_zh": "Lelli 等人 (2016)（400 名急慢性、完全與不完全撕裂病人）報告敏感度與特異度皆 100%，但作者是測試創始人、偏差風險高；Jarbo 等人 (2017) 得到敏感度 63%、特異度 90%（另引 Mulligan 2017、Gürpınar 2019、Massey 2017）。綜合來看，原頁給確認 ACL 撕裂的中等臨床價值。", "tags": ["前十字韌帶 ACL", "確認用 rule-in"]}, {"slug": "jerk-test-knee", "title_en": "Jerk Test Knee", "link": "https://www.physiotutors.com/wiki/jerk-test-knee/", "youtube_ids": ["F4f187yPHPg"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a: no diagnostic accuracy assessment (Hughston 1976; Jensen 1990)"}, "title_zh": "膝關節 Jerk 測試 Jerk Test Knee", "name_zh": "膝關節 Jerk 測試", "purpose_zh": "Hughston 等人 (1976) 提出，測試 ACL 與前外側間室的完整性；相當於動作順序顛倒的樞軸移位測試。", "structure_zh": "前十字韌帶與前外側間室；外側脛骨平台。", "procedure_zh": "病人仰臥，髖屈 45°、膝屈 90°。一手使脛骨內轉，另一手放在脛骨平台近端與腓骨上施加外翻力。緩慢伸膝。", "positive_zh": "通常約屈曲 30° 時出現突然的加速或跳動 (jerk)，即外側脛骨平台向前半脫位；膝完全伸直時脛骨再度復位。", "notes_zh": "未經診斷準確度評估（Hughston 1976、Jensen 1990），臨床價值存疑。其他 ACL 測試：前抽屜、Lachman、外側樞軸移位。", "tags": ["前十字韌帶 ACL", "效度未知 unvalidated"]}, {"slug": "losee-test", "title_en": "Losee Test", "link": "https://www.physiotutors.com/wiki/losee-test/", "youtube_ids": ["-_h7lUh9oMg"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a: no formal diagnostic accuracy assessment (Losee 1978; Anderson 2000)"}, "title_zh": "Losee 測試 Losee Test", "name_zh": "Losee 測試", "purpose_zh": "Losee 等人 (1978) 描述的樞軸移位變化型，重現 ACL 缺損膝典型的外側脛骨平台前向半脫位。", "structure_zh": "前十字韌帶；外側脛骨平台；腓骨頭。", "procedure_zh": "病人仰臥，檢查者站受測側（以左膝為例）。左手托住足踝並維持外轉，腿可頂在檢查者腹部，推到膝屈 30° 讓腿後肌放鬆（外轉可讓半脫位在測試開始時復位）。右手放在膝上、拇指勾在腓骨頭後方；把腳向外拉並以右手向內推形成外翻。維持外翻力矩下緩慢伸腿、讓腿進入內轉，同時以右手拇指把腓骨頭往前推。", "positive_zh": "膝出現前向半脫位，病人認得這就是自己的不穩感。", "notes_zh": "未經正式診斷準確度評估（Losee 1978、Anderson 2000），臨床價值存疑。其他 ACL 測試：前抽屜、Lachman、外側樞軸移位。", "tags": ["前十字韌帶 ACL", "效度未知 unvalidated"]}, {"slug": "martens-test", "title_en": "Martens' Test", "link": "https://www.physiotutors.com/wiki/martens-test/", "youtube_ids": ["h-YR_DTTuHg"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a: not formally assessed against a reference standard (Martens & Mulier 1981)"}, "title_zh": "Martens 測試 Martens' Test", "name_zh": "Martens 測試", "purpose_zh": "Martens 等人 (1981) 描述的脛骨前向半脫位測試，宣稱可避免病人恐懼與肌肉痙攣造成的偽陰性。", "structure_zh": "前十字韌帶；外側脛骨平台。", "procedure_zh": "病人仰臥，小腿夾在檢查者手臂與身體之間，一手放脛骨近端後方、另一手放股骨遠端。第一步做 Lachman 手法：脛骨往前拉、股骨往後推（ACL 缺損膝會出現直向前的半脫位）。第二步以手肘在病人踝部加上外翻力矩，並讓脛骨內轉。", "positive_zh": "脛骨向前半脫位時感覺到或看到程度不一的突然彈跳 (snap)。", "notes_zh": "未經參考標準的正式診斷準確度評估（Martens & Mulier 1981），臨床價值存疑。其他 ACL 測試：前抽屜、Lachman、外側樞軸移位。", "tags": ["前十字韌帶 ACL", "效度未知 unvalidated"]}, {"slug": "dejour-test", "title_en": "Dejour Test", "link": "https://www.physiotutors.com/wiki/dejour-test/", "youtube_ids": ["DB80-0s1tR8"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a: no diagnostic accuracy assessment (Liorzou 2013)"}, "title_zh": "Dejour 測試 Dejour Test", "name_zh": "Dejour 測試", "purpose_zh": "結合 Lachman 測試與樞軸移位特徵的 ACL 測試。", "structure_zh": "前十字韌帶；脛骨平台；以樞軸移位的性質推測後內側角 (posteromedial corner, PMC) 是否完整。", "procedure_zh": "病人仰臥，檢查者站受測側，把腿鬆鬆地夾在手臂與腹部之間以容許脛骨旋轉。以前臂對膝施加外翻，另一手把股骨往後推以凸顯脛骨的前抽屜，前抽屜在屈曲 20–30° 時出現；再繼續屈曲。", "positive_zh": "繼續屈曲時出現樞軸移位：脛骨平台的前向半脫位突然復位。Dejour 認為樞軸移位劇烈且疼痛表示 PMC 完整，遲緩的樞軸移位提示 PMC 功能不全。", "notes_zh": "未經診斷準確度評估（Liorzou 2013），臨床價值存疑。其他 ACL 測試：前抽屜、Lachman、外側樞軸移位。", "tags": ["前十字韌帶 ACL", "後內側角 PMC", "效度未知 unvalidated"]}, {"slug": "jolt-test", "title_en": "Jolt Test", "link": "https://www.physiotutors.com/wiki/jolt-test/", "youtube_ids": ["nMnRavTj5Kk"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a: no diagnostic accuracy assessment (Nakajima; page text says 1972, reference list says 1979)"}, "title_zh": "Jolt 測試（Nakajima N 測試） Jolt Test", "name_zh": "Jolt 測試（Nakajima N 測試）", "purpose_zh": "類似樞軸移位的測試（Nakajima 的 n-test），重現 ACL 缺損膝的跳動 (jolt)。", "structure_zh": "前十字韌帶；脛骨平台；腓骨頭。", "procedure_zh": "病人仰臥，膝屈 90°（以右膝為例）。右手握住踝外側並使其內轉；左手放膝外側施加外翻力，拇指放在腓骨頭後方。逐漸伸膝。", "positive_zh": "脛骨平台突然向前向內半脫位並有可觸及的跳動，通常在距伸直 40–20° 處；病人可能認得這就是活動時「膝蓋跑掉」的感覺。", "notes_zh": "未經診斷準確度評估，臨床價值存疑（Nakajima：內文寫 1972、參考文獻為 1979）。其他 ACL 測試：前抽屜、Lachman、外側樞軸移位。", "tags": ["前十字韌帶 ACL", "效度未知 unvalidated"]}, {"slug": "slocum-test", "title_en": "Slocum Test", "link": "https://www.physiotutors.com/wiki/slocum-test/", "youtube_ids": ["8Krej3rD6Zo"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a: not included in diagnostic accuracy studies (Slocum et al. 1976)"}, "title_zh": "Slocum 測試 Slocum Test", "name_zh": "Slocum 測試", "purpose_zh": "Slocum (1976) 提出的側臥版外側樞軸移位測試，用於體重較重的病人，測試 ACL 完整性／前外側旋轉不穩定 (anterolateral rotatory instability)。", "structure_zh": "前十字韌帶；前外側間室；重力使脛骨內轉並向前半脫位。", "procedure_zh": "病人健側在下側臥，下方髖膝微屈求穩，骨盆向後旋約 30°，患側踝放在床上、膝屈 10°。一手在膝上、一手在膝下，施加外翻力並把膝帶入屈曲。", "positive_zh": "約膝屈 40° 時脛骨突然復位。", "notes_zh": "未納入診斷準確度研究（Slocum 等人 1976），臨床價值存疑。其他旋轉不穩定測試：giving way、交叉測試、Lemaire jolt、反向樞軸移位、dial、蛙腿。", "tags": ["前外側旋轉不穩定 ALRI", "前十字韌帶 ACL", "效度未知 unvalidated"]}, {"slug": "cross-over-test", "title_en": "Cross Over Test", "link": "https://www.physiotutors.com/wiki/cross-over-test/", "youtube_ids": ["YMYXYOMFhY4"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a: no diagnostic accuracy studies (Arnold et al. 1979)"}, "title_zh": "交叉測試 Cross Over Test", "name_zh": "交叉測試", "purpose_zh": "Arnold (1979) 提出的負重測試，用於肌肉防衛使樞軸移位或 jerk 測試難以引出的運動員，評估前外側旋轉不穩定。", "structure_zh": "負重與軀幹旋轉下的前十字韌帶／前外側間室。", "procedure_zh": "病人站立，健側腿交叉到患側腿前方，患側腳掌平貼地面。檢查者輕踩患側腳固定，請病人在股四頭肌收縮下盡量旋轉軀幹。", "positive_zh": "重現外側樞軸移位與「膝蓋要跑出去」的症狀。", "notes_zh": "沒有診斷準確度研究納入本測試（Arnold 等人 1979），臨床價值存疑。其他旋轉不穩定測試：Slocum、giving way（Jakob）、Lemaire jolt（前內側）、反向樞軸移位、dial、蛙腿（後外側）。", "tags": ["前外側旋轉不穩定 ALRI", "負重測試 weight-bearing", "效度未知 unvalidated"]}, {"slug": "giving-way-test", "title_en": "Giving Way Test", "link": "https://www.physiotutors.com/wiki/giving-way-test/", "youtube_ids": ["RlKYrUGRBAI"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a: not compared with a reference test (Jakob et al. 1981)"}, "title_zh": "Giving Way 測試 Giving Way Test", "name_zh": "Giving Way 測試", "purpose_zh": "Jakob 等人 (1981) 提出的站姿測試，重現外側脛骨平台前向半脫位；對肌肉發達或主動防衛的病人可能比非負重測試更容易引出不穩感。", "structure_zh": "負重下的前十字韌帶／前外側間室。", "procedure_zh": "病人站立，健側靠牆或靠床但雙腳平均負重。檢查者雙手放在膝上下，施加外翻力並把膝帶入屈曲。", "positive_zh": "外翻加屈曲引出跳動且膝蓋跑掉 (give way)，病人可能認得這就是自己的不穩感。", "notes_zh": "未與參考測試比較（Jakob 等人 1981），臨床價值存疑。其他旋轉不穩定測試：Slocum、交叉測試、Lemaire jolt、反向樞軸移位、dial、蛙腿。", "tags": ["前外側旋轉不穩定 ALRI", "負重測試 weight-bearing", "效度未知 unvalidated"]}, {"slug": "lemaire-jolt-test", "title_en": "Lemaire Jolt Test", "link": "https://www.physiotutors.com/wiki/lemaire-jolt-test/", "youtube_ids": ["YEXMlB50lO0"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a: not assessed for diagnostic ability (Liorzou 2013)"}, "title_zh": "Lemaire Jolt 測試 Lemaire Jolt Test", "name_zh": "Lemaire Jolt 測試", "purpose_zh": "Lemaire (1967) 描述、在麻醉病人中用來確認 ACL 斷裂的測試；清醒病人無法完全放鬆，較難引出。", "structure_zh": "前十字韌帶；脛骨前內側半脫位；腓骨頭與股二頭肌 (biceps femoris) 肌腱。", "procedure_zh": "病人仰臥，檢查者站受測側。一手握踝使伸直的腿內轉，另一手手背放在腓骨頭與股二頭肌肌腱後方施加向前的力。請病人完全放鬆，反覆輕柔地屈伸膝，觀察脛骨的前內側半脫位。第二步增加屈曲角度。", "positive_zh": "屈曲角度增加時脛骨向後跳動 (jolt)。", "notes_zh": "未經診斷能力評估（Liorzou 2013），臨床價值存疑。原頁標題寫前內側旋轉不穩定，內文則提到清醒病人難以引出前外側旋轉不穩定。其他旋轉不穩定測試：Slocum、giving way、交叉測試、反向樞軸移位、dial、蛙腿。", "tags": ["前內側旋轉不穩定 AMRI", "前十字韌帶 ACL", "效度未知 unvalidated"]}, {"slug": "posterior-drawer-test", "title_en": "Posterior Drawer Test", "link": "https://www.physiotutors.com/wiki/posterior-drawer-test/", "youtube_ids": ["wDIGll5wzZs"], "accuracy": {"sensitivity": "89%", "specificity": "98%", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Rubinstein et al. 1994"}, "title_zh": "後抽屜測試 Posterior Drawer Test", "name_zh": "後抽屜測試", "purpose_zh": "偵測後十字韌帶 (posterior cruciate ligament, PCL) 撕裂。", "structure_zh": "後十字韌帶；膝屈 90° 時的脛骨後向位移。", "procedure_zh": "病人仰臥，髖屈 45°、膝屈 90°，檢查者可坐在病人前足固定。雙拇指觸診關節線，從前方握住脛骨，以爆發性的動作把脛骨往後推。", "positive_zh": "末端感覺柔軟或糊爛，或後向位移比對側增加。", "notes_zh": "Rubinstein 等人 (1994)：敏感度 89%、特異度 98%，原頁認為確認與排除 PCL 撕裂都很準確。其他 PCL 測試：後沉徵象／Godfrey／step-off、股四頭肌主動測試、反向 Lachman。", "tags": ["後十字韌帶 PCL", "首選測試 most accurate"]}, {"slug": "posterior-sag-sign", "title_en": "Posterior Sag Sign", "link": "https://www.physiotutors.com/wiki/posterior-sag-sign/", "youtube_ids": ["7vgTMnfP4fs"], "accuracy": {"sensitivity": "79%", "specificity": "100%", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Rubinstein et al. 1994 (only study reporting specificity)"}, "title_zh": "後沉徵象（Godfrey 測試） Posterior Sag Sign", "name_zh": "後沉徵象（Godfrey 測試）", "purpose_zh": "觀察脛骨後沉以評估後十字韌帶 (PCL) 完整性；又稱 Godfrey 測試或 step-off 測試。", "structure_zh": "後十字韌帶。PCL 撕裂常被漏診；典型機轉為儀表板外傷 (dashboard injury)、屈膝下跌倒撞擊脛骨前近端、或過度伸直。", "procedure_zh": "病人仰臥，髖屈 45°、膝屈 90°，股四頭肌完全放鬆，從側面觀察膝。進階（Godfrey 徵象）：髖膝各 90°，檢查者托住腳跟，重力使後沉更明顯。", "positive_zh": "正常脛骨應比股骨前凸約 1 公分，此階差 (step-off) 消失，或可見脛骨後沉。", "notes_zh": "Rubinstein 等人 (1994)：敏感度 79%、特異度 100%（唯一評估特異度的研究），確認 PCL 撕裂的臨床價值良好。其他 PCL 測試：後抽屜、股四頭肌主動測試、反向 Lachman。", "tags": ["後十字韌帶 PCL", "確認用 rule-in"]}, {"slug": "quadriceps-active-test", "title_en": "Quadriceps Active Test", "link": "https://www.physiotutors.com/wiki/quadriceps-active-test/", "youtube_ids": ["tQCacgQgC-s"], "accuracy": {"sensitivity": "53%", "specificity": "98%", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Rubinstein et al. 1994 (most specific PCL test in that study; only one other study has evaluated it)"}, "title_zh": "股四頭肌主動測試 Quadriceps Active Test", "name_zh": "股四頭肌主動測試", "purpose_zh": "利用股四頭肌收縮把後沉的脛骨拉回原位，以偵測 PCL 撕裂。", "structure_zh": "後十字韌帶；股四頭肌的力向量只有在膝屈曲超過股四頭肌中性角（約 60–70°）時才含有相對脛骨的前抽屜分量。", "procedure_zh": "病人仰臥，髖屈 45°、膝屈 90°，雙腳平放、旋轉中立。檢查者輕坐在腳上固定，請病人對抗阻力把腳往前滑。可加做第二部分：請病人等長收縮腿後肌以凸顯後沉。", "positive_zh": "原本後沉的脛骨在股四頭肌收縮時向前移動。若沒有後沉卻仍向前移動，可能提示 ACL 撕裂。", "notes_zh": "Rubinstein 等人 (1994)：敏感度 53%、特異度 98%，為該研究中最特異的 PCL 測試；目前只有另一篇研究正式評估過，確認 PCL 撕裂的臨床價值良好。其他 PCL 測試：後抽屜、後沉徵象、反向 Lachman。", "tags": ["後十字韌帶 PCL", "確認用 rule-in"]}, {"slug": "reverse-lachman-test", "title_en": "Reverse Lachman Test", "link": "https://www.physiotutors.com/wiki/reverse-lachman-test/", "youtube_ids": ["uBFV1Fdtj4w"], "accuracy": {"sensitivity": "63%", "specificity": "89%", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Rubinstein et al. 1994 (only validity study found)"}, "title_zh": "反向 Lachman 測試 Reverse Lachman Test", "name_zh": "反向 Lachman 測試", "purpose_zh": "急性受傷膝屈曲不適、後抽屜測試難以執行時，在膝屈 30° 評估 PCL 完整性。", "structure_zh": "後十字韌帶（在 90° 時對後向位移的阻抗最大）；若 30° 時位移增加但 90° 時沒有，提示後外側角 (posterolateral corner, PLC) 傷害。", "procedure_zh": "病人仰臥，膝屈 30°（可用檢查者的膝墊在下方穩定）。對側手從外側放在股骨、同側手從內側放在脛骨，兩手靠近關節線以平移而非成角。開始時 PCL 缺損膝的脛骨必須先復位到解剖位置，旋轉中立以免召喚次級穩定結構。對脛骨施加向後的力，感覺末端感覺與位移程度。", "positive_zh": "末端感覺柔軟或消失，且後向位移比對側增加。分級（Lubowitz 等人 2008）：第 1 級 0–5 公釐、脛骨平台仍在股骨髁前方；第 2 級 6–10 公釐、平台與股骨髁齊平；第 3 級 > 10 公釐、平台可移到股骨髁後方。", "notes_zh": "Rubinstein 等人 (1994)：敏感度 63%、特異度 89%（唯一找到的效度研究），確認 PCL 撕裂的臨床價值中等。反向 Lachman 位移增加但後抽屜沒有，可能是後外側角傷害，建議用 dial 測試區分。⚠ API 中本頁的頁首標題寫成「Valgus Stress Test for MCL Injuries」（複製錯誤），內文確為反向 Lachman。", "tags": ["後十字韌帶 PCL", "急性期 acute", "後外側角 PLC"]}, {"slug": "dial-test", "title_en": "Dial Test", "link": "https://www.physiotutors.com/wiki/dial-test/", "youtube_ids": ["3UGffd71KyI"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Reliability only: Krause et al. 2013, intra-tester 0.83-0.89, inter-tester 0.74-0.83 in healthy persons with a handheld inclinometer; validity unknown"}, "title_zh": "撥號測試（Loomer 測試） Dial Test", "name_zh": "撥號測試（Loomer 測試）", "purpose_zh": "診斷後外側角 (posterolateral corner, PLC) 傷害並與 PCL 撕裂區分。", "structure_zh": "後外側角：外側副韌帶 (lateral collateral ligament, LCL)、膕肌肌腱 (popliteus tendon) 與膕腓韌帶 (popliteofibular ligament) 是最重要的穩定結構。PLC 傷害多來自膝前內側直接撞擊、過度伸直或非接觸性內翻應力，通常合併 ACL／PCL 撕裂（單獨 PLC 撕裂只占 28%）。", "procedure_zh": "原始版本為俯臥（也可仰臥或坐姿）。雙膝屈 30°，踝最大背屈以限制踝旋轉；雙手托住腳跟、手指與拇指沿距跟輪廓放置，把雙腳跟最大外轉，量測足大腿角 (foot-thigh angle) 並比較兩側。第二部分在膝屈 90° 重複。", "positive_zh": "兩側外轉差異 ≥ 10°。30° 增加但 90° 沒有＝單獨 PLC 傷害（完整的 PCL 會在 90° 限制旋轉）；30° 與 90° 都增加＝PLC 加 PCL 傷害。", "notes_zh": "Krause 等人 (2013) 用手持傾斜儀在健康人：施測者內信度 0.83–0.89、施測者間 0.74–0.83；效度未知，原頁因此不對臨床效用做建議。其他 PLC 測試：反向樞軸移位、蛙腿。", "tags": ["後外側角 PLC", "後十字韌帶 PCL", "效度未知 unvalidated"]}, {"slug": "reverse-pivot-shift-test", "title_en": "Reverse Pivot-Shift Test", "link": "https://www.physiotutors.com/wiki/reverse-pivot-shift-test/", "youtube_ids": ["IqGPhYDhLSs"], "accuracy": {"sensitivity": "26% (for PCL tears)", "specificity": "95% (for PCL tears)", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Rubinstein et al. 1994; no study has evaluated it for PLC lesions"}, "title_zh": "反向樞軸移位測試 Reverse Pivot-Shift Test", "name_zh": "反向樞軸移位測試", "purpose_zh": "評估後外側旋轉不穩定 (posterolateral rotatory instability)；目前只在 PCL 撕裂中被評估過。", "structure_zh": "後外側角（LCL、膕肌肌腱、膕腓韌帶）；外側脛骨平台在屈曲時向後半脫位，約 30° 時由髂脛束復位。", "procedure_zh": "病人仰臥，膝屈 90°。同側手使脛骨外轉；對側手放在脛骨近端外側施加外翻，並以前臂或髂嵴經脛骨施加軸向負荷。維持外轉、外翻與軸向負荷下被動伸膝。", "positive_zh": "約屈曲 30° 時脛骨復位、聽到咔噠聲（髂脛束從屈曲向量轉為伸直向量）。清醒病人可能不允許此手法，出現恐懼反應 (apprehension) 也可視為陽性。", "notes_zh": "Rubinstein 等人 (1994) 針對 PCL 撕裂：敏感度 26%、特異度 95%，確認 PCL 撕裂的臨床價值中等、不適合排除。尚無研究評估它偵測後外側角病灶的能力。其他 PLC 測試：dial／Loomer、蛙腿。", "tags": ["後外側角 PLC", "後十字韌帶 PCL", "確認用 rule-in"]}, {"slug": "frog-leg-test", "title_en": "Frog Leg Test", "link": "https://www.physiotutors.com/wiki/frog-leg-test/", "youtube_ids": ["91HQi9pbAbc"], "accuracy": {"sensitivity": "91.7%", "specificity": "94.5%", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Gomes et al. 2016 (vs varus stress test and MRI; inter-rater kappa 0.86); not yet confirmed by other studies"}, "title_zh": "蛙腿測試 Frog Leg Test", "name_zh": "蛙腿測試", "purpose_zh": "Gomes 等人 (2016) 提出，在蛙腿姿勢下比較兩側外側間室在內翻力下的張開程度，評估後外側膝不穩定。", "structure_zh": "外側副韌帶 (LCL)、外側關節線與後外側角。PLC 傷害很少單獨發生，可能發生在 ACL 重建失敗之後。", "procedure_zh": "病人仰臥，雙膝屈 90°、腳底相對（蛙腿姿勢）。雙手小魚際放在兩側脛骨前內側，中指觸診 LCL、關節線與後外側角，同時對雙膝施加內翻力。", "positive_zh": "患側外側張開的觸感明顯大於健側。", "notes_zh": "Gomes 等人 (2016)（與內翻應力測試及 MRI 比較）：敏感度 91.7%、特異度 94.5%，施測者間 kappa 0.86；尚未被其他研究確認，原頁暫給中等臨床價值。Norris & McNicholas (2017) 投書指出此姿勢股骨外轉、脛骨相對內轉，能負荷 LCL 但無法正確應力膕肌／膕腓結構，沒有 LCL 傷害的 PLC 傷害可能被漏掉。其他 PLC 測試：dial、反向樞軸移位。", "tags": ["後外側角 PLC", "外側副韌帶 LCL", "單一研究 single study"]}, {"slug": "valgus-stress-test", "title_en": "Valgus Stress Test", "link": "https://www.physiotutors.com/wiki/valgus-stress-test/", "youtube_ids": ["QX1iLSc1TVA"], "accuracy": {"sensitivity": "78% (pain as outcome); 91% (laxity as outcome)", "specificity": "67% (pain); 49% (laxity)", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Kastelein et al. 2008, valgus stress at 30°, stand-alone"}, "title_zh": "外翻應力測試 Valgus Stress Test", "name_zh": "外翻應力測試", "purpose_zh": "評估內側副韌帶 (medial collateral ligament, MCL) 完整性；MCL 傷害是基層醫療最常見的膝傷之一。", "structure_zh": "內側副韌帶與內側關節線。", "procedure_zh": "0°：膝完全伸直，一手固定踝，另一手環住膝、大魚際頂在腓骨頭；把膝往內推、踝往外推以打開內側關節，同時觸診內側關節線的張開與疼痛。30°：同樣做法，膝下墊枕或放在檢查者大腿上。", "positive_zh": "膝屈 30° 時出現疼痛及／或鬆弛（內側張開）。", "notes_zh": "Kastelein 等人 (2008)，30° 外翻應力單獨使用：以疼痛為結果敏感度 78%、特異度 67%；以鬆弛為結果敏感度 91%、特異度 49%。疼痛與鬆弛都沒有時至少可中等程度排除 MCL 病灶，單靠此測試無法有把握地確認（見 MCL 組合）。配套：內翻應力測試（LCL）。", "tags": ["內側副韌帶 MCL", "排除用 rule-out"]}, {"slug": "varus-stress-test", "title_en": "Varus Stress Test", "link": "https://www.physiotutors.com/wiki/varus-stress-test/", "youtube_ids": ["sg1gk6QKARw"], "accuracy": {"sensitivity": "25%", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Harilainen 1987 (only study; rated poor accuracy, no specificity reported)"}, "title_zh": "內翻應力測試 Varus Stress Test", "name_zh": "內翻應力測試", "purpose_zh": "評估外側副韌帶 (lateral collateral ligament, LCL) 完整性。", "structure_zh": "外側副韌帶與外側關節線。", "procedure_zh": "病人仰臥，膝屈 30°（最大鬆弛位 maximally loose-packed position），墊枕或置於床緣讓病人放鬆。一手固定股骨，加上些微外轉並被動內收膝關節以應力 LCL。", "positive_zh": "過度的外側張開及／或重現病人的疼痛。", "notes_zh": "Harilainen (1987) 是唯一的評估研究，準確度差：敏感度 25%，未能報告特異度；效度所知甚少。⚠ 原頁標題寫成「Valgus Stress Test for Lateral Collateral Ligament Injuries」，實為內翻應力測試（來源筆誤）。配套：外翻應力測試（MCL）。", "tags": ["外側副韌帶 LCL", "效度不明 poorly validated"]}, {"slug": "mcl-cluster", "title_en": "MCL Cluster", "link": "https://www.physiotutors.com/wiki/mcl-cluster/", "youtube_ids": ["DBFN_ghzbpg"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "4.8 (history item + pain on valgus 30°); 6.4 (plus laxity)", "lr_minus": "not reported", "source": "Kastelein et al. 2008"}, "title_zh": "MCL 組合測試 MCL Cluster", "name_zh": "MCL 組合測試", "purpose_zh": "Kastelein 等人 (2008) 的臨床預測模型，結合病史與外翻應力測試，在基層醫療診斷 MCL 病灶。", "structure_zh": "內側副韌帶；以 MRI 確認病灶。", "procedure_zh": "36 個候選變項中留下四項：病史 (1) 外力撞擊腿部的外傷、(2) 旋轉性外傷；理學檢查 (3) 30° 外翻應力測試疼痛、(4) 測試時鬆弛。", "positive_zh": "病史兩項中至少一項，加上 30° 外翻應力疼痛 → MCL 病灶的 LR+ 4.8；若同時有鬆弛 → LR+ 6.4。只有一項病史、理學檢查皆陰性 → 可合理排除 MCL 病灶。", "notes_zh": "可減少不必要的影像轉介。即使懷疑病灶，在沒有膝交鎖 (locking) 或疑似骨折的情況下，臨床指引仍建議保守治療。", "tags": ["內側副韌帶 MCL", "cluster", "臨床預測 prediction rule"]}, {"slug": "mcmurray-test", "title_en": "McMurray Test", "link": "https://www.physiotutors.com/wiki/mcmurray-test/", "youtube_ids": ["lwDFPAyGGgI"], "accuracy": {"sensitivity": "61%", "specificity": "84%", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Smith et al. 2015 meta-analysis; Blyth et al. 2015 found overall diagnostic accuracy of 63% in clinicians' hands"}, "title_zh": "McMurray 測試 McMurray Test", "name_zh": "McMurray 測試", "purpose_zh": "偵測半月板 (meniscus) 撕裂，主要是後角。", "structure_zh": "內側與外側半月板（後側部分；前半部受到的壓力較小、不易測到）。", "procedure_zh": "病人仰臥，受測膝完全屈曲。脛骨內轉並伸膝，在不同屈曲角度重複數次以涵蓋整個外側半月板後側。測內側半月板時完全屈曲、脛骨外轉再伸膝。", "positive_zh": "膝出現彈響 (clicking)、交鎖 (locking) 或疼痛。", "notes_zh": "Smith 等人 (2015) 統合分析：敏感度 61%、特異度 84%；Blyth 等人 (2015) 顯示肌骨臨床人員以此測試的整體診斷準確度僅 63%。確認半月板撕裂中等有用、排除則弱。其他半月板測試：Apley、Thessaly、關節線壓痛、Ege、鴨步、Finochietto、彈回測試。", "tags": ["半月板 meniscus", "確認用 rule-in"]}, {"slug": "thessaly-test", "title_en": "Thessaly Test", "link": "https://www.physiotutors.com/wiki/thessaly-test/", "youtube_ids": ["ebraZ4jM36A"], "accuracy": {"sensitivity": "64%", "specificity": "53%", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Goossens et al. 2015 (higher-quality study vs arthroscopy); Karachalios et al. 2005 originally described it as the most accurate meniscus test"}, "title_zh": "Thessaly 測試 Thessaly Test", "name_zh": "Thessaly 測試", "purpose_zh": "半月板病變的負重誘發測試。", "structure_zh": "負重與旋轉下的內側與外側半月板。", "procedure_zh": "先測健側。病人以患側單腳站立、膝屈 20°，扶著檢查者手臂，身體在脛骨上向左右各旋轉三次。", "positive_zh": "旋轉時關節線疼痛。", "notes_zh": "Karachalios 等人 (2005) 原本描述為最準確的半月板測試，但品質較高的 Goossens 等人 (2015)（以關節鏡為對照）得到敏感度 64%、特異度 53%，並不準確；不過 Apley 與 McMurray 也沒好多少，病史懷疑半月板病變時仍可做，最終可能需要 MRI。其他半月板測試：McMurray、關節線壓痛、Ege、Apley、鴨步、Finochietto。", "tags": ["半月板 meniscus", "負重測試 weight-bearing"]}, {"slug": "apleys-test", "title_en": "Apley's Test", "link": "https://www.physiotutors.com/wiki/apleys-test/", "youtube_ids": ["6Z_9lfX_Pc8"], "accuracy": {"sensitivity": "61%", "specificity": "70%", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Hegedus et al. 2007 meta-analysis; Blyth et al. 2015 overall accuracy 58%"}, "title_zh": "Apley 測試 Apley's Test", "name_zh": "Apley 測試", "purpose_zh": "以牽張與壓迫下的旋轉區分半月板與韌帶病灶。", "structure_zh": "半月板（壓迫）與關節囊韌帶結構（牽張）。", "procedure_zh": "病人俯臥，膝屈 90°，檢查者以自己的腿固定病人大腿。牽張下做脛骨外轉與內轉（看是否旋轉過多或不適），再在壓迫下重複（看旋轉是否減少或不適）。", "positive_zh": "旋轉加牽張比對側更痛或旋轉更多 → 較可能是韌帶病灶；旋轉加壓迫更痛或旋轉減少 → 較可能是半月板損傷。", "notes_zh": "Hegedus 等人 (2007) 統合分析：敏感度 61%、特異度 70%；Blyth 等人 (2015) 整體準確度僅 58%。確認或排除半月板撕裂的能力弱。其他半月板測試：McMurray、Thessaly、關節線壓痛、Ege、鴨步、Finochietto、彈回測試。", "tags": ["半月板 meniscus", "韌帶鑑別 ligament differential"]}, {"slug": "eges-test", "title_en": "Ege's Test", "link": "https://www.physiotutors.com/wiki/eges-test/", "youtube_ids": ["OUwzCKkGQjw"], "accuracy": {"sensitivity": "67% (medial), 64% (lateral)", "specificity": "81% (medial), 90% (lateral)", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Akseki et al. 2004 (single well-conducted study; performed better than McMurray and joint line tenderness)"}, "title_zh": "Ege 測試（負重 McMurray） Ege's Test", "name_zh": "Ege 測試（負重 McMurray）", "purpose_zh": "McMurray 測試的負重版本；半月板症狀多在負重活動出現，此測試彌補非負重測試的不足。", "structure_zh": "內側半月板（外轉下蹲）與外側半月板（內轉下蹲）。", "procedure_zh": "病人站立、膝伸直、雙腳距 30–40 公分。內側半月板：雙腿最大外轉下蹲再慢慢站起（下蹲時雙膝分開並外轉）。外側半月板：雙腿最大內轉下蹲再站起，不必蹲到底、可扶物支撐（雙膝靠攏並內轉）。一出現疼痛或彈響就停止。", "positive_zh": "對應關節線處出現疼痛及／或彈響（檢查者有時聽得到），通常約在屈曲 90°；站起時疼痛也算陽性。前側撕裂在較小屈曲角度出現症狀，後角撕裂在較深屈曲出現。", "notes_zh": "Akseki 等人 (2004)（單一但設計良好的研究）：內側半月板敏感度 67%、特異度 81%；外側敏感度 64%、特異度 90%，優於 McMurray 與關節線壓痛，待其他研究確認，原頁給中等臨床價值。急性期不適用（需能無痛負重與下蹲）；退化性關節炎或髕股疾病會降低準確度，ACL 缺損膝與有積液的膝反而更準確。其他半月板測試：McMurray、關節線壓痛、鴨步、Apley、Finochietto、Thessaly。", "tags": ["半月板 meniscus", "負重測試 weight-bearing", "單一研究 single study"]}, {"slug": "joint-line-tenderness", "title_en": "Joint Line Tenderness", "link": "https://www.physiotutors.com/wiki/joint-line-tenderness/", "youtube_ids": ["XBle4px05ck"], "accuracy": {"sensitivity": "83%", "specificity": "83%", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Smith et al. 2015 systematic review/meta-analysis"}, "title_zh": "關節線壓痛 Joint Line Tenderness", "name_zh": "關節線壓痛", "purpose_zh": "觸診關節線以偵測半月板撕裂；依 Smith 等人 (2015) 是現有最好的臨床工具。", "structure_zh": "脛股關節線上的內外側半月板。原頁盛行率：瑞士研究有症狀者 57%、無症狀者 36%；美國研究 32% 與 23%；荷蘭每年每千人有 2 人新診斷半月板撕裂。", "procedure_zh": "病人仰臥，膝屈 90°（讓半月板前側較易觸診）。脛骨內轉使股骨髁把內側半月板往前推，沿內側關節線觸診並觀察病人反應；再外轉脛骨觸診外側關節線。", "positive_zh": "重現病人熟悉的疼痛。", "notes_zh": "Smith 等人 (2015) 系統性回顧與統合分析：敏感度 83%、特異度 83%，原頁給中等臨床價值。其他半月板測試：McMurray、Finochietto、Ege、Apley、鴨步、Thessaly。", "tags": ["半月板 meniscus", "觸診 palpation"]}, {"slug": "duck-walk-test", "title_en": "Duck Walk Test", "link": "https://www.physiotutors.com/wiki/duck-walk-test/", "youtube_ids": ["C2D9OG1EpbA"], "accuracy": {"sensitivity": "71%", "specificity": "39%", "lr_plus": "not reported", "lr_minus": "not reported", "source": "van der Post et al. 2017"}, "title_zh": "鴨步測試（Childress 測試） Duck Walk Test", "name_zh": "鴨步測試（Childress 測試）", "purpose_zh": "Childress (1957) 的蹲走測試，針對容易被漏診的內側半月板後三分之一單獨病變（起病不明確、主訴模糊、很少滑膜反應、從不真正交鎖；病人多從事蹲姿工作）。", "structure_zh": "半月板，原本針對內側半月板後角；驗證研究中對前、後、內、外側撕裂表現相同。", "procedure_zh": "⚠ 來源問題：原頁的操作段落是從關節線壓痛頁面複製過來的（仰臥膝屈 90° 觸診），並未描述鴨步本身；實際的蹲走操作只在影片中。", "positive_zh": "依原頁文字：重現病人熟悉的疼痛（與關節線壓痛頁相同措辭）。", "notes_zh": "van der Post 等人 (2017)：敏感度 71%、特異度 39%，準確度有限、臨床價值偏弱。其他半月板測試：McMurray、關節線壓痛、Ege、Apley、Finochietto、Thessaly。", "tags": ["半月板 meniscus", "負重測試 weight-bearing", "來源有誤 source issue"]}, {"slug": "finochietto-test", "title_en": "Finochietto Test", "link": "https://www.physiotutors.com/wiki/finochietto-test/", "youtube_ids": ["hY_k9-VOIEE"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a: not validated by any diagnostic study (Shrier et al. 2010)"}, "title_zh": "Finochietto 測試（跳躍徵象） Finochietto Test", "name_zh": "Finochietto 測試（跳躍徵象）", "purpose_zh": "在深屈曲下用力做前抽屜，偵測撕裂的半月板後角位移。", "structure_zh": "半月板後角。半月板撕裂發生率約每十萬人 61 人，約三分之一與運動有關；30 歲以下多為周邊創傷性撕裂，年長者多為複雜／退化型。", "procedure_zh": "膝屈曲至 130–140° 並固定。檢查者如前抽屜測試般把脛骨往前拉，但力道更猛。", "positive_zh": "感覺到「跳躍」(jump)：撕裂的後角移到脛股接觸點前方；幾乎聽不到也看不到，不一定疼痛。ACL／PCL 撕裂造成的鬆弛不算陽性；游離體或先天盤狀半月板 (discoid meniscus) 也可能陽性。", "notes_zh": "尚無任何診斷研究驗證（Shrier 等人 2010），臨床價值未知。Shrier 等人主張半月板撕裂異質性高（前側 vs 後側），不應只看合併的敏感度／特異度，而應依各測試應力半月板不同部位的邏輯選擇測試。其他半月板測試：McMurray、關節線壓痛、Ege、Apley、鴨步、Thessaly。", "tags": ["半月板 meniscus", "後角 posterior horn", "效度未知 unvalidated"]}, {"slug": "patellofemoral-pain-diagnosis", "title_en": "Patellofemoral Pain Diagnosis", "link": "https://www.physiotutors.com/wiki/patellofemoral-pain-diagnosis/", "youtube_ids": ["9cuF4fMAfQY"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a (page cites Crossley et al. 2016 consensus statement)"}, "title_zh": "髕股疼痛症候群診斷 Patellofemoral Pain Diagnosis", "name_zh": "髕股疼痛症候群診斷", "purpose_zh": "髕股疼痛症候群 (patellofemoral pain syndrome, PFPS) 的診斷總論：跑步、下蹲或上下樓梯時的前膝痛，各年齡層都會發生，高達 60% 的病例可持續多年。", "structure_zh": "髕股關節 (patellofemoral joint)：屈膝負重時的負荷改變；假說包括髕股排列異常／滑車 (trochlea) 形態異常造成髕骨滑動不順，以及股四頭肌與臀肌無力（股骨內轉改變下肢軸線）。", "procedure_zh": "排除性診斷，先排除其他病變。各種診斷組合臨床價值都弱；目前最好的單一發現是「下蹲時前膝痛」。", "positive_zh": "下蹲時前膝痛：有此發現者 80% 會證實為 PFPS。", "notes_zh": "原頁引用 Crossley 等人 (2016) 共識聲明。相關測試：decline step-down 測試、Clarke 徵象、髕股疼痛組合。", "tags": ["PFPS", "排除性診斷 diagnosis of exclusion", "前膝痛 anterior knee pain"]}, {"slug": "patellofemoral-pain-cluster", "title_en": "Patellofemoral Pain Cluster", "link": "https://www.physiotutors.com/wiki/patellofemoral-pain-cluster/", "youtube_ids": ["8wibzAPZ22c", "vyKMuZYazpw", "Xp1poMw2UPw"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "3.3 (cluster 1, 2/2); 4.0 (cluster 2, 2/3); 3.1 (cluster 3, 3/3)", "lr_minus": "0.73 (cluster 1); 0.5 (cluster 2); 0.7 (cluster 3)", "source": "Cook et al. 2010"}, "title_zh": "髕股疼痛組合測試 Patellofemoral Pain Cluster", "name_zh": "髕股疼痛組合測試", "purpose_zh": "Cook 等人 (2010) 提出的三組髕股疼痛症候群診斷組合。", "structure_zh": "髕股關節；功能性與情境性發現（肌肉收縮、下蹲、跪姿、髕骨周圍觸診）。", "procedure_zh": "組合 1：肌肉收縮時痛＋下蹲時痛（2/2）。組合 2：肌肉收縮、下蹲、髕骨周圍觸診任兩項疼痛（2/3）。組合 3：肌肉收縮＋下蹲＋跪姿皆痛（3/3）。", "positive_zh": "符合上述組合條件。", "notes_zh": "Cook 等人 (2010)：組合 1 的 LR+ 3.3、LR− 0.73；組合 2 的 LR+ 4、LR− 0.5；組合 3 的 LR+ 3.1、LR− 0.7。數值不高且信賴區間寬，三者皆只有弱臨床價值。本頁有三支影片（每組一支）。相關測試：decline step-down、Clarke 徵象。", "tags": ["PFPS", "cluster", "概似比 likelihood ratio"]}, {"slug": "clarkes-sign", "title_en": "Clarke's Sign", "link": "https://www.physiotutors.com/wiki/clarkes-sign/", "youtube_ids": ["pRqnODPqxFs"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "0.9-7.4 (range across studies)", "lr_minus": "0.7-1.1 (range across studies)", "source": "Cook et al. 2012 systematic review (no high-quality studies); also cited Nijs et al. 2006"}, "title_zh": "Clarke 徵象（髕骨研磨測試） Clarke's Sign", "name_zh": "Clarke 徵象（髕骨研磨測試）", "purpose_zh": "在股四頭肌收縮時壓迫髕骨，以找出髕骨後軟骨的病理變化。", "structure_zh": "髕股關節／髕骨後軟骨。", "procedure_zh": "病人仰臥、膝伸直。檢查者在患側，以拇指虎口放在髕骨上緣，向下向遠端施壓，同時請病人像要伸膝一樣收縮股四頭肌。", "positive_zh": "髕骨移動時疼痛，或無法完成測試。", "notes_zh": "Cook 等人 (2012) 系統性回顧：各研究 LR+ 0.9–7.4、LR− 0.7–1.1，沒有高品質研究，臨床價值弱（另引 Nijs 等人 2006）。相關測試：髕骨恐懼測試、動態髕骨恐懼測試、decline step-down。", "tags": ["PFPS", "髕骨後軟骨 retropatellar cartilage", "臨床價值弱 weak"]}, {"slug": "decline-step-down-test", "title_en": "Decline Step Down Test", "link": "https://www.physiotutors.com/wiki/decline-step-down-test/", "youtube_ids": ["Io0TgfyQLAk"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Reliability/validity only: Ophey et al. 2019, 'perfect' intra- and inter-observer reliability, average but significant construct validity vs the anterior knee pain scale"}, "title_zh": "下斜板下階測試 Decline Step Down Test", "name_zh": "下斜板下階測試", "purpose_zh": "髕股疼痛的表現測試 (performance test)：在下斜板上做下階動作，量測最大無痛膝屈曲角度；下樓梯痛是 PFPS 的標誌症狀。", "structure_zh": "離心股四頭肌負荷下的髕股關節。", "procedure_zh": "⚠ 來源問題：原頁的操作段落是從 Clarke 徵象頁面複製來的（仰臥壓髕骨加股四頭肌收縮），並未描述下斜板下階；實際操作（從下斜板下階、記錄最大無痛屈曲角度）只在影片與 Ophey 等人 2019 中。", "positive_zh": "結果為最大無痛屈曲角度（依原頁對 Ophey 等人 2019 的描述）；原頁的「陽性」句子是從 Clarke 徵象複製的。", "notes_zh": "Ophey 等人 (2019)：施測者內／間信度「完美」，與前膝痛量表 (anterior knee pain scale) 的建構效度中等但顯著，原頁給作為表現／結果測試的中等臨床價值。相關測試：髕骨恐懼測試、動態髕骨恐懼測試、Clarke 徵象。", "tags": ["PFPS", "表現測試 performance test", "來源有誤 source issue"]}, {"slug": "patellar-apprehension-test", "title_en": "Patellar Apprehension Test", "link": "https://www.physiotutors.com/wiki/patellar-apprehension-test/", "youtube_ids": ["4TnCQppTy1g"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "1.3 (pooled)", "lr_minus": "1.0 (pooled)", "source": "Nunes et al. 2013 systematic review/meta-analysis (clinical tests for PFPS); also cited Malanga et al. 2003"}, "title_zh": "髕骨恐懼測試 Patellar Apprehension Test", "name_zh": "髕骨恐懼測試", "purpose_zh": "評估髕骨外側不穩定／髕骨脫位 (patellar dislocation) 病史。", "structure_zh": "髕骨與內側軟組織限制結構；危險因子包括滑車溝角 (sulcus angle) 與深度、遺傳傾向。", "procedure_zh": "病人仰臥，膝屈 30°，股四頭肌放鬆。雙拇指放在髕骨內側，向外側推到最大位移。", "positive_zh": "在最大外側位移時出現恐懼或不適；病人可能抓住檢查者的手，或伸膝把髕骨拉回。", "notes_zh": "Nunes 等人 (2013) 系統性回顧與統合分析（PFPS 的臨床測試）：合併 LR+ 1.3、LR− 1.0，臨床價值弱（另引 Malanga 等人 2003）。替代：動態髕骨恐懼測試。", "tags": ["髕骨不穩定 patellar instability", "脫位 dislocation", "臨床價值弱 weak"]}, {"slug": "moving-patellar-apprehension-test", "title_en": "Moving Patellar Apprehension Test", "link": "https://www.physiotutors.com/wiki/moving-patellar-apprehension-test/", "youtube_ids": ["IKhEElT8jvQ"], "accuracy": {"sensitivity": "100%", "specificity": "88.4%", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Ahmad et al. 2009 diagnostic cohort, overall accuracy 94.1% (excluded symptomatic subluxations; not validated by other studies)"}, "title_zh": "動態髕骨恐懼測試 Moving Patellar Apprehension Test", "name_zh": "動態髕骨恐懼測試", "purpose_zh": "Ahmad 等人 (2009) 的動態測試，模擬實際的髕骨脫位／不穩定事件，用於靜態恐懼測試、CT 或 MRI 可能漏掉的病人。", "structure_zh": "屈曲時進入滑車的髕骨；內側髕股韌帶 (medial patellofemoral ligament, MPFL) 與內側軟組織引導髕骨進入滑車；髕骨在約 20° 屈曲時最容易半脫位。", "procedure_zh": "病人仰臥、小腿垂出床緣。第一部分：膝完全伸直時以拇指把髕骨推向外側，維持下屈膝到 90°，觀察病人口頭表達的恐懼或股四頭肌收縮以阻止屈曲／重新定位髕骨，再維持外推回到伸直。第二部分：膝完全伸直時以食指把髕骨盡量推向內側，屈膝到 90°，恐懼與股四頭肌收縮應消失。", "positive_zh": "兩部分都陽性：第一部分外推時恐懼，第二部分內推時恐懼消失。", "notes_zh": "Ahmad 等人 (2009) 診斷世代：敏感度 100%、特異度 88.4%，整體準確度 94.1%；研究排除了症狀性半脫位病人且未被其他研究驗證，原頁給中等臨床價值。概念類似 ACL 的樞軸移位、肩的 release 測試與肘的動態外翻應力測試。替代：髕骨恐懼測試。", "tags": ["髕骨不穩定 patellar instability", "MPFL", "動態測試 dynamic"]}, {"slug": "hoffas-test", "title_en": "Hoffa's Test", "link": "https://www.physiotutors.com/wiki/hoffas-test/", "youtube_ids": ["QdCJU7EQc3k"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a: not evaluated in diagnostic studies (Dragoo et al. 2012)"}, "title_zh": "Hoffa 測試 Hoffa's Test", "name_zh": "Hoffa 測試", "purpose_zh": "偵測髕下脂肪墊 (infrapatellar fat pad, Hoffa's fat pad) 夾擠，一個常被忽略的前膝痛來源。", "structure_zh": "髕下脂肪墊：關節囊內、滑膜外的脂肪組織，從髕骨下極延伸到脛骨近端，血管與神經支配豐富。", "procedure_zh": "病人仰臥，膝屈 30–60°。一手從後方托住脛骨，另一手直接按壓髕骨下極的內側與外側。膝伸直時重複。", "positive_zh": "任一側按壓在伸直位比屈曲位更痛。", "notes_zh": "未經診斷研究評估（Dragoo 等人 2012），臨床價值存疑。須與髕股疼痛區分（見 PFPS 診斷、PFPS 組合、decline step-down、Clarke 徵象）。", "tags": ["髕下脂肪墊 fat pad", "前膝痛 anterior knee pain", "效度未知 unvalidated"]}, {"slug": "patellar-tendon-palpation", "title_en": "Patellar Tendon Palpation", "link": "https://www.physiotutors.com/wiki/patellar-tendon-palpation/", "youtube_ids": ["L0Q8QjSMcrU"], "accuracy": {"sensitivity": "68% (Cook 2001); 98% (Maffulli 2017)", "specificity": "9% (Cook 2001); 94% (Maffulli 2017)", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Cook et al. 2001 (vs ultrasound, young basketball players); Maffulli et al. 2017 (different ultrasound criteria and recruitment setting)"}, "title_zh": "髕骨肌腱觸診 Patellar Tendon Palpation", "name_zh": "髕骨肌腱觸診", "purpose_zh": "觸診以評估髕骨肌腱病變 (patellar tendinopathy)，常見於排球、籃球、田徑等跳躍運動的前膝痛。", "structure_zh": "髕骨肌腱，特別是髕骨下極的附著處。", "procedure_zh": "病人仰臥。輕柔觸診髕骨肌腱在髕骨下極的附著處，並沿全長由近端到遠端觸診。", "positive_zh": "觸診壓痛。", "notes_zh": "Cook 等人 (2001)（以超音波為對照、年輕籃球員）：敏感度 68%、特異度僅 9%；Maffulli 等人 (2017)：敏感度 98%、特異度 94%，但超音波陽性定義與收案情境不同。數值衝突，作為單一測試的臨床價值仍為中等。相關測試：Royal London Hospital 測試（膝）。", "tags": ["髕骨肌腱病變 patellar tendinopathy", "觸診 palpation", "跳躍膝 jumper's knee"]}, {"slug": "royal-london-hospital-test-knee", "title_en": "Royal London Hospital Test Knee", "link": "https://www.physiotutors.com/wiki/royal-london-hospital-test-knee/", "youtube_ids": ["0frNJSo0DEM"], "accuracy": {"sensitivity": "88%", "specificity": "98%", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Maffulli et al. 2017 (small sample of 30 patients)"}, "title_zh": "Royal London Hospital 測試（膝） Royal London Hospital Test Knee", "name_zh": "Royal London Hospital 測試（膝）", "purpose_zh": "比較膝伸直與屈曲時肌腱壓痛的變化以診斷髕骨肌腱病變（由阿基里斯腱版本改編）。", "structure_zh": "髕骨肌腱；肌腱受張力時壓痛改變。", "procedure_zh": "病人仰臥。膝伸直時沿肌腱由近端到遠端觸診找出局部壓痛，再把膝屈到 90°（肌腱受張力）觸診同一部位。", "positive_zh": "膝屈曲時疼痛明顯減輕或消失。機轉不明。", "notes_zh": "Maffulli 等人 (2017)（小樣本 30 人）：敏感度 88%、特異度 98%。樣本小、且超音波定義與收案情境與 Cook 等人 (2001) 不同（該研究觸診敏感度 68%、特異度 9%），臨床價值仍為中等。相關測試：髕骨肌腱觸診。", "tags": ["髕骨肌腱病變 patellar tendinopathy", "小樣本 small sample"]}, {"slug": "nobles-test", "title_en": "Noble's Test", "link": "https://www.physiotutors.com/wiki/nobles-test/", "youtube_ids": ["PmUGl7ryQOo"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a: no diagnostic accuracy studies (Noble 1979)"}, "title_zh": "Noble 壓迫測試 Noble's Test", "name_zh": "Noble 壓迫測試", "purpose_zh": "髂脛束症候群 (iliotibial band syndrome, ITBS，跑者膝 runner's knee) 的誘發測試；ITBS 是跑者、自行車手等耐力運動員常見的過度使用傷害。", "structure_zh": "股骨外上髁 (lateral femoral epicondyle) 處的遠端髂脛束；推測機轉為摩擦、壓迫其下的脂肪墊與結締組織、或滑囊炎。髖外展肌無力是否為主因的證據有限或互相矛盾（van der Worp 等人 2012）。", "procedure_zh": "膝屈 90°，在股骨外上髁或其近端 1–2 公分處施壓，再逐漸伸膝。", "positive_zh": "約屈曲 30° 時外上髁劇痛，性質與跑步時相同（髂脛束在此角度滑過外上髁）。", "notes_zh": "ITBS 靠病史與臨床表現診斷；本測試未經診斷準確度研究（Noble 1979），臨床價值存疑。相關：Renne 測試、ITBS 復健頁面。", "tags": ["髂脛束症候群 ITBS", "跑者膝 runner's knee", "效度未知 unvalidated"]}, {"slug": "rennes-test", "title_en": "Renne's Test", "link": "https://www.physiotutors.com/wiki/rennes-test/", "youtube_ids": ["pKktA1bjQbc"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a: no diagnostic accuracy studies (Renne 1975)"}, "title_zh": "Renne 測試 Renne's Test", "name_zh": "Renne 測試", "purpose_zh": "髂脛束症候群 (ITBS，跑者膝) 的誘發測試。", "structure_zh": "股骨外上髁處的遠端髂脛束（背景同 Noble 測試）。", "procedure_zh": "⚠ 來源問題：原頁的操作段落與 Noble 測試頁一字不差（膝屈 90° 壓外上髁再伸膝）；Renne (1975) 原始的負重描述不在原頁文字中，請以影片為準。", "positive_zh": "依原頁文字：約屈曲 30° 時外上髁劇痛、性質與跑步時相同（與 Noble 頁相同）。", "notes_zh": "未經診斷準確度研究（Renne 1975），臨床價值存疑。相關：Noble 壓迫測試、ITBS 復健頁面。", "tags": ["髂脛束症候群 ITBS", "跑者膝 runner's knee", "來源有誤 source issue"]}, {"slug": "hop-test-cluster", "title_en": "Hop Test Cluster", "link": "https://www.physiotutors.com/wiki/hop-test-cluster/", "youtube_ids": ["mZk26NvfIVI"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Gustavsson et al. 2006: test-retest ICC 0.85-0.97; battery identified healthy subjects with 84% accuracy (3 normal LSIs) and classified patients as abnormal with 88% accuracy (≥1 abnormal LSI) at 6 and 11 months post-reconstruction"}, "title_zh": "單腳跳測試組合（Gustavsson） Hop Test Cluster", "name_zh": "單腳跳測試組合（Gustavsson）", "purpose_zh": "Gustavsson 的三項單腳跳測試組合，比較 ACL 受傷／重建後患側與健側的單腳跳表現（含疲勞下表現），用於復健進度與回場 (return to sport) 決策。", "structure_zh": "ACL 受傷後的下肢爆發力、控制與耐力；以肢體對稱指數 (limb symmetry index, LSI＝患側／健側 × 100) 計分。", "procedure_zh": "1) 垂直跳：反向跳 (countermovement jump)，雙手背在身後，由滯空時間換算高度（接觸墊，或 Haynes 等人 2019 驗證過的 MyJump2 app）。2) 單腳跳遠：單腳起跳同腳落地，雙手背後，落地需穩定且腳不移動；量起跳腳尖到落地腳跟的距離。3) 側向跳：在相距 40 公分的兩條膠帶間左右跳 30 秒，雙手背後，計成功次數；碰到膠帶算失誤，失誤超過 25% 則休息 3 分鐘後再做第二次。", "positive_zh": "LSI > 90% 一般視為正常；一項以上 LSI 異常即歸為異常。", "notes_zh": "Gustavsson 等人 (2006)：各測試再測信度 ICC 0.85–0.97；三項 LSI 皆正常時辨識健康人的準確度 84%，一項以上異常時在重建後 6 與 11 個月歸類病人為異常的準確度 88%，原頁給高臨床價值。LSI 會高估膝功能：ACL 重建運動員相較常模有雙側缺損（Gokeler 等人 2017、Wellsandt 等人 2017），宜用傷前資料或依年齡、性別、運動的常模。也應在疲勞狀態下測：LSI > 90% 的病人在疲勞下只有 32% 仍達 90%（Augustsson 2004；內文寫 2014）。只是回場決策的一環。", "tags": ["回場測試 return to sport", "ACL", "肢體對稱指數 LSI"]}, {"slug": "drop-jump-test", "title_en": "Drop Jump Test", "link": "https://www.physiotutors.com/wiki/drop-jump-test/", "youtube_ids": ["yRnt111GaRY"], "accuracy": {"sensitivity": "67-87%", "specificity": "60-72%", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Ekegren et al. 2009 observational risk screening (intra-/inter-rater kappa 0.75-0.85); values judged inadequate"}, "title_zh": "落地跳測試 Drop Jump Test", "name_zh": "落地跳測試", "purpose_zh": "觀察落地時的動態膝外翻 (dynamic knee valgus)，將落地機制分為非接觸性 ACL 傷害的低風險或高風險（髖部神經肌肉控制不足）。", "structure_zh": "落地與垂直跳時冠狀面的膝排列（髕骨相對第一腳趾）；軀幹與髖的控制。", "procedure_zh": "病人站在 31 公分高的箱子上，落地後立即做最大垂直跳，雙臂維持「停止姿勢」（肩外展 45°、肘屈 90°）以減少擺臂動量。練習 3 次後連續做 9 次，每次間隔 10 秒。以相機錄影並慢動作回放（例如 Hudl app）。", "positive_zh": "高風險落地：髕骨向內移動、落到第一腳趾內側。低風險：髕骨與第一腳趾對齊。", "notes_zh": "Ekegren 等人 (2009) 觀察式風險篩檢：施測者內／間 kappa 0.75–0.85；敏感度 67–87%、特異度 60–72%，被認為不足，篩檢時應加上其他高風險特徵的測試。多少膝外翻會造成傷害尚未知，篩檢效度不明（Krosshaug 等人 2016：在 710 名女性運動員中是差的篩檢測試）。單側膝外翻合併同側軀幹移動可能也是危險因子；單腳落地跳的排列變化比雙腳大，因此單腳跳測試在復健與回場中也有用。原頁把 app 名稱寫成「Huddle」。", "tags": ["動態膝外翻 dynamic knee valgus", "ACL 風險 risk screening", "回場測試 return to sport"]}, {"slug": "star-excursion-balance-test", "title_en": "Star Excursion Balance Test", "link": "https://www.physiotutors.com/wiki/star-excursion-balance-test/", "youtube_ids": ["4GMzE7NV3W0"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Reliability only: Gribble et al. 2013, inter-rater 0.86-0.92"}, "title_zh": "星狀伸展平衡測試 Star Excursion Balance Test", "name_zh": "星狀伸展平衡測試", "purpose_zh": "單腳站立向八個方向伸腳的動態姿勢控制測試 (SEBT)；能區分慢性踝不穩定、髕股疼痛與 ACL 重建者，並協助辨識傷害風險。", "structure_zh": "下肢動態平衡；伸腳距離以腿長標準化。", "procedure_zh": "六條膠帶以 45° 交錯貼成八方向星形。每方向練習 4–6 次後休息 5 分鐘。赤腳單腳站、雙手叉腰，沿每條膠帶盡量伸遠，以伸腳最遠端輕觸、不可轉移重量；檢查者標記最遠點。輕觸變重壓、腳停住、需觸地維持平衡、或站立腳抬起／移動都算無效。每次伸腳後回到中心雙腳站；每腿完成 3 個完整循環。計分：每方向 3 次取平均（16 個值），除以腿長 × 100，比較兩側。", "positive_zh": "不對稱或綜合分數低。原頁例子：籃球員前向伸腳不對稱 > 4 公分預測較高的下肢傷害風險（Plisky 等人 2006）；大學美式足球員綜合分數 < 90% 受傷可能性 3.5 倍（原頁歸於 Pollock 等人 2010，參考文獻列的是 Butler 等人 2013）。", "notes_zh": "Gribble 等人 (2013)：施測者間信度 0.86–0.92，原頁給高臨床價值。不同運動與性別的表現與傷害風險差異很大，切點須謹慎推廣。簡化版：Y 平衡測試。", "tags": ["動態平衡 dynamic balance", "回場測試 return to sport", "傷害風險 injury risk"]}, {"slug": "y-balance-test", "title_en": "Y-Balance Test", "link": "https://www.physiotutors.com/wiki/y-balance-test/", "youtube_ids": ["qFVuS-P2FrI"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Reliability only: page states 'excellent inter-rater reliability between 0.48-0.78' attributed to Plisky et al. 2006 (reference list gives Plisky 2009)"}, "title_zh": "Y 平衡測試 Y-Balance Test", "name_zh": "Y 平衡測試", "purpose_zh": "星狀伸展平衡測試的簡化版，只測前向、後內側與後外側伸腳，用於找出缺損與不對稱並協助回場決策。", "structure_zh": "下肢動態平衡；伸腳距離以腿長標準化。", "procedure_zh": "三條膠帶貼成 Y 形（前向與兩條後向各夾 135°，兩條後向之間 45°）。每方向練習 4–6 次，正式測 3 次。前向：站立腳腳趾對齊零點；後向：腳跟對齊零點。赤腳、雙手叉腰，沿膠帶盡量伸遠、以腳趾輕觸；每方向右腳站 3 次再左腳站 3 次。重壓、在中點停住、觸地維持平衡或站立腳移動皆無效。計分：每方向 3 次平均（6 個值），除以腿長 × 100。", "positive_zh": "不對稱或綜合分數低。原頁例子：大學美式足球員綜合分數 < 98.6% 受傷風險 3.5 倍（Butler 等人 2013）；籃球員前向伸腳不對稱 > 4 公分預測傷害（Plisky 等人 2006）。因運動與性別差異大，沒有明確的不對稱切點。", "notes_zh": "⚠ 原頁寫「依 Plisky 等人 (2006)，施測者間信度 0.48–0.78，極佳」（參考文獻列的是 Plisky 2009）；0.48–0.78 稱為極佳與一般信度標準不符，此處照原文記錄。相關：SEBT、落地跳、單腳跳組合。", "tags": ["動態平衡 dynamic balance", "回場測試 return to sport", "來源存疑 source issue"]}, {"slug": "acl-rehab", "title_en": "ACL Rehab Phase 1", "link": "https://www.physiotutors.com/wiki/acl-rehab/", "youtube_ids": ["kFGB7gW3pQ8"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a"}, "title_zh": "ACL 重建後復健第一期 ACL Rehab Phase 1", "name_zh": "ACL 重建後復健第一期", "purpose_zh": "ACL 重建後第一期復健：恢復正常關節功能（消腫、達到完全伸直、正常髕股關節活動、選擇性股四頭肌控制、正常步態）。", "structure_zh": "ACL 移植物（骨-髕腱-骨 bone-patellar tendon-bone 或腿後肌腱 hamstring graft）、髕股關節、股四頭肌；ACL 也有神經肌肉功能（約 2.5% 為機械受器 mechanoreceptors，受傷後不會再長）。", "procedure_zh": "活動度：腳跟滑行、膝下墊毛巾做伸膝，必要時徒手鬆動伸直或髕股關節；步態對稱前使用拐杖；固定式腳踏車作為暖身／鬆動。肌力：閉鎖鏈的等長、向心與離心運動可早期進行；前 3–4 週深蹲／腿推最安全的範圍是屈曲 0–60°。開放鏈伸膝 4 週後才可做、範圍 90–45°，每週增加約 10° 伸直（第 5 週 90–35°、第 6 週 90–25°）；髕腱移植 4 週後可加外部阻力，腿後肌腱移植則要 12 週後。直腿抬高與側臥外展不會應力 ACL，第一週即可做。早期開始神經肌肉／平衡訓練。", "positive_zh": "不適用（復健頁面）。", "notes_zh": "參考文獻包括 Escamilla 2012、荷蘭指引（Meuffels 2012）、van Grinsven 2010、van Melick 2016、Risberg 2007、Wright 2008。原頁文字殘留製作筆記（「In een table naast Kirsten」、「show pendulum on the bike」）。", "tags": ["ACL 重建 reconstruction", "復健 rehab", "移植物保護 graft protection"]}, {"slug": "itb-syndrome-rehab", "title_en": "ITB Syndrome Rehab", "link": "https://www.physiotutors.com/wiki/itb-syndrome-rehab/", "youtube_ids": ["NTS-whIxbuw"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a"}, "title_zh": "髂脛束症候群復健 ITB Syndrome Rehab", "name_zh": "髂脛束症候群復健", "purpose_zh": "跑者髂脛束症候群 (ITBS) 的五階段復健計畫（依 Tom Goom），建立在 Willy & Meira (2016) 的三個要素：尖峰負荷、能量儲存與釋放、累積負荷。", "structure_zh": "髂脛束 (iliotibial band)，可能是壓迫性傷害；功能類似肌腱、在跑步時儲存與釋放能量（Eng 等人 2015），因此需要剛性（Friede 等人 2020：物理治療改善結果並使 ITB 剛性增加 14%）。伸展與滾筒放鬆無用，可能加重壓迫。", "procedure_zh": "第一期（疼痛主導：下樓梯、快走痛）：停跑尤其是越野／下坡，改為 8–10° 坡度的快速跑步機走路，或低座墊騎車／游泳；低負荷髖外展與伸展肌訓練：蚌殼式、側臥外展、Thomas／ITB 偏移運動 10×10 秒。下樓梯無痛即進入負荷主導期。第二期（重負荷慢速阻力訓練，每週 3 次直到恢復跑步）：側棒式、單腳橋式、消防栓式、分腿蹲（訓練後腿）、彈力帶側弓步；3 組 10–12 下進階到 4 組 6–8 下接近力竭。第三期（增強式訓練，約 1 週）：小幅深蹲跳、後弓步加跳、側向滑冰跳、彈力帶節奏跑；進階：分腿跳、深蹲跳單腳落地、單腳前後跳。第四期：漸進恢復平地跑（couch-to-5K 計畫），坡度從 8–10° 降到 5° 再到平地，鏡像步態再訓練：加寬步寬、加大膝窗 (knee window)、步頻提高 5–10%，提示依個案調整。第五期：逐步加入下坡與越野跑，先分日再合併。", "positive_zh": "不適用（復健頁面）。", "notes_zh": "Willy 等人 (2012)：臀肌強化不會改變跑步力學，鏡像步態再訓練則有效。內容感謝 Rich Willy、Tom Goom 與 Benoy Mathew 提供意見。", "tags": ["髂脛束症候群 ITBS", "跑步復健 running rehab", "漸進負荷 graded loading"]}, {"slug": "best-hamstring-exercises", "title_en": "Best Hamstring Exercises", "link": "https://www.physiotutors.com/wiki/best-hamstring-exercises/", "youtube_ids": ["2PGC_gmgj30"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a"}, "title_zh": "最佳腿後肌運動 Best Hamstring Exercises", "name_zh": "最佳腿後肌運動", "purpose_zh": "依區域性肌肉使用（Mendez-Villanueva 等人 2016 的 MRI 研究）選擇腿後肌運動，用於復健後期與傷害預防。", "structure_zh": "腿後肌群四條肌腹：半膜肌 (semimembranosus)、半腱肌 (semitendinosus)、股二頭肌 (biceps femoris) 長頭與短頭。", "procedure_zh": "飛輪腿彎舉 (flywheel leg curl) 與程度較低的北歐腿後肌彎舉 (Nordic hamstring curl) 主要訓練股二頭肌短頭（及半腱肌、半膜肌）；髖伸直圓錐滑輪 (hip-extension conic pulley) 選擇性負荷股二頭肌長頭近端；俄式腰帶運動 (Russian belt) 可作為補充。影片示範四個運動。", "positive_zh": "不適用（運動頁面）。", "notes_zh": "剛受傷的腿後肌拉傷原頁建議先用 Askling 方案。另見北歐腿後肌彎舉變化式。", "tags": ["腿後肌群 hamstrings", "運動治療 exercise", "傷害預防 prevention"]}, {"slug": "nordic-hamstring-curl-variations", "title_en": "Nordic Hamstring Curl Variations", "link": "https://www.physiotutors.com/wiki/nordic-hamstring-curl-variations/", "youtube_ids": ["ihTUvs997b4"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a"}, "title_zh": "北歐腿後肌彎舉變化式 Nordic Hamstring Curl Variations", "name_zh": "北歐腿後肌彎舉變化式", "purpose_zh": "不需同伴的北歐腿後肌彎舉變化式，用於腿後肌拉傷的預防與復健，也可作為循序建立到完整動作的進階。", "structure_zh": "腿後肌群；北歐彎舉主要訓練股二頭肌短頭與半腱肌（Mendez-Villanueva 等人 2016）。", "procedure_zh": "示範的變化式：滑輪下拉機、彈力帶、瑞士球滾出。", "positive_zh": "不適用（運動頁面）。", "notes_zh": "要涵蓋半膜肌與股二頭肌長頭，見最佳腿後肌運動頁面；急性受傷則用 Askling 方案。原頁文字殘留製作筆記（「plaque research」、「show clip」）。", "tags": ["腿後肌群 hamstrings", "北歐彎舉 Nordic curl", "運動治療 exercise"]}, {"slug": "askling-protocol", "title_en": "Askling Protocol", "link": "https://www.physiotutors.com/wiki/askling-protocol/", "youtube_ids": ["D6bGLfCk4QU"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a"}, "title_zh": "Askling 方案 Askling Protocol", "name_zh": "Askling 方案", "purpose_zh": "急性腿後肌拉傷的早期復健方案，強調肌肉拉長時的負荷（Askling 等人 2013 在瑞典菁英足球的隨機對照試驗，優於傳統方案）。", "structure_zh": "腿後肌群：股二頭肌（長頭與短頭）、半腱肌、半膜肌。伸展型傷害（滑鏟、高踢）多傷及半膜肌；衝刺型傷害多傷及股二頭肌長頭。", "procedure_zh": "1) Extender：固定患側大腿、髖屈約 90°，緩慢伸膝到疼痛前；每天兩次、3 組 12 下。2) Diver：站立腳微屈膝、擺動腳屈膝 90°，以髖屈曲向前俯衝並雙臂前伸；先慢後快，隔日一次、3 組 6 下。3) Glider：軀幹直立、一手扶支撐、雙腿略分開，體重放在患側腳跟、膝屈 10–20°，另一腳向後滑到疼痛前停止，回程用雙臂而非患腿；以增加滑行距離與速度進階，每三天一次、3 組 4 下。", "positive_zh": "不適用（復健頁面）。", "notes_zh": "復健後期可進階到涵蓋所有腿後肌肌頭的運動（見最佳腿後肌運動頁面）。", "tags": ["腿後肌拉傷 hamstring strain", "急性期復健 acute rehab", "離心負荷 lengthening"]}]}</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const CATS = DATA.categories, T = DATA.tests;
const order = CATS.flatMap(c => c.slugs);
const bySlug = Object.fromEntries(T.map(t => [t.slug, t]));
const catOf = Object.fromEntries(CATS.flatMap(c => c.slugs.map(s => [s, c])));
const LS = 'physio-atlas-done-knee';
let done = new Set(); try { done = new Set(JSON.parse(localStorage.getItem(LS) || '[]')); } catch (e) {}
function saveDone(){ try { localStorage.setItem(LS, JSON.stringify([...done])); } catch (e) {} }
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ----- sidebar ----- */
const nav = document.getElementById('nav');
nav.innerHTML = CATS.map((c, i) => `
<details class="cat" id="cat-${c.id}" ${i === 0 ? 'open' : ''}>
  <summary><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="zh">${esc(c.zh)}</span><span class="en">${esc(c.en)}</span></summary>
  <ul>${c.slugs.map(s => { const t = bySlug[s]; return `<li data-slug="${s}"><a href="#${s}" data-slug="${s}"><span class="tick"></span><span class="t">${esc(t.name_zh)}<small>${esc(t.title_en)}</small></span></a></li>`; }).join('')}</ul>
</details>`).join('');

function refreshNav(){
  nav.querySelectorAll('a').forEach(a => {
    a.classList.toggle('done', done.has(a.dataset.slug));
    a.classList.toggle('active', a.dataset.slug === current);
  });
  const n = done.size, N = order.length, pct = Math.round(100 * n / N);
  document.getElementById('pct').textContent = pct + '%';
  document.getElementById('cnt').textContent = `${n} / ${N}`;
  document.getElementById('barfill').style.width = pct + '%';
}

/* ----- search ----- */
document.getElementById('q').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  nav.querySelectorAll('.cat').forEach(cat => {
    let any = false;
    cat.querySelectorAll('li').forEach(li => {
      const t = bySlug[li.dataset.slug];
      const hay = [t.title_zh, t.title_en, t.structure_zh, (t.tags || []).join(' '), t.purpose_zh].join(' ').toLowerCase();
      const hit = !q || hay.includes(q);
      li.hidden = !hit; any = any || hit;
    });
    cat.classList.toggle('nomatch', !any);
    if (q && any) cat.open = true;
  });
});

/* ----- rendering ----- */
let current = null, vidIdx = 0;
const art = document.getElementById('art');
function accRow(label, v){ return v && !/^(n\/a|not reported|none|-)$/i.test(v) ? `<div><b>${label}</b><span>${esc(v)}</span></div>` : ''; }

function render(slug){
  const t = bySlug[slug];
  if (!t) { renderWelcome(); return; }
  current = slug; vidIdx = 0;
  const c = catOf[slug];
  const zh = t.name_zh, enParts = [t.title_en];
  const a = t.accuracy || {};
  const accHtml = [accRow('Sensitivity 敏感度', a.sensitivity), accRow('Specificity 特異度', a.specificity), accRow('LR+', a.lr_plus), accRow('LR−', a.lr_minus)].join('');
  art.innerHTML = `
  <div class="player"><iframe id="yt" src="https://www.youtube-nocookie.com/embed/${t.youtube_ids[0]}?rel=0&modestbranding=1" title="${esc(t.title_en)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
  <div class="vids">${t.youtube_ids.length > 1 ? t.youtube_ids.map((v, i) => `<button data-v="${i}" class="${i === 0 ? 'on' : ''}">影片 ${i + 1}</button>`).join('') : ''}<a href="https://www.youtube.com/watch?v=${t.youtube_ids[0]}" target="_blank" rel="noopener">在 YouTube 開啟 ↗</a></div>
  <header class="head">
    <div class="eyebrow">${esc(c.en)} · ${esc(c.zh)}</div>
    <h2>${esc(zh)}<span class="en">${esc(enParts.join(' ') || t.title_en)}</span></h2>
    <div class="tags">${(t.tags || []).map(x => `<span>${esc(x)}</span>`).join('')}</div>
    <label class="doneRow"><input type="checkbox" id="doneBox" ${done.has(slug) ? 'checked' : ''}> 已看完此測試</label>
  </header>
  <section class="sec"><h3>目的<small>Purpose</small></h3><p>${esc(t.purpose_zh)}</p></section>
  <section class="sec"><h3>檢查結構<small>Structure</small></h3><p>${esc(t.structure_zh)}</p></section>
  <section class="sec"><h3>操作步驟<small>Procedure</small></h3><p>${esc(t.procedure_zh)}</p></section>
  <section class="sec positive"><h3>陽性判讀<small>Positive finding</small></h3><p>${esc(t.positive_zh)}</p></section>
  ${accHtml ? `<section class="sec"><h3>診斷準確度<small>Accuracy</small></h3><div class="acc">${accHtml}${a.source ? `<div class="src">來源 Source：${esc(a.source)}</div>` : ''}</div></section>` : ''}
  <section class="sec"><h3>臨床重點<small>Clinical notes</small></h3><p>${esc(t.notes_zh)}</p></section>
  <div class="foot"><span>原文頁面：<a href="${t.link}" target="_blank" rel="noopener">physiotutors.com ↗</a></span><span>影片版權屬 Physiotutors；本頁僅嵌入播放與整理筆記。</span></div>`;
  art.querySelectorAll('.vids button').forEach(b => b.addEventListener('click', () => {
    vidIdx = +b.dataset.v;
    document.getElementById('yt').src = `https://www.youtube-nocookie.com/embed/${t.youtube_ids[vidIdx]}?rel=0&modestbranding=1`;
    art.querySelectorAll('.vids button').forEach(x => x.classList.toggle('on', x === b));
  }));
  document.getElementById('doneBox').addEventListener('change', e => { e.target.checked ? done.add(slug) : done.delete(slug); saveDone(); refreshNav(); });
  document.getElementById('crumb').innerHTML = `${esc(DATA.region.en)} / ${esc(c.en)} / <b>${esc(t.title_en)}</b>`;
  const i = order.indexOf(slug);
  document.getElementById('prev').disabled = i <= 0;
  document.getElementById('next').disabled = i >= order.length - 1;
  document.getElementById('cat-' + c.id).open = true;
  refreshNav();
  document.getElementById('main').scrollTo({ top: 0 });
  document.body.classList.remove('nav-open');
  document.title = `${t.title_en} · Physio Exam Atlas`;
}
function renderWelcome(){
  current = null;
  art.innerHTML = `<div class="welcome"><h2>${esc(DATA.region.zh)}理學檢查影片地圖</h2>
  <p>${order.length} 支 Physiotutors 影片，依 ${CATS.length} 個主題排列。每支影片附繁中段落筆記（目的、操作、陽性判讀、診斷準確度、臨床重點），醫學名詞保留英文。觀看進度存在你的瀏覽器裡。</p>
  <div class="grid">${CATS.map((c, i) => `<button data-cat="${c.id}"><b>${esc(c.zh)}</b><small>${esc(c.en)}</small><i>${c.slugs.length} 支影片 · ${c.slugs.filter(s => done.has(s)).length} 已看</i></button>`).join('')}</div></div>`;
  art.querySelectorAll('button[data-cat]').forEach(b => b.addEventListener('click', () => { location.hash = CATS.find(c => c.id === b.dataset.cat).slugs[0]; }));
  document.getElementById('crumb').textContent = `${DATA.region.en} · 選擇左側測試開始`;
  document.getElementById('prev').disabled = true; document.getElementById('next').disabled = false;
  refreshNav();
}
document.getElementById('prev').addEventListener('click', () => { const i = order.indexOf(current); if (i > 0) location.hash = order[i - 1]; });
document.getElementById('next').addEventListener('click', () => { const i = order.indexOf(current); location.hash = order[i + 1] || order[0]; });
document.getElementById('menu').addEventListener('click', () => document.body.classList.toggle('nav-open'));
document.getElementById('scrim').addEventListener('click', () => document.body.classList.remove('nav-open'));
window.addEventListener('hashchange', () => render(location.hash.slice(1)));
render(location.hash.slice(1));
</script>
</body>
</html>
