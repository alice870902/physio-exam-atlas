<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hip · Physio Exam Atlas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left index (course → category → test), scrolling reading pane with player on top. */
:root{
  --bg:#f7f5f1; --panel:#ffffff; --fg:#1d1b17; --muted:#6b665c; --line:#e3ded4;
  --accent:#1f5f6b; --accent-ink:#ffffff; --accent-soft:#e3eff1; --mark:#c8731b;
  --done:#2f7d4f; --code:#f0ede6;
  --display:"Fraunces","Noto Sans TC",Georgia,serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --sidebar:300px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#15171a; --panel:#1d2024; --fg:#ebe7df; --muted:#a19b90; --line:#2d3137;
  --accent:#6fb9c6; --accent-ink:#0f1a1d; --accent-soft:#1d3237; --mark:#e49a4c;
  --done:#6cc68f; --code:#24282d; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#15171a; --panel:#1d2024; --fg:#ebe7df; --muted:#a19b90; --line:#2d3137;
  --accent:#6fb9c6; --accent-ink:#0f1a1d; --accent-soft:#1d3237; --mark:#e49a4c;
  --done:#6cc68f; --code:#24282d; color-scheme:dark; }

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.65;display:flex;overflow:hidden}
a{color:var(--accent)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
h1,h2,h3{text-wrap:balance;margin:0}

/* ---- sidebar ---- */
#side{width:var(--sidebar);flex:0 0 auto;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;height:100%;padding-left:env(safe-area-inset-left,0px)}
.brand{padding:18px 18px 12px;border-bottom:1px solid var(--line)}
.brand .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.brand h1{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.2;margin-top:4px}
.brand .sub{color:var(--muted);font-size:12.5px;margin-top:4px}
.search{padding:10px 14px;border-bottom:1px solid var(--line)}
.search input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit;font-size:14px}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px}
.progress{padding:8px 18px;font-family:var(--mono);font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.bar{height:4px;background:var(--line);border-radius:2px;flex:1;margin:0 10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--done);width:0}
nav{overflow-y:auto;flex:1;padding:6px 0 24px}
.cat>summary{list-style:none;cursor:pointer;padding:9px 18px;display:flex;align-items:baseline;gap:8px;user-select:none}
.cat>summary::-webkit-details-marker{display:none}
.cat>summary .n{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:1.6em}
.cat>summary .zh{font-weight:700}
.cat>summary .en{color:var(--muted);font-size:12px;margin-left:auto;text-align:right}
.cat>summary::before{content:"";width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);margin-right:2px;transition:transform .15s;flex:none;position:relative;top:-2px}
.cat[open]>summary::before{transform:rotate(45deg)}
.cat ul{list-style:none;margin:0;padding:0 0 6px}
.cat li a{display:flex;gap:8px;align-items:flex-start;padding:6px 18px 6px 34px;text-decoration:none;color:var(--fg);font-size:13.5px;line-height:1.4;border-left:3px solid transparent}
.cat li a:hover{background:var(--accent-soft)}
.cat li a.active{border-left-color:var(--accent);background:var(--accent-soft);font-weight:500}
.cat li a .tick{flex:none;width:14px;height:14px;border:1.5px solid var(--line);border-radius:50%;margin-top:4px}
.cat li a.done .tick{background:var(--done);border-color:var(--done)}
.cat li a .t{flex:1;min-width:0}
.cat li a .t small{display:block;color:var(--muted);font-size:11.5px}
.cat li[hidden]{display:none}
.cat.nomatch{display:none}

/* ---- main ---- */
#main{flex:1;min-width:0;height:100%;overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:18px}
#menu{display:none;padding:6px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px}
.crumb{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb b{color:var(--fg);font-weight:500}
.navbtns{margin-left:auto;display:flex;gap:6px}
.navbtns button{padding:6px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px;background:var(--panel)}
.navbtns button:disabled{opacity:.4;cursor:default}

article{max-width:860px}
.player{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.18)}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vids{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.vids button{font-family:var(--mono);font-size:11.5px;padding:3px 9px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
.vids button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.vids a{font-family:var(--mono);font-size:11.5px;margin-left:auto;align-self:center}

.head{margin:22px 0 14px}
.head .eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.head h2{font-family:var(--display);font-size:30px;font-weight:600;line-height:1.15;margin-top:6px}
.head h2 .en{display:block;font-family:var(--body);font-size:16px;font-weight:400;color:var(--muted);margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tags span{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--code);color:var(--muted)}
.doneRow{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13.5px}
.doneRow input{width:16px;height:16px;accent-color:var(--done)}

.sec{display:grid;grid-template-columns:150px 1fr;gap:10px 18px;padding:14px 0;border-top:1px solid var(--line)}
.sec h3{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.02em;padding-top:2px}
.sec h3 small{display:block;font-family:var(--mono);font-weight:400;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.sec p{margin:0;max-width:65ch}
.sec.positive p{border-left:3px solid var(--mark);padding-left:12px}
.acc{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.acc div{background:var(--code);border-radius:6px;padding:8px 10px}
.acc b{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.acc span{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.acc .src{grid-column:1/-1;background:none;padding:2px 0;font-size:12px;color:var(--muted)}
.foot{margin-top:18px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.welcome h2{font-family:var(--display);font-size:30px;margin-bottom:8px}
.welcome p{max-width:65ch;color:var(--muted)}
.welcome .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:18px}
.welcome .grid button{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.welcome .grid b{display:block}
.welcome .grid small{color:var(--muted);font-size:12px}
.welcome .grid i{display:block;font-family:var(--mono);font-size:11px;color:var(--accent);margin-top:6px;font-style:normal}

#scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:9}
@media (max-width:820px){
  #side{position:fixed;left:0;top:0;bottom:0;z-index:10;transform:translateX(-100%);transition:transform .2s;width:min(var(--sidebar),88vw);padding-top:env(safe-area-inset-top,0px)}
  body.nav-open #side{transform:none}
  body.nav-open #scrim{display:block}
  #menu{display:inline-block}
  .sec{grid-template-columns:1fr;gap:4px}
  .head h2{font-size:24px}
  .cat>summary .en{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>

eported", "source": "n/a"}, "title_zh": "髖關節主動活動度 Hip Active Range of Motion", "name_zh": "髖關節主動活動度", "purpose_zh": "評估病人靠自身肌力能移動髖關節 (hip joint) 的範圍，藉此找出症狀（疼痛的位置、性質、強度）、觀察關節活動是否順暢，並注意來自腰椎 (lumbar spine) 或骨盆 (pelvis) 的代償動作 (compensatory movements)。", "structure_zh": "髖關節的骨運動學 (osteokinematic) 動作：屈曲、伸直、外展、內收、內轉、外轉。原頁列出的參考值：屈曲 110–120°、伸直 10–15°、內收 30°、外展 30–50°、內轉 30–40°、外轉 40–60°。", "procedure_zh": "這是不碰觸病人的評估 (hands-off)，先做健側，並事先告知可能誘發症狀；同一姿勢下盡量做完所有動作再換姿勢。仰臥：屈曲＝膝蓋盡量靠近胸口；內收＝檢查者抬起一腿，病人把另一腿從下方交叉過去；外展＝腿盡量向外離開床面；內外轉＝髖屈曲約 90°，腳跟向外為內轉、腳跟向內為外轉。伸直＝病人把腿抬離床面。", "positive_zh": "非陽性／陰性型檢查：記錄疼痛（位置、性質、強度）、與參考值相比的活動範圍，以及代償動作。", "notes_zh": "與被動活動度 (passive range of motion, PROM) 頁面互為配套。原頁未列參考文獻。", "tags": ["活動度 ROM", "基礎評估 basic assessment"]}, {"slug": "hip-passive-range-of-motion", "title_en": "Hip Passive Range of Motion", "link": "https://www.physiotutors.com/wiki/hip-passive-range-of-motion/", "youtube_ids": ["g0Xg68ytaYQ"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a"}, "title_zh": "髖關節被動活動度 Hip Passive Range of Motion", "name_zh": "髖關節被動活動度", "purpose_zh": "以被動方式評估髖關節的骨運動學動作，量測角度；若活動受限，再評估末端感覺 (end-feel)。", "structure_zh": "髖關節；檢查時以髂前上棘 (anterior superior iliac spine, ASIS) 監測或在坐骨粗隆 (ischial tuberosity) 固定骨盆，以便在骨盆開始移動前察覺真正的末端。", "procedure_zh": "屈曲：仰臥，觸診同側 ASIS，握住股骨遠端屈曲直到骨盆開始移動。伸直：俯臥，以一手小魚際 (hypothenar) 固定坐骨粗隆，另一手將髖伸直。內轉／外轉：可在仰臥髖屈 90° 下測（前臂托住小腿、手掌罩住膝蓋以避免外翻力矩），或在髖中立位測（仰臥小腿垂出床緣，或俯臥並固定坐骨粗隆）。外展：仰臥，拇指放同側 ASIS，前臂托腿外展。內收：仰臥，非測試腳的腳放在測試腳膝蓋外側，拇指放對側 ASIS 監測骨盆，再內收。", "positive_zh": "非陽性／陰性型檢查：與參考值及對側比較活動範圍，並記錄受限時的末端感覺。", "notes_zh": "信度 (reliability)：依 Charlton 等人 (2015) 與 Prather 等人 (2010)，髖關節 PROM 的施測者內信度 (intra-tester) 為中等至極佳，施測者間信度 (inter-tester) 依動作不同從差到極佳。原頁寫「下表為被動活動度參考值」，但該表是圖片、API 文字中沒有，因此此處未列 PROM 參考值（原頁引用 McKay 2017、Soucie 2011）。", "tags": ["活動度 ROM", "末端感覺 end-feel", "基礎評估 basic assessment"]}, {"slug": "hip-resisted-isometric-testing", "title_en": "Hip Resisted Isometric Testing", "link": "https://www.physiotutors.com/wiki/hip-resisted-isometric-testing/", "youtube_ids": ["k12rDoTog4w"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a"}, "title_zh": "髖關節等長阻力測試 Hip Resisted Isometric Testing", "name_zh": "髖關節等長阻力測試", "purpose_zh": "快速了解髖部肌肉狀態與是否誘發疼痛；肌力可用 MRC 量表 (Medical Research Council scale) 分級，務必兩側都測。", "structure_zh": "髖關節周圍的肌肉肌腱組織 (musculotendinous tissues)；關節置於休息位／中立位，使惰性結構 (inert structures) 的應力最小。原頁提醒：臀大肌 (gluteus maximus) 是唯一同時參與伸直、內收、外轉三個動作的肌肉；股直肌 (rectus femoris) 與腿後肌群 (hamstrings) 為雙關節肌，因此也要測膝屈曲與伸直。", "procedure_zh": "先告知病人「我會給阻力，請不要讓我移動你」，每個阻力至少維持 5 秒，肢體不可移動。屈曲：髖屈約 60°，托住小腿，往伸直方向給阻力。伸直：髖屈約 30°，往屈曲方向給阻力。內收／外展：抬起腿，一手在膝上、一手在膝下，請病人向內夾或向外推。內轉／外轉：髖屈 90°，請病人把腳踝向外（內轉）或向內（外轉）推。膝屈曲：髖屈約 30°，手放在踝關節近端。膝伸直：前臂托在腿下並靠在對側腿上，另一手放踝近端，請病人伸膝。", "positive_zh": "阻力動作中出現疼痛及／或無力，依產生該動作的肌群判讀（例如伸直、內收、外轉三者都痛，指向臀大肌）。", "notes_zh": "與主動活動度 (AROM)、被動活動度 (PROM) 同屬基礎髖關節評估。原頁未列參考文獻。", "tags": ["肌力 strength", "基礎評估 basic assessment"]}, {"slug": "single-leg-stance-assessment", "title_en": "Single-Leg Stance Assessment", "link": "https://www.physiotutors.com/wiki/single-leg-stance-assessment/", "youtube_ids": ["cmFExKxV0dE", "A9pi7_JRgwQ"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a"}, "title_zh": "單腳站立觀察評估 Single-Leg Stance Assessment", "name_zh": "單腳站立觀察評估", "purpose_zh": "以觀察方式評估單腳站立時的靜態姿勢控制 (static postural control) 與穩定策略；不只用於老年人跌倒風險，因為步態週期約 40% 處於單腳支撐，上下樓梯也依賴它。", "structure_zh": "整個動力鏈：足踝穩定度、膝關節排列（髕骨是否對齊足背、膝內塌、脛骨扭轉 (tibial torsion)）、臀大肌 (gluteus maximus)、臀中肌 (gluteus medius)、對側腰方肌 (quadratus lumborum)、胸廓與呼吸（核心）、頭與眼睛的位置。", "procedure_zh": "從病人脫鞋襪、從坐姿站起就開始觀察，站立時注意體重分布。請病人眼睛直視前方、雙手放身側，單腳站立，不指定哪一腳、也不指定抬多高。觀察呼吸與胸廓、腳趾抓地或變白、足部在內翻／外翻間尋找穩定、Trendelenburg 徵象、膝內塌、眼睛移動。最後閉眼重做一次。", "positive_zh": "屬觀察所見而非二元結果：原頁以閉眼維持良好姿勢 20 秒、睜眼 40 秒為可接受範圍。Trendelenburg 徵象提示站立腳臀中肌無力或對側腰方肌抑制；腳趾抓地／足部尋找穩定提示足部不穩或臀大肌抑制；膝外翻／脛骨扭轉可能提示臀大肌無力。", "notes_zh": "本頁有兩支影片。唯一參考來源是 Dynamic Chiropractic 網路文章；其中的判讀（例如頸部外傷後常見的眼肌促進 (eye muscle facilitation)）是原頁的臨床推理，並非引用研究。", "tags": ["姿勢控制 postural control", "觀察 observation", "基礎評估 basic assessment"]}, {"slug": "hip-osteoarthritis-diagnosis", "title_en": "Hip Osteoarthritis Diagnosis", "link": "https://www.physiotutors.com/wiki/hip-osteoarthritis-diagnosis/", "youtube_ids": ["MpMFvF4XHSs"], "accuracy": {"sensitivity": "86%", "specificity": "75%", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Altman et al. 1991 (page rates clinical value as moderate)"}, "title_zh": "髖關節退化性關節炎臨床診斷 Hip Osteoarthritis Diagnosis", "name_zh": "髖關節退化性關節炎臨床診斷", "purpose_zh": "以 Altman 等人 (1991) 的美國風濕病學會 (American College of Rheumatology, ACR) 臨床分類準則診斷髖關節退化性關節炎 (osteoarthritis, OA)，不依賴影像。", "structure_zh": "髖關節。過去診斷多依 Kellgren-Lawrence 放射學分級，但影像與疼痛、功能受限的相關性不如想像中強；中樞敏感化 (central sensitization) 與心理社會因素 (psychosocial factors) 可能左右誰會痛。", "procedure_zh": "髖部疼痛，加上以下任一組：(a) 髖內轉活動度 < 15° 且髖屈曲 ≤ 115°；或 (b) 髖內轉 ≥ 15°、內轉時疼痛、晨僵 (morning stiffness) < 60 分鐘、年齡 > 50 歲。", "positive_zh": "符合上述準則。晨僵 < 60 分鐘有助於與類風濕性關節炎 (rheumatoid arthritis) 區分（後者通常更久）；盛行率隨年齡上升，高峰約 78–79 歲。", "notes_zh": "Kim 等人 (2015) 在兩個大型世代中發現，影像上有髖 OA 的髖關節只有 20% 經常疼痛，支持以負荷管理、肌力訓練、活動度運動與衛教為治療方向。原頁列出的相關檢查：Patrick's / FABER 測試、Trendelenburg 徵象、Sutlive 組合 (Cluster of Sutlive)。", "tags": ["退化性關節炎 OA", "ACR 準則 criteria", "診斷 diagnosis"]}, {"slug": "groin-pain-classification", "title_en": "Groin Pain Classification", "link": "https://www.physiotutors.com/wiki/groin-pain-classification/", "youtube_ids": ["pDaTliU76dE"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a (Hölmich 2004 reliability study is cited but no values given on the page)"}, "title_zh": "運動員鼠蹊痛分類（杜哈共識） Groin Pain Classification", "name_zh": "運動員鼠蹊痛分類（杜哈共識）", "purpose_zh": "依杜哈共識 (Doha agreement, Weir 等人 2015) 將運動員的鼠蹊痛 (groin pain) 分為定義明確的臨床實體、髖關節相關鼠蹊痛，以及其他原因。", "structure_zh": "內收肌群 (adductors)、髂腰肌 (iliopsoas)、腹股溝管 (inguinal canal)、恥骨聯合 (pubic symphysis) 與鄰近骨頭、髖關節。原頁流行病學：男子俱樂部足球中鼠蹊傷害占所有傷害 4–19%，女子 2–14%。", "procedure_zh": "病史：患部疼痛且運動時加劇。接著對該肌群做觸診、阻力測試與伸展。內收肌相關：阻力內收時內收肌疼痛加上內收肌壓痛。髂腰肌相關：阻力髖屈與髖屈肌伸展時疼痛（髂腰肌本身幾乎無法觸診）。腹股溝相關：腹股溝管區域疼痛與壓痛、無可觸及的疝氣，腹肌阻力測試或 Valsalva／咳嗽／打噴嚏時加劇。恥骨相關：恥骨聯合及緊鄰骨頭的局部壓痛。髖關節相關：病史或理學檢查有疑慮時一律考慮髖關節（股髖夾擠 (femoroacetabular impingement, FAI)、盂唇撕裂 (labral tear)）。其他：骨科、神經、風濕、泌尿、腸胃、皮膚、腫瘤、外科原因。", "positive_zh": "歸入某一實體的前提是阻力測試的疼痛要出現在該結構本身（例如阻力內收時痛在腹股溝區，不算內收肌相關）。", "notes_zh": "原頁引用 Hölmich 2004 的信度研究但未給數值。哥本哈根內收運動 (Copenhagen adduction exercise) 被列為內收肌相關鼠蹊痛的有效預防工具。原頁提到的「其他原因一覽表」不在 API 文字中。", "tags": ["鼠蹊痛 groin pain", "杜哈共識 Doha agreement", "分類 classification"]}, {"slug": "faddir-test", "title_en": "FADDIR Test", "link": "https://www.physiotutors.com/wiki/faddir-test/", "youtube_ids": ["xyJUIhsL4lg"], "accuracy": {"sensitivity": "99% (pooled)", "specificity": "5% (pooled)", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Reiman et al. 2015 systematic review/meta-analysis (moderate-quality studies)"}, "title_zh": "FADDIR 測試 FADDIR Test", "name_zh": "FADDIR 測試", "purpose_zh": "股髖夾擠症候群 (femoroacetabular impingement, FAI) 與髖臼盂唇 (acetabular labrum) 撕裂的篩檢測試。", "structure_zh": "髖關節：凸輪型 (CAM) 形態為股骨頸的骨性突起，鉗夾型 (pincer) 形態為髖臼後傾 (retroversion) 或盂唇過度突出，最常見的是兩者合併；髖臼盂唇。", "procedure_zh": "病人仰臥。檢查者將髖屈曲至 90°、內收，再加上內轉（Flexion-ADDuction-Internal Rotation）。", "positive_zh": "重現病人熟悉的髖部／鼠蹊疼痛。", "notes_zh": "Reiman 等人 (2015) 系統性回顧的合併敏感度 99%、特異度 5%，因此只適合用來排除 (exclusion screening)，陽性無法診斷 FAI；納入研究品質中等。FAI 形態常是無症狀的發現，即使在運動員也是，但與退化性關節炎 (osteoarthritis) 風險上升有關。原頁列的相關檢查：Thomas 測試、前／後盂唇撕裂測試、McCarthy 測試、足部前進角步行測試 (foot progression angle walking test)。", "tags": ["股髖夾擠 FAI", "盂唇 labrum", "排除用 rule-out"]}, {"slug": "patricks-test", "title_en": "Patrick's Test", "link": "https://www.physiotutors.com/wiki/patricks-test/", "youtube_ids": ["89Qiht82zmg"], "accuracy": {"sensitivity": "50% (for SIJ pain)", "specificity": "56% (for SIJ pain)", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Schneider et al. 2020 (SIJ); reliability: intra-rater ICC 0.93 Ross et al. 2003, inter-rater kappa 0.47 Sutlive et al. 2008"}, "title_zh": "Patrick's 測試（FABER／四字測試） Patrick's Test", "name_zh": "Patrick's 測試（FABER／四字測試）", "purpose_zh": "評估髖關節水平內收 (horizontal adduction) 方向的活動受限（髖退化性關節炎常見），也可作為髖關節或薦髂關節 (sacroiliac joint, SIJ) 的疼痛誘發測試。", "structure_zh": "髖關節（屈曲-外展-外轉 Flexion-ABduction-External Rotation 位置）與薦髂關節；SIJ 疼痛通常出現在 Fortin 區／SIJ 後關節線，髖關節疼痛則在鼠蹊。", "procedure_zh": "病人仰臥，檢查者站患側。病人屈曲同側膝蓋，把腳跟內側靠在對側膝上。檢查者固定對側髂前上棘 (ASIS)，病人盡量把同側膝蓋往床面放下，腳底保持貼在對側膝上。最後檢查者在同側膝施加 15 公斤的加壓 (overpressure) 持續 5 秒。", "positive_zh": "重現病人熟悉的疼痛（SIJ：Fortin 區／後關節線；髖：鼠蹊）。", "notes_zh": "信度：Ross 等人 (2003) 施測者內 ICC 0.93（良好）；Sutlive 等人 (2008) 作為髖關節誘發測試的施測者間 kappa 僅 0.47，原頁因此認為作為誘發測試臨床價值弱。SIJ 診斷：Schneider 等人 (2020) 敏感度 50%、特異度 56%，臨床價值同樣弱。另為 Sutlive 組合 (Cluster of Sutlive) 的一部分；Ely's 測試頁面把它列為內收長肌 (adductor longus) 長度測試。", "tags": ["退化性關節炎 OA", "薦髂關節 SIJ", "FABER"]}, {"slug": "external-rotation-stinchfield-test", "title_en": "External Rotation Stinchfield Test", "link": "https://www.physiotutors.com/wiki/external-rotation-stinchfield-test/", "youtube_ids": ["x8jQm3rRKCo"], "accuracy": {"sensitivity": "15%", "specificity": "60%", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Kurowicki et al. 2020 diagnostic cohort (one of 3 proposed tests)"}, "title_zh": "外轉 Stinchfield 測試 External Rotation Stinchfield Test", "name_zh": "外轉 Stinchfield 測試", "purpose_zh": "評估核心肌群損傷 (core muscle injury, CMI)，即運動性恥骨痛 (athletic pubalgia)、俗稱「運動疝氣」(sports hernia)，在杜哈分類中屬恥骨相關鼠蹊痛。", "structure_zh": "腹壁弱化或撕裂但無真正疝氣，合併內收長肌 (adductor longus) 與腹直肌 (rectus abdominis) 在恥骨附著處的損傷。", "procedure_zh": "病人仰臥，患側腿完全伸直並置於外轉位。病人對抗檢查者的阻力把腿抬離床面。", "positive_zh": "恥骨或鼠蹊疼痛。", "notes_zh": "Kurowicki 等人 (2020) 的診斷世代研究中（三項建議測試之一），單獨使用敏感度 15%、特異度 60%，概似比 (likelihood ratio) 差，臨床價值弱，應與直腿仰臥起坐測試 (straight leg sit-up test)、阻力交叉仰臥起坐測試 (resisted cross-body sit-up test) 組成 cluster，並結合病史與診斷性超音波。須與 FAI、腰椎轉移痛、SIJ 疼痛鑑別。", "tags": ["核心肌群損傷 core muscle injury", "鼠蹊痛 groin pain", "cluster"]}, {"slug": "anterior-labral-tear-test", "title_en": "Anterior Labral Tear Test", "link": "https://www.physiotutors.com/wiki/anterior-labral-tear-test/", "youtube_ids": ["wmK_PhkUbaM"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a: page states no diagnostic studies have evaluated reliability or validity"}, "title_zh": "前盂唇撕裂測試 Anterior Labral Tear Test", "name_zh": "前盂唇撕裂測試", "purpose_zh": "評估髖關節前上夾擠 (anterior superior impingement)、前盂唇 (anterior labrum) 撕裂與髂腰肌肌腱炎 (iliopsoas tendonitis)。", "structure_zh": "髖臼前上盂唇；髂腰肌肌腱。", "procedure_zh": "將病人的髖帶到屈曲、外轉、外展，再緩慢移向內轉、內收、伸直。", "positive_zh": "重現病人的症狀（伴或不伴彈響 click），或出現疼痛。", "notes_zh": "原頁明言沒有任何診斷研究評估過本測試的信度或效度，臨床價值未知。原頁未列參考文獻。", "tags": ["盂唇 labrum", "股髖夾擠 FAI", "效度未知 unvalidated"]}, {"slug": "posterior-labral-tear-test", "title_en": "Posterior Labral Tear Test", "link": "https://www.physiotutors.com/wiki/posterior-labral-tear-test/", "youtube_ids": ["TWhJpSt1lZg"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a: page states no diagnostic studies have evaluated reliability or validity"}, "title_zh": "後盂唇撕裂測試 Posterior Labral Tear Test", "name_zh": "後盂唇撕裂測試", "purpose_zh": "評估髖關節後下夾擠 (posteroinferior impingement)、後盂唇 (posterior labrum) 撕裂與前側髖不穩定 (anterior hip instability)。", "structure_zh": "髖臼後盂唇；前關節囊（不穩定）。", "procedure_zh": "病人仰臥、脊椎中立。檢查者將髖帶到最大屈曲、內收、內轉，再緩慢移向外展、外轉、伸直。", "positive_zh": "重現病人熟悉的鼠蹊疼痛（伴或不伴彈響 click）。", "notes_zh": "原頁明言沒有任何診斷研究評估過本測試的信度或效度，臨床價值未知。原頁未列參考文獻。", "tags": ["盂唇 labrum", "髖不穩定 instability", "效度未知 unvalidated"]}, {"slug": "hip-prone-instability-test", "title_en": "Hip Prone Instability Test", "link": "https://www.physiotutors.com/wiki/hip-prone-instability-test/", "youtube_ids": ["qKVDzTqqUvM"], "accuracy": {"sensitivity": "33.9%", "specificity": "97.9%", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Hoppe et al. 2017 (first validity study, with limitations; page rates moderate clinical value)"}, "title_zh": "髖關節俯臥不穩定測試 Hip Prone Instability Test", "name_zh": "髖關節俯臥不穩定測試", "purpose_zh": "評估髖關節微不穩定 (hip microinstability)，這是年輕病人中相對新的臨床實體。", "structure_zh": "髖關節穩定結構：髖臼、盂唇 (labrum)、圓韌帶 (ligamentum teres)、關節囊韌帶複合體 (capsuloligamentous complex) 與周圍肌肉。推測機轉為在上述結構有解剖異常的情況下反覆承受軸向及／或旋轉負荷；創傷性與非創傷性起病皆有描述。", "procedure_zh": "病人俯臥，檢查者站健側。將患側膝屈曲 90° 當作槓桿，另一手放在大轉子 (greater trochanter) 後側；在把腿外轉的同時，對大轉子施加向下（向前）的力。", "positive_zh": "重現前側髖部疼痛。", "notes_zh": "Hoppe 等人 (2017)：敏感度 33.9%、特異度 97.9%；這是第一篇效度研究且有若干限制，原頁給中等臨床價值，建議等待進一步驗證前審慎使用。應合併病史與 Beighton 評分 (Beighton score) 評估關節過動。相關檢查：AB-HEER 測試、HEER 測試、足部前進角步行 (foot progression walking angle)。", "tags": ["微不穩定 microinstability", "Beighton 評分", "確認用 rule-in"]}, {"slug": "thomas-test", "title_en": "Thomas Test", "link": "https://www.physiotutors.com/wiki/thomas-test/", "youtube_ids": ["NMDd-4NspHs"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "11.1 (for variable hip pathologies such as FAI)", "lr_minus": "0.12 (for variable hip pathologies such as FAI)", "source": "McCarthy et al. 1995; reliability reference Peeler & Anderson 2007"}, "title_zh": "Thomas 測試 Thomas Test", "name_zh": "Thomas 測試", "purpose_zh": "髂腰肌 (iliopsoas) 縮短的肌肉長度測試；文獻中也用於測試股髖夾擠症候群 (femoroacetabular impingement, FAI)。", "structure_zh": "髂腰肌（髖屈肌）；若出現 J 字徵象 (J-sign) 則牽涉髂脛束 (iliotibial tract)。", "procedure_zh": "病人仰臥。病人把非測試側的腿抱向胸口，直到腰椎前凸變平，測試側的腿則維持伸直放在床上。", "positive_zh": "伸直的腿抬離床面，且病人感到鼠蹊部被拉緊。若伸直腿出現內收（J 字徵象），可能表示髂脛束縮短。", "notes_zh": "McCarthy 等人 (1995) 對各種髖關節病變（如 FAI）得到陽性概似比 (LR+) 11.1、陰性概似比 (LR−) 0.12；但無症狀的 FAI 很常見，所以此測試只算中等有用。此外髂腰肌縮短無論用目視或量角器都無法可靠偵測（信度參考 Peeler & Anderson 2007）。原頁列的其他長度測試：Ober's、Ely's、Kendall、90-90 直膝抬腿、Backsaver 坐姿體前彎、三腳架徵象、Phelps。", "tags": ["髂腰肌 iliopsoas", "肌肉長度 muscle length", "股髖夾擠 FAI"]}, {"slug": "obers-test", "title_en": "Ober's Test", "link": "https://www.physiotutors.com/wiki/obers-test/", "youtube_ids": ["Amjv6FzDeLE"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a (Willett et al. 2016 anatomic study questions validity)"}, "title_zh": "Ober's 測試 Ober's Test", "name_zh": "Ober's 測試", "purpose_zh": "評估闊筋膜張肌 (tensor fasciae latae) 與髂脛束 (iliotibial band, ITB) 的緊繃。", "structure_zh": "闊筋膜張肌與髂脛束；但依 Willett 等人 (2016) 的解剖研究，測試結果其實受臀中肌 (gluteus medius)、臀小肌 (gluteus minimus) 與髖關節囊影響。", "procedure_zh": "病人側臥，下方腿的髖與膝屈曲以求穩定。檢查者一手固定骨盆，另一手被動外展上方腿並帶到些微伸直，再慢慢把腿往床面放下。文獻原始描述是膝屈 90°，Physiotutors 偏好上方腿完全伸直以增加髂脛束的張力。", "positive_zh": "上方腿停在空中、無法落到床面。", "notes_zh": "Willett 等人 (2016) 反駁「ITB 在兩種版本的 Ober 測試中限制髖內收」的假說，質疑它作為 ITB 緊繃測試的效度，並強調臀中肌、臀小肌與髖關節囊的影響，判讀時要小心。原頁未列診斷準確度數值。", "tags": ["髂脛束 ITB", "闊筋膜張肌 TFL", "肌肉長度 muscle length"]}, {"slug": "elys-test", "title_en": "Ely's Test", "link": "https://www.physiotutors.com/wiki/elys-test/", "youtube_ids": ["0FgacndWb4Q"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Reliability only: Peeler & Anderson 2008, positive/negative scoring intra-rater kappa 0.52, inter-rater kappa 0.46 (moderate); with goniometer intra-rater ICC 0.69, inter-rater ICC 0.66"}, "title_zh": "Ely's 測試 Ely's Test", "name_zh": "Ely's 測試", "purpose_zh": "評估股直肌 (rectus femoris) 柔軟度或攣縮 (contracture) 的肌肉長度測試。", "structure_zh": "股直肌：起自髂前下棘 (anterior inferior iliac spine, AIIS)、止於脛骨粗隆，跨越髖與膝兩個關節。", "procedure_zh": "病人俯臥。檢查者被動將病人的膝蓋屈曲到最大。", "positive_zh": "膝蓋屈到底時病人自發性地髖屈曲（臀部抬起）以代償縮短的股直肌，或測試中出現疼痛。", "notes_zh": "信度（Peeler & Anderson 2008）：以陽性／陰性計分時施測者內 kappa 0.52、施測者間 kappa 0.46（中等）；改用量角器時施測者內 ICC 0.69、施測者間 ICC 0.66，略好。原頁列的其他長度測試：Thomas（髂腰肌）、Kendall（股直肌）、90-90 直膝抬腿（腿後肌群）、Phelps（股薄肌）、Ober's（闊筋膜張肌／髂脛束）、梨狀肌測試、Patrick's（內收長肌）。", "tags": ["股直肌 rectus femoris", "肌肉長度 muscle length", "信度 reliability"]}, {"slug": "90-90-straight-leg-raise-test", "title_en": "90-90 Straight Leg Raise Test", "link": "https://www.physiotutors.com/wiki/90-90-straight-leg-raise-test/", "youtube_ids": ["meM4S1vrbpk"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Reliability only: Neto et al. 2015, intra-rater ICC 0.91 (excellent), smallest detectable difference 7-8°"}, "title_zh": "90-90 直膝抬腿測試 90-90 Straight Leg Raise Test", "name_zh": "90-90 直膝抬腿測試", "purpose_zh": "評估腿後肌群 (hamstrings) 長度與是否有腿後肌攣縮；又稱主動伸膝測試 (Active Knee Extension Test, AKET)。", "structure_zh": "腿後肌群。", "procedure_zh": "病人仰臥，髖與膝各屈曲 90°、腰椎維持中立，雙手抱住大腿後側穩定姿勢。接著病人主動伸直測試側的膝蓋，過程中腰椎保持中立。", "positive_zh": "原頁未明寫陽性判準；結果為膝伸直不足的角度（距完全伸直幾度），並與對側比較。", "notes_zh": "Neto 等人 (2015)：施測者內 ICC 0.91（極佳），最小可偵測差異 (smallest detectable difference) 7–8°。原頁列的其他腿後肌長度測試：Backsaver 坐姿體前彎、三腳架徵象 (tripod sign)。", "tags": ["腿後肌群 hamstrings", "肌肉長度 muscle length", "AKET"]}, {"slug": "tripod-sign", "title_en": "Tripod Sign", "link": "https://www.physiotutors.com/wiki/tripod-sign/", "youtube_ids": ["mRab9U81HSU"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a (reference: Magee 2014 textbook)"}, "title_zh": "三腳架徵象 Tripod Sign", "name_zh": "三腳架徵象", "purpose_zh": "快速評估腿後肌群 (hamstrings) 長度。", "structure_zh": "腿後肌群；須與神經根 (nerve root) 問題鑑別。", "procedure_zh": "病人坐在床緣，膝屈 90°。檢查者被動伸直一側膝蓋，放回後換另一側，兩側比較。", "positive_zh": "膝完全伸直時病人必須身體後仰以減輕腿後肌張力。若病人抱怨的是整條腿往下竄的電擊樣痛而非腿後肌緊繃，應考慮神經根問題，而非本測試陽性。", "notes_zh": "參考來源為 Magee (2014) 教科書，無診斷準確度數值。原頁列的其他長度測試：Ober's（闊筋膜張肌）、Ely's（股直肌）、Phelps（股薄肌）、90-90 直膝抬腿、Kendall、Backsaver 坐姿體前彎、Thomas。", "tags": ["腿後肌群 hamstrings", "肌肉長度 muscle length", "神經根鑑別 nerve root"]}, {"slug": "phelps-test", "title_en": "Phelps Test", "link": "https://www.physiotutors.com/wiki/phelps-test/", "youtube_ids": ["NDsPj1qATiU"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a (reference: Magee 2014 textbook)"}, "title_zh": "Phelps 測試 Phelps Test", "name_zh": "Phelps 測試", "purpose_zh": "評估股薄肌 (gracilis) 長度，可提示股薄肌攣縮或縮短。", "structure_zh": "股薄肌：內收肌群中唯一的雙關節肌（跨越髖與膝），本測試即利用這個特性。", "procedure_zh": "病人俯臥、雙膝伸直。檢查者被動把雙腿外展到最大，接著請病人屈膝 90°，再嘗試進一步被動外展。", "positive_zh": "屈膝 90° 後外展角度增加：屈膝讓股薄肌鬆弛，若它是限制因子，外展就會變多。", "notes_zh": "參考來源為 Magee (2014) 教科書，無診斷準確度數值。原頁列的其他長度測試：Ober's、Ely's、Kendall、90-90 直膝抬腿、Backsaver 坐姿體前彎、三腳架徵象、Thomas。", "tags": ["股薄肌 gracilis", "內收肌群 adductors", "肌肉長度 muscle length"]}, {"slug": "trendelenburg-sign", "title_en": "Trendelenburg Sign", "link": "https://www.physiotutors.com/wiki/trendelenburg-sign/", "youtube_ids": ["0rcczDEWDqU"], "accuracy": {"sensitivity": "55% (for hip OA)", "specificity": "70% (for hip OA)", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Youdas et al. 2010"}, "title_zh": "Trendelenburg 徵象 Trendelenburg Sign", "name_zh": "Trendelenburg 徵象", "purpose_zh": "偵測站立腳的髖外展肌（臀中肌 gluteus medius、臀小肌 gluteus minimus）無力，髖退化性關節炎 (osteoarthritis, OA) 常見；也被評估過作為髖 OA 的診斷測試。", "structure_zh": "站立腳的臀中肌與臀小肌；骨盆／髂嵴 (iliac crest) 高度。", "procedure_zh": "病人站立（可扶牆保持平衡），把一側髖屈曲到 90°。檢查者比較兩側髂嵴高度：正常時抬腿側的髂嵴應高於站立側。", "positive_zh": "抬腿側髂嵴掉到比站立側低，或病人以軀幹向站立腳側傾斜來代償，表示站立腳外展肌無力。部分作者以站立腳的股骨角 (femoral angle) ≤ 83° 並維持 30 秒作為陽性定義。", "notes_zh": "Youdas 等人 (2010) 用於診斷髖 OA：敏感度 55%、特異度 70%，作者結論是不適合用來辨識早期髖 OA。原頁列的其他髖 OA 檢查：Patrick's / FABER 測試、Sutlive 組合 (Cluster of Sutlive)、髖 OA 徵象與症狀。", "tags": ["臀中肌 gluteus medius", "外展肌無力 abductor weakness", "退化性關節炎 OA"]}, {"slug": "single-leg-stance-test", "title_en": "Single Leg Stance Test", "link": "https://www.physiotutors.com/wiki/single-leg-stance-test/", "youtube_ids": ["3vdJhti9tZE"], "accuracy": {"sensitivity": "38% (Grimaldi, vs MRI); 100% (Lequesne 2008)", "specificity": "100% (Grimaldi, vs MRI); 97.3% (Lequesne 2008)", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Grimaldi et al. (cited as 2016 in text, reference list says 2017, BJSM); Lequesne et al. 2008"}, "title_zh": "單腳站立測試（臀肌肌腱病變） Single Leg Stance Test", "name_zh": "單腳站立測試（臀肌肌腱病變）", "purpose_zh": "診斷臀肌肌腱病變 (gluteal tendinopathy)，屬於現今統稱大轉子疼痛症候群 (greater trochanteric pain syndrome, GTPS) 的一部分，是外側髖痛的鑑別診斷之一。", "structure_zh": "臀中肌／臀小肌在大轉子 (greater trochanter) 的肌腱。", "procedure_zh": "病人站在牆邊，患側腿離牆較遠，健側手以一根手指在肩高處扶牆平衡。病人屈膝 90° 抬起健側腳，健側髖維持中立，姿勢維持最多 30 秒。", "positive_zh": "30 秒內重現病人大轉子區域的外側髖痛，數字疼痛量表 (NPRS) 至少 2/10。", "notes_zh": "Grimaldi 等人（內文寫 2016，參考文獻為 2017，BJSM）以 MRI 為對照：敏感度 38%、特異度 100%，是該研究中最特異的測試；Lequesne 等人 (2008) 在有症狀與無症狀者中得到敏感度 100%、特異度 97.3%。Grimaldi 的情境（只有有症狀病人）較貼近臨床：陽性幾乎可確立臀肌肌腱病變，陰性無法排除，原頁因此給「納入」(rule-in) 的強臨床價值。其他 GTPS 檢查：阻力外側去旋轉測試 (resisted external derotation test)、大轉子觸診、FADER / FADER-R、ADD / ADD-R（改良 Ober's）。", "tags": ["臀肌肌腱病變 gluteal tendinopathy", "大轉子疼痛症候群 GTPS", "確認用 rule-in"]}, {"slug": "piriformis-test", "title_en": "Piriformis Test", "link": "https://www.physiotutors.com/wiki/piriformis-test/", "youtube_ids": ["zha5jIv4_44"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a"}, "title_zh": "梨狀肌測試 Piriformis Test", "name_zh": "梨狀肌測試", "purpose_zh": "評估梨狀肌 (piriformis) 緊繃或梨狀肌症候群 (piriformis syndrome)，後者現在稱為深臀症候群 (deep gluteal syndrome, DGS)。", "structure_zh": "梨狀肌與臀下間隙 (subgluteal space) 內的坐骨神經 (sciatic nerve)；約 15% 的人坐骨神經穿過梨狀肌而非從其下方通過。DGS 定義為坐骨神經在臀下間隙受到非椎間盤源性 (non-discogenic) 卡壓所致的臀部疼痛；可能的卡壓結構除梨狀肌外，還有含血管的纖維帶、臀肌、腿後肌群、孖肌-閉孔內肌複合體 (gemelli-obturator internus complex)、血管異常與占位性病灶。", "procedure_zh": "病人側臥於床緣。將上方腿帶到髖屈 60°、膝屈曲，下方腿完全伸直。一手固定骨盆，另一手在膝蓋處向下施壓。", "positive_zh": "臀部疼痛，或沿腿後側放射的疼痛。", "notes_zh": "原頁描述的 DGS 典型症狀：類坐骨神經痛、多為單側的髖／臀痛與大轉子後方壓痛，髖屈曲下旋轉加上伸膝時加劇；無法久坐超過 20–30 分鐘、跛行、患肢感覺異常或喪失、夜間痛白天改善。原頁未列診斷準確度與參考文獻。其他 DGS 檢查：腳跟對側膝 (HCLK) 手法、Pace 手法、Freiberg 徵象、FAIR 測試、Beatty 手法、坐姿梨狀肌伸展測試、主動梨狀肌測試。", "tags": ["梨狀肌 piriformis", "深臀症候群 DGS", "坐骨神經 sciatic nerve"]}, {"slug": "active-piriformis-test", "title_en": "Active Piriformis Test", "link": "https://www.physiotutors.com/wiki/active-piriformis-test/", "youtube_ids": ["qZzjXIXZL88"], "accuracy": {"sensitivity": "78%", "specificity": "80%", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Martin et al. (cited as 2013 in text; reference list says 2014, KSSTA), endoscopically confirmed entrapment"}, "title_zh": "主動梨狀肌測試 Active Piriformis Test", "name_zh": "主動梨狀肌測試", "purpose_zh": "診斷臀部區域的坐骨神經 (sciatic nerve) 卡壓，即深臀症候群 (deep gluteal syndrome, DGS)。", "structure_zh": "梨狀肌（起自 S2–S4、止於大轉子）與臀下間隙內的坐骨神經。", "procedure_zh": "先排除更常見的腰椎與薦髂關節 (SIJ) 病變。病人側臥、健側在下，患側屈膝並把腳放在床上。檢查者觸診梨狀肌，另一手在屈曲的膝蓋給阻力，請病人把腳跟往床面踩，做出主動髖外展加外轉。", "positive_zh": "重現病人熟悉的臀部疼痛及／或向下肢後側放射的感覺異常 (paraesthesia)。", "notes_zh": "Martin 等人（內文寫 2013，參考文獻為 2014，KSSTA）以內視鏡確認的坐骨神經卡壓為對照：敏感度 78%、特異度 80%；目前唯一的研究，原頁給中等臨床價值，可用於納入與排除。其他 DGS 檢查：Freiberg 徵象、FAIR 測試、坐姿梨狀肌伸展測試、HCLK 手法、梨狀肌測試、Beatty 手法、Pace 手法。", "tags": ["梨狀肌 piriformis", "深臀症候群 DGS", "坐骨神經卡壓 entrapment"]}, {"slug": "seated-piriformis-stretch-test", "title_en": "Seated Piriformis Stretch Test", "link": "https://www.physiotutors.com/wiki/seated-piriformis-stretch-test/", "youtube_ids": ["Q__4bTuma4A"], "accuracy": {"sensitivity": "52%", "specificity": "90%", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Martin et al. (cited as 2013 in text; reference list says 2014, KSSTA), endoscopically confirmed entrapment"}, "title_zh": "坐姿梨狀肌伸展測試 Seated Piriformis Stretch Test", "name_zh": "坐姿梨狀肌伸展測試", "purpose_zh": "藉由拉長髖深層旋轉肌並對坐骨神經 (sciatic nerve) 施加硬膜張力，診斷臀部區域的坐骨神經卡壓（深臀症候群 deep gluteal syndrome）。", "structure_zh": "髖深層外轉肌（梨狀肌 piriformis）與坐骨切跡 (sciatic notch) 處的坐骨神經。", "procedure_zh": "先排除更常見的腰椎與薦髂關節 (SIJ) 病變。病人坐在床緣，髖屈約 90°、膝伸直。檢查者一邊觸診坐骨切跡，一邊將下肢內收並內轉。", "positive_zh": "重現病人熟悉的臀部疼痛及／或向下肢後側放射的感覺異常 (paraesthesia)。", "notes_zh": "Martin 等人（內文寫 2013，參考文獻為 2014，KSSTA）以內視鏡確認的卡壓為對照：敏感度 52%、特異度 90%；目前唯一的研究，原頁給中等臨床價值，適合用來確認 (rule-in)。其他 DGS 檢查：HCLK 手法、Pace 手法、Freiberg 徵象、FAIR 測試、梨狀肌測試、Beatty 手法、主動梨狀肌測試。", "tags": ["梨狀肌 piriformis", "深臀症候群 DGS", "確認用 rule-in"]}, {"slug": "fair-test", "title_en": "FAIR Test", "link": "https://www.physiotutors.com/wiki/fair-test/", "youtube_ids": ["QvsNjFYYrN0"], "accuracy": {"sensitivity": "88%", "specificity": "83%", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Fishman et al. 2002, against H-reflex delay of 3 SD above normal"}, "title_zh": "FAIR 測試 FAIR Test", "name_zh": "FAIR 測試", "purpose_zh": "以屈曲-內收-內轉 (Flexion-Adduction-Internal Rotation) 誘發梨狀肌 (piriformis) 對坐骨神經 (sciatic nerve) 的壓迫，用於疑似深臀症候群 (deep gluteal syndrome)。", "structure_zh": "梨狀肌與臀下間隙內的坐骨神經。", "procedure_zh": "先排除更常見的腰椎與薦髂關節 (SIJ) 病變。病人側臥、健側在下，上方髖屈曲 90°、最大內收、上方膝屈曲 90°。保持兩側髖臼垂直，檢查者對小腿施加向上、向外的壓力，同時被動將髖內轉到 45° 或病人能忍受的角度。", "positive_zh": "坐骨神經與梨狀肌交會處疼痛。", "notes_zh": "Fishman 等人 (2002) 以 H 反射 (Hoffmann reflex) 延遲超過正常 3 個標準差為對照：敏感度 88%、特異度 83%。但 H 反射敏感而不特異、並非準確的黃金標準，且沒有其他研究，原頁因此給「存疑」的臨床價值。其他 DGS 檢查：Freiberg 徵象、Pace 手法、坐姿梨狀肌伸展測試、HCLK 手法、梨狀肌測試、Beatty 手法、主動梨狀肌測試。", "tags": ["梨狀肌 piriformis", "深臀症候群 DGS", "H 反射 H-reflex"]}, {"slug": "freiberg-sign", "title_en": "Freiberg Sign", "link": "https://www.physiotutors.com/wiki/freiberg-sign/", "youtube_ids": ["GEG3Mn9Ir6Q"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a: page states no diagnostic studies exist (Freiberg 1937; Kirschner 2009)"}, "title_zh": "Freiberg 徵象 Freiberg Sign", "name_zh": "Freiberg 徵象", "purpose_zh": "藉由伸展受刺激的梨狀肌 (piriformis) 誘發坐骨神經 (sciatic nerve) 壓迫，用於疑似深臀症候群 (deep gluteal syndrome)。", "structure_zh": "梨狀肌與坐骨神經。", "procedure_zh": "先排除更常見的腰椎與薦髂關節 (SIJ) 病變。病人仰臥，檢查者用力將患側伸直的大腿內轉。", "positive_zh": "重現病人熟悉的臀部疼痛及／或向下肢後側放射的感覺異常 (paraesthesia)。", "notes_zh": "原頁明言尚無任何診斷研究評估 Freiberg 手法，臨床價值存疑（參考 Freiberg 1937、Kirschner 2009）。其他 DGS 檢查：HCLK 手法、Pace 手法、坐姿梨狀肌伸展測試、FAIR 測試、梨狀肌測試、Beatty 手法、主動梨狀肌測試。", "tags": ["梨狀肌 piriformis", "深臀症候群 DGS", "效度未知 unvalidated"]}, {"slug": "pace-maneuver", "title_en": "Pace Maneuver", "link": "https://www.physiotutors.com/wiki/pace-maneuver/", "youtube_ids": ["WhuPgPx4GtM"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a: page states no diagnostic studies exist (Pace & Nagle 1976; Kirschner 2009)"}, "title_zh": "Pace 手法 Pace Maneuver", "name_zh": "Pace 手法", "purpose_zh": "深臀症候群 (deep gluteal syndrome)／梨狀肌症候群 (piriformis syndrome) 的誘發測試。", "structure_zh": "梨狀肌 (piriformis) 與坐骨神經 (sciatic nerve)。", "procedure_zh": "⚠ 來源問題：原頁的操作段落與 FAIR 測試頁面一字不差（「如 Fishman 研究所示」：健側在下側臥、上方髖屈 90° 並最大內收、膝屈 90°、對小腿施加向上向外壓力並內轉到 45°），看起來是 physiotutors.com 的複製貼上錯誤；Pace & Nagle (1976) 原始手法在原頁文字中並未描述。實際操作請以影片為準。", "positive_zh": "依原頁文字：坐骨神經與梨狀肌交會處疼痛（與 FAIR 頁面相同措辭）。", "notes_zh": "原頁明言尚無診斷研究，臨床價值存疑（參考 Pace & Nagle 1976、Kirschner 2009）。施測前先排除腰椎與薦髂關節病變。其他 DGS 檢查：Freiberg 徵象、FAIR 測試、坐姿梨狀肌伸展測試、HCLK 手法、梨狀肌測試、Beatty 手法、主動梨狀肌測試。", "tags": ["梨狀肌 piriformis", "深臀症候群 DGS", "來源有誤 source issue"]}, {"slug": "beatty-maneuver", "title_en": "Beatty Maneuver", "link": "https://www.physiotutors.com/wiki/beatty-maneuver/", "youtube_ids": ["pvEnryptz28"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a: page states no diagnostic studies exist (Beatty 1994; Kirschner 2009)"}, "title_zh": "Beatty 手法 Beatty Maneuver", "name_zh": "Beatty 手法", "purpose_zh": "梨狀肌症候群 (piriformis syndrome)／深臀症候群 (deep gluteal syndrome) 的簡易誘發手法。", "structure_zh": "梨狀肌 (piriformis) 與坐骨神經 (sciatic nerve)。", "procedure_zh": "先排除更常見的腰椎與薦髂關節 (SIJ) 病變。病人側臥、健側在下，髖膝屈曲，接著請病人主動外展上方大腿使其離開床面。", "positive_zh": "患側（上方）出現深部臀痛。若出現的是背痛，原頁描述見於腰椎椎間盤疾病 (lumbar disc disease) 的病人。", "notes_zh": "原頁明言尚無診斷研究，臨床價值存疑（參考 Beatty 1994、Kirschner 2009）。其他 DGS 檢查：HCLK 手法、Pace 手法、Freiberg 徵象、FAIR 測試、梨狀肌測試、坐姿梨狀肌伸展測試、主動梨狀肌測試。", "tags": ["梨狀肌 piriformis", "深臀症候群 DGS", "效度未知 unvalidated"]}, {"slug": "cluster-of-laslett", "title_en": "Cluster of Laslett", "link": "https://www.physiotutors.com/wiki/cluster-of-laslett/", "youtube_ids": ["g8txpsqHYpQ"], "accuracy": {"sensitivity": "88% (≥2 of 4 positive)", "specificity": "78% (≥2 of 4 positive)", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Laslett et al. 2005"}, "title_zh": "Laslett 組合測試 Cluster of Laslett", "name_zh": "Laslett 組合測試", "purpose_zh": "用一組測試與演算法 (algorithm) 判定薦髂關節 (sacroiliac joint, SIJ) 是否為下背／臀部疼痛的來源。", "structure_zh": "薦髂關節（疼痛誘發，而非活動度）。", "procedure_zh": "四項誘發測試，每項施加 3–6 次逐漸加壓的推力 (thrust)：(1) 牽張測試 (distraction)：仰臥，雙手放兩側髂前上棘 (ASIS)，往背外側中等速度推；(2) 大腿推擠測試 (thigh thrust)：仰臥，患側髖屈 90°，一手墊在薦骨下，沿股骨縱向施壓，速度較快；(3) 壓迫測試 (compression)：健側在下側臥，髖屈 45°、膝屈 90°，雙手在髂骨前緣垂直下壓，中等速度；(4) 薦骨推擠測試 (sacral thrust)：俯臥，掌根放 S2，垂直下壓，速度較快。演算法：前兩項都陽性即可停止；否則加做壓迫測試，再加做薦骨推擠測試。原始版本有 6 項，Laslett 因另外兩項沒有額外診斷價值而減為 4 項。", "positive_zh": "4 項中有 2 項以上重現病人熟悉的疼痛 → SIJ 很可能是疼痛來源；少於 2 項陽性 → SIJ 疼痛不太可能或可排除。", "notes_zh": "Laslett 等人 (2005)：2 項以上陽性的敏感度 88%、特異度 78%。若病人的症狀在 McKenzie 反覆動作測試中不會中央化 (centralize)，特異度會更高。推力是疼痛誘發而非徒手治療的扳動，先輕後重，有時一次施壓就夠。⚠ 來源問題：原頁寫 Gaenslen 測試「對準確度幾乎沒有貢獻」卻「被納入建議演算法」，而 Gaenslen 頁面寫 Laslett 把它從組合中移除，所以「被納入」極可能是「未被納入」的筆誤。另一常用組合：van der Wurff 組合 (Cluster of van der Wurff)。", "tags": ["薦髂關節 SIJ", "cluster", "疼痛誘發 pain provocation"]}, {"slug": "thigh-thrust-test", "title_en": "Thigh Thrust Test", "link": "https://www.physiotutors.com/wiki/thigh-thrust-test/", "youtube_ids": ["id4GqQ82BiM"], "accuracy": {"sensitivity": "88%", "specificity": "69%", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Laslett et al. 2005 (page text mislabels the figures as 'sacroiliac compression test', apparent copy-paste typo)"}, "title_zh": "大腿推擠測試 Thigh Thrust Test", "name_zh": "大腿推擠測試", "purpose_zh": "薦髂關節 (sacroiliac joint, SIJ) 的疼痛誘發測試；屬於 Laslett 組合與 van der Wurff 組合的一部分。", "structure_zh": "薦髂關節（後向剪力）。", "procedure_zh": "病人仰臥，檢查者站健側。將患側髖屈曲 90°，一手墊在薦骨 (sacrum) 下，沿股骨縱向施壓在 SIJ 產生剪力；施加 3–6 次速度較快、逐漸加壓的推力。", "positive_zh": "重現病人熟悉的疼痛。", "notes_zh": "Laslett 等人 (2005)：敏感度 88%、特異度 69%，原頁給中等臨床價值，建議在 cluster 中使用。⚠ 原頁內文把這組數字寫成「sacroiliac compression test」，應為複製貼上的筆誤（數字與 Laslett 2005 的大腿推擠測試一致）。", "tags": ["薦髂關節 SIJ", "Laslett 組合", "疼痛誘發 pain provocation"]}, {"slug": "distraction-test", "title_en": "Distraction Test", "link": "https://www.physiotutors.com/wiki/distraction-test/", "youtube_ids": ["OUwzaMVgGMk"], "accuracy": {"sensitivity": "60%", "specificity": "81%", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Laslett et al. 2005 (page text mislabels the figures as 'sacroiliac compression test', apparent copy-paste typo)"}, "title_zh": "薦髂關節牽張測試 Distraction Test", "name_zh": "薦髂關節牽張測試", "purpose_zh": "薦髂關節 (sacroiliac joint, SIJ) 的疼痛誘發測試；屬於 Laslett 組合與 van der Wurff 組合的一部分。", "structure_zh": "薦髂關節（前側韌帶被牽張、後側被壓迫）。", "procedure_zh": "病人仰臥、雙腿伸直，檢查者站患側。雙手放在兩側髂前上棘 (ASIS)，往背外側 (dorsolateral) 方向施加 3–6 次中等速度、逐漸加壓的推力。", "positive_zh": "重現病人熟悉的疼痛。", "notes_zh": "Laslett 等人 (2005)：敏感度 60%、特異度 81%，原頁給中等臨床價值，建議在 cluster 中使用。⚠ 原頁內文同樣把數字寫成「sacroiliac compression test」，應為複製貼上的筆誤（數字與 Laslett 2005 的牽張測試一致）。", "tags": ["薦髂關節 SIJ", "Laslett 組合", "疼痛誘發 pain provocation"]}, {"slug": "sacroiliac-compression-test", "title_en": "Sacroiliac Compression Test", "link": "https://www.physiotutors.com/wiki/sacroiliac-compression-test/", "youtube_ids": ["7rxOWC9qoOA"], "accuracy": {"sensitivity": "69%", "specificity": "69%", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Laslett et al. 2005"}, "title_zh": "薦髂關節壓迫測試 Sacroiliac Compression Test", "name_zh": "薦髂關節壓迫測試", "purpose_zh": "薦髂關節 (sacroiliac joint, SIJ) 的疼痛誘發測試；屬於 Laslett 組合與 van der Wurff 組合的一部分。", "structure_zh": "薦髂關節（經髂骨施加壓迫）。", "procedure_zh": "病人健側在下側臥，髖屈 45°、膝屈 90°。檢查者站在病人身後，雙手放在髂骨 (ilium) 前緣，垂直施加 3–6 次中等速度、逐漸加壓的推力。", "positive_zh": "重現病人熟悉的疼痛。", "notes_zh": "Laslett 等人 (2005)：敏感度 69%、特異度 69%，原頁給弱臨床價值，建議在 cluster 中使用。⚠ 來源問題：API 回傳的影片 ID 與薦骨推擠測試頁面相同（7rxOWC9qoOA），請確認實際播放的是哪支影片。", "tags": ["薦髂關節 SIJ", "Laslett 組合", "疼痛誘發 pain provocation"]}, {"slug": "sacral-thrust-test", "title_en": "Sacral Thrust Test", "link": "https://www.physiotutors.com/wiki/sacral-thrust-test/", "youtube_ids": ["7rxOWC9qoOA"], "accuracy": {"sensitivity": "63%", "specificity": "75%", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Laslett et al. 2005"}, "title_zh": "薦骨推擠測試 Sacral Thrust Test", "name_zh": "薦骨推擠測試", "purpose_zh": "薦髂關節 (sacroiliac joint, SIJ) 的疼痛誘發測試；屬於 Laslett 組合與 van der Wurff 組合的一部分。", "structure_zh": "薦髂關節（薦骨相對髂骨的前向剪力）。", "procedure_zh": "病人俯臥，檢查者站患側床邊。掌根放在 S2 棘突、手指朝頭側，垂直向下施加 3–6 次高速度、逐漸加壓的推力。", "positive_zh": "重現病人熟悉的疼痛。", "notes_zh": "Laslett 等人 (2005)：敏感度 63%、特異度 75%，原頁給弱臨床價值，建議在 cluster 中使用。影片 ID 與薦髂關節壓迫測試頁面相同（見該筆說明）。", "tags": ["薦髂關節 SIJ", "Laslett 組合", "疼痛誘發 pain provocation"]}, {"slug": "gaenslens-test", "title_en": "Gaenslen's Test", "link": "https://www.physiotutors.com/wiki/gaenslens-test/", "youtube_ids": ["ED_bYoQk9d4"], "accuracy": {"sensitivity": "53% (right SIJ), 50% (left SIJ)", "specificity": "71% (right SIJ), 77% (left SIJ)", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Laslett et al. 2005"}, "title_zh": "Gaenslen's 測試 Gaenslen's Test", "name_zh": "Gaenslen's 測試", "purpose_zh": "薦髂關節 (sacroiliac joint, SIJ) 的疼痛誘發測試。", "structure_zh": "薦髂關節（扭轉：一側髖完全屈曲、另一側伸直）。", "procedure_zh": "以右側 SIJ 為例：病人仰臥靠近床緣，左腿垂出床外，右側髖膝屈曲抱向胸口。檢查者對屈曲的膝蓋朝胸口施加穩定壓力，同時對垂下的膝蓋朝地面施加反向壓力。兩側都要做。", "positive_zh": "誘發病人熟悉的症狀。", "notes_zh": "Laslett 等人 (2005)：測右側 SIJ 時敏感度 53%、特異度 71%；測左側時敏感度 50%、特異度 77%。準確度低，臨床價值弱，Laslett 甚至把它從 SIJ 疼痛誘發組合中移除。", "tags": ["薦髂關節 SIJ", "疼痛誘發 pain provocation"]}, {"slug": "yeoman-test", "title_en": "Yeoman Test", "link": "https://www.physiotutors.com/wiki/yeoman-test/", "youtube_ids": ["TFdv7dGweR4"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a: no validation; reference Walsh 1998"}, "title_zh": "Yeoman 測試 Yeoman Test", "name_zh": "Yeoman 測試", "purpose_zh": "針對薦髂關節發炎，即薦髂關節炎 (sacroiliitis) 所提出的誘發測試。", "structure_zh": "薦髂關節 (sacroiliac joint, SIJ)。薦髂關節炎可為脊椎關節病變 (spondyloarthropathies) 的表現之一，例如僵直性脊椎炎 (ankylosing spondylitis)、乾癬性關節炎 (psoriatic arthritis)、發炎性腸道疾病／克隆氏症相關關節炎。", "procedure_zh": "病人俯臥靠近床緣。將膝屈曲約 90°，一手握住股骨遠端，另一手壓在同側髂後上棘 (posterior superior iliac spine, PSIS) 固定骨盆，再被動把髖伸直。", "positive_zh": "重現病人的 SIJ 或臀部疼痛。", "notes_zh": "薦髂關節炎的診斷依賴病史、實驗室檢查與後續 MRI；理學檢查描述不足且未經驗證，臨床價值存疑（參考 Walsh 1998）。", "tags": ["薦髂關節炎 sacroiliitis", "脊椎關節病變 spondyloarthropathy", "效度未知 unvalidated"]}, {"slug": "gillet-test", "title_en": "Gillet Test", "link": "https://www.physiotutors.com/wiki/gillet-test/", "youtube_ids": ["dvhvKXnXAac"], "accuracy": {"sensitivity": "43%", "specificity": "68%", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Dreyfuss et al. 1996; reliability kappa 0.22"}, "title_zh": "Gillet 測試（行軍測試） Gillet Test", "name_zh": "Gillet 測試（行軍測試）", "purpose_zh": "偵測薦髂關節「功能障礙」(SIJ dysfunction)，即被認為「卡住」不動的薦髂關節；又稱行軍測試 (Marching Test) 或薦骨固定測試 (Sacral Fixation Test)。", "structure_zh": "髂後上棘 (PSIS) 與 S2 之間的薦髂關節 (sacroiliac joint, SIJ) 動作。", "procedure_zh": "檢查者站在站立病人的後方，觸診兩側 PSIS（與 S2 棘突同高）。測右側 SIJ 時，右手放右側 PSIS、左手放 S2，請病人右髖屈曲到 90°。", "positive_zh": "正常 SIJ 的 PSIS 會下降到 S2 以下；「卡住」或低動度 (hypomobile) 的 SIJ 則 PSIS 不下降或只動一點點。", "notes_zh": "Dreyfuss 等人 (1996)：信度 kappa 0.22（低），敏感度 43%、特異度 68%，臨床價值存疑。Physiotutors 建議放棄 SIJ 功能障礙測試，只做 Laslett 組合等疼痛誘發測試。相關檢查：站立前彎測試 (standing bent-over / Vorlauf test)、Shimpi 俯臥 SIJ 測試、SIJ 點頭／反點頭 (nutation / counternutation)。", "tags": ["薦髂關節 SIJ", "功能障礙測試 dysfunction", "信度低 low reliability"]}, {"slug": "sacroiliac-joint-play", "title_en": "Sacroiliac Joint Play", "link": "https://www.physiotutors.com/wiki/sacroiliac-joint-play/", "youtube_ids": ["Rauz-k6XA2g"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a; reliability reference Robinson et al. 2007"}, "title_zh": "薦髂關節關節鬆動度評估 Sacroiliac Joint Play", "name_zh": "薦髂關節關節鬆動度評估", "purpose_zh": "以徒手方式評估薦髂關節 (sacroiliac joint, SIJ) 的關節鬆動度 (joint play)，用於疑似 SIJ 低動度 (hypomobility)。", "structure_zh": "薦髂關節；原頁把薦骨分成 4 個象限（S2 以上為 1、2，以下為 3、4）方便描述手位。", "procedure_zh": "病人俯臥。以右側 SIJ 為例：右手小魚際 (hypothenar) 放在薦骨第 2、4 象限，另一手握住髂骨 (ilium)。把髂骨往上、往內拉，評估關節鬆動度，避免讓髂骨後旋 (posterior rotation)。", "positive_zh": "非二元判讀：與對側比較關節鬆動度與末端感覺 (end-feel)。", "notes_zh": "原頁未給準確度數值（信度參考 Robinson 等人 2007）。Physiotutors 建議因信度低而放棄 SIJ 功能障礙測試，專注於 Laslett 組合等疼痛誘發測試。", "tags": ["薦髂關節 SIJ", "關節鬆動度 joint play", "信度低 low reliability"]}, {"slug": "sacroiliac-joint-nutation", "title_en": "Sacroiliac Joint Nutation", "link": "https://www.physiotutors.com/wiki/sacroiliac-joint-nutation/", "youtube_ids": ["5jaV_sujGlo"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a; reliability reference Robinson et al. 2007"}, "title_zh": "薦髂關節點頭評估 Sacroiliac Joint Nutation", "name_zh": "薦髂關節點頭評估", "purpose_zh": "以徒手技術評估薦骨點頭 (nutation)，取得關節鬆動度、SIJ 的少量動作與疼痛誘發的資訊。", "structure_zh": "薦髂關節 (sacroiliac joint, SIJ)；薦骨分成 4 個象限（S2 以上為 1、2，以下為 3、4）。", "procedure_zh": "病人俯臥，在受測側的髂前上棘 (ASIS) 下墊一個枕墊。檢查者站健側，用與受測側同側的手放在薦骨上（右側 SIJ：右手放第 2 象限；左側：左手放第 1 象限），另一手疊在上方，往頭側腹側 (cranioventral) 方向施力，評估末端感覺或關節鬆動度。", "positive_zh": "非二元判讀：與對側比較末端感覺、關節鬆動度與疼痛。", "notes_zh": "原頁未給準確度數值（信度參考 Robinson 等人 2007）。Physiotutors 建議因信度低而放棄 SIJ 功能障礙測試，專注於 Laslett 組合等疼痛誘發測試。", "tags": ["薦髂關節 SIJ", "點頭 nutation", "信度低 low reliability"]}, {"slug": "sacroiliac-joint-counternutation", "title_en": "Sacroiliac Joint Counternutation", "link": "https://www.physiotutors.com/wiki/sacroiliac-joint-counternutation/", "youtube_ids": ["vIygA_euS-4"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a; reliability reference Robinson et al. 2007"}, "title_zh": "薦髂關節反點頭評估 Sacroiliac Joint Counternutation", "name_zh": "薦髂關節反點頭評估", "purpose_zh": "以徒手技術評估薦骨反點頭 (counternutation)，與對側比較末端感覺、關節鬆動度或疼痛誘發。", "structure_zh": "薦髂關節 (sacroiliac joint, SIJ)；薦骨分成 4 個象限（S2 以上為 1、2，以下為 3、4）。", "procedure_zh": "病人俯臥。檢查者站健側，用與受測側同側的手放在髂嵴 (iliac spine) 上（右側 SIJ：右手），另一手放在薦骨 S2 以下。雙手朝相反方向施壓：髂骨側的手往頭側腹側（並向外），薦骨側的手往腹側尾側 (ventrocaudal)。評估末端感覺或關節鬆動度。", "positive_zh": "非二元判讀：與對側比較末端感覺、關節鬆動度與疼痛。", "notes_zh": "SIJ 幾乎沒有動作，單獨評估其動作很困難、信度低；Physiotutors 建議專注於 Laslett 組合等疼痛誘發測試（信度參考 Robinson 等人 2007）。", "tags": ["薦髂關節 SIJ", "反點頭 counternutation", "信度低 low reliability"]}, {"slug": "top-5-gluteus-maximus-exercises", "title_en": "Top 5 Gluteus Maximus Exercises", "link": "https://www.physiotutors.com/wiki/top-5-gluteus-maximus-exercises/", "youtube_ids": ["WHDdm0Yxh-o"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a"}, "title_zh": "臀大肌五大運動 Top 5 Gluteus Maximus Exercises", "name_zh": "臀大肌五大運動", "purpose_zh": "依肌電圖 (EMG) 活化程度（Reiman 等人 2012 的回顧）選擇臀大肌 (gluteus maximus) 的強化運動。", "structure_zh": "臀大肌：強力的髖伸肌與外轉肌，是身體從髖屈約 45–60° 向上向前加速時最重要的肌肉，也在向對側的蹬地轉向 (plant and cut) 中扮演要角。髖功能障礙與下背及多種下肢病變有關；外轉無力與髕股疼痛症候群 (patellofemoral pain syndrome) 有強烈關聯。", "procedure_zh": "活化度最高的五項，由低到高：1) 後退式登階 (retro step-up)、2) 靠牆深蹲 (wall squat)、3) 單腳深蹲 (single-leg squat)、4) 單腳硬舉 (single-leg deadlift)、5) 登階 (step-up)；另加 Physiotutors 的個人最愛：負重臀推 (weighted hip thrust)。", "positive_zh": "不適用（運動頁面）。", "notes_zh": "EMG 活化只是選擇運動的因素之一；還要考量病人的功能需求、關節角度、開放鏈與閉鎖鏈、協調需求、感覺動作回饋、刺激性 (irritability) 與病人的技巧。", "tags": ["臀大肌 gluteus maximus", "運動治療 exercise", "肌電圖 EMG"]}, {"slug": "top-5-glutes-medius-exercises", "title_en": "Top 5 Gluteus Medius Exercises", "link": "https://www.physiotutors.com/wiki/top-5-glutes-medius-exercises/", "youtube_ids": ["GwPe0JwYbrA"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a"}, "title_zh": "臀中肌五大運動 Top 5 Gluteus Medius Exercises", "name_zh": "臀中肌五大運動", "purpose_zh": "依肌電圖 (EMG) 活化程度（Reiman 等人 2012 的回顧）選擇臀中肌 (gluteus medius) 的強化運動。", "structure_zh": "臀中肌：負重活動中股骨與骨盆的重要穩定肌，步態站立期 (stance phase) 活化最高；前、中、後纖維占髖外展肌總橫斷面積的 60%。髖外展與外轉無力與髕股疼痛症候群 (patellofemoral pain syndrome) 有關，因為可能造成膝外翻、髖內收與髖內轉，增加膝關節壓力。", "procedure_zh": "活化度最高的五項，由低到高：1) 側臥髖外展（加或不加彈力帶）、2) 骨盆下沉 (pelvic drop)、3) 單腳硬舉 (single-leg deadlift)、4) 單腳深蹲 (single-leg squat)、5) 側橋／側棒式 (side bridge / side plank)。", "positive_zh": "不適用（運動頁面）。", "notes_zh": "與臀大肌五大運動為配套頁面。", "tags": ["臀中肌 gluteus medius", "運動治療 exercise", "肌電圖 EMG"]}, {"slug": "copenhagen-adduction-exercise", "title_en": "Copenhagen Adduction Exercise", "link": "https://www.physiotutors.com/wiki/copenhagen-adduction-exercise/", "youtube_ids": ["lBIcQzr-cQs"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a"}, "title_zh": "哥本哈根內收運動 Copenhagen Adduction Exercise", "name_zh": "哥本哈根內收運動", "purpose_zh": "髖內收肌 (hip adductors) 的離心 (eccentric) 強化運動，用於內收肌傷害的預防與復健；內收肌傷害是足球最常見的傷害之一，內收肌力低者受傷風險較高，受傷多發生在肌肉邊收縮邊被拉長的離心動作中。", "structure_zh": "雙腿的髖內收肌（以上方腿為主要訓練側），承受離心負荷。", "procedure_zh": "側臥，以下方前臂撐地，另一手沿身體放。同伴把上方腿抬到約其髖部的高度，一手托踝、一手托膝上方。用 3 秒的向心 (concentric) 內收把身體抬起，同時下方腿也內收，直到身體成一直線、雙腳相碰；再以 3 秒離心內收放下，身體下降到一半、下方腳剛好碰地但不借力。全程軀幹不可側彎。建議從每側 2 組 × 6 下、每週 2–3 次開始，逐週增加到 3 組 × 15 下。沒有同伴可用史密斯機 (Smith machine) 加軟墊；進階可用 TRX 懸吊或加負重。", "positive_zh": "不適用（運動頁面）。", "notes_zh": "Ishøi 等人 (2016) 在年輕次菁英足球員的 8 週隨機對照試驗：離心內收肌力增加 35.7%、離心髖外展肌力增加 20.3%。Harøy 等人建議把此運動加入 FIFA 11+ 預防計畫，因為現行計畫對鼠蹊問題著墨不足。", "tags": ["內收肌群 adductors", "離心訓練 eccentric", "鼠蹊痛預防 groin injury prevention"]}, {"slug": "sacroiliac-joint-pain-exercises", "title_en": "Sacroiliac Joint Pain Exercises", "link": "https://www.physiotutors.com/wiki/sacroiliac-joint-pain-exercises/", "youtube_ids": ["YnTRuS0mtCA"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a"}, "title_zh": "薦髂關節疼痛運動 Sacroiliac Joint Pain Exercises", "name_zh": "薦髂關節疼痛運動", "purpose_zh": "針對疼痛（敏感化）的薦髂關節 (sacroiliac joint, SIJ)，以訓練提供力量閉鎖 (force closure) 的肌群來降低傷害感受 (nociception)。", "structure_zh": "SIJ 疼痛定義為髂後上棘 (PSIS) 2 公分內的疼痛，常轉移到臀部的 Fortin 區。穩定來自形態閉鎖 (form closure)：關節面的構造、有稜紋的關節面與緻密韌帶；以及力量閉鎖：股直肌 (rectus femoris)、臀肌、腿後肌群 (hamstrings)、髂腰肌 (iliopsoas)，闊背肌 (latissimus dorsi) 與豎脊肌 (erector spinae) 也經胸腰筋膜 (thoracolumbar fascia) 施力於 SIJ。", "procedure_zh": "範例運動：蚌殼式側棒式（進階：四足跪姿）、消防栓式 (fire hydrant)、髂腰肌行軍 (iliopsoas march)、側棒式（進階：直腿、再進階：上方腿外展）、單腳硬舉、腹部棒式、橋式（進階：抬腿橋式）、腹部捲曲、背伸展、超人式、滑輪下拉 (lat pulldown)。依病人描述的誘發情境（例如從椅子站起、走路）判斷該朝伸直或屈曲方向負荷。", "positive_zh": "不適用（運動頁面）。", "notes_zh": "成因：薦髂關節炎 (sacroiliitis)、Bechterew 氏病（僵直性脊椎炎）、直接外傷（踩空）、懷孕與產後韌帶鬆弛。Kibsgård 等人 (2014) 顯示即使用精密的實驗室量測也無法定義 SIJ 的過動／低動，SIJ 動作太小、無法靠觸診或特殊測試評估，且這些測試信度差；但我們可以測傷害感受（疼痛誘發）。另參考 Vleeming & Schuenke 2019。", "tags": ["薦髂關節 SIJ", "力量閉鎖 force closure", "運動治療 exercise"]}]}</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const CATS = DATA.categories, T = DATA.tests;
const order = CATS.flatMap(c => c.slugs);
const bySlug = Object.fromEntries(T.map(t => [t.slug, t]));
const catOf = Object.fromEntries(CATS.flatMap(c => c.slugs.map(s => [s, c])));
const LS = 'physio-atlas-done-hip';
let done = new Set(); try { done = new Set(JSON.parse(localStorage.getItem(LS) || '[]')); } catch (e) {}
function saveDone(){ try { localStorage.setItem(LS, JSON.stringify([...done])); } catch (e) {} }
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ----- sidebar ----- */
const nav = document.getElementById('nav');
nav.innerHTML = CATS.map((c, i) => `
<details class="cat" id="cat-${c.id}" ${i === 0 ? 'open' : ''}>
  <summary><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="zh">${esc(c.zh)}</span><span class="en">${esc(c.en)}</span></summary>
  <ul>${c.slugs.map(s => { const t = bySlug[s]; return `<li data-slug="${s}"><a href="#${s}" data-slug="${s}"><span class="tick"></span><span class="t">${esc(t.name_zh)}<small>${esc(t.title_en)}</small></span></a></li>`; }).join('')}</ul>
</details>`).join('');

function refreshNav(){
  nav.querySelectorAll('a').forEach(a => {
    a.classList.toggle('done', done.has(a.dataset.slug));
    a.classList.toggle('active', a.dataset.slug === current);
  });
  const n = done.size, N = order.length, pct = Math.round(100 * n / N);
  document.getElementById('pct').textContent = pct + '%';
  document.getElementById('cnt').textContent = `${n} / ${N}`;
  document.getElementById('barfill').style.width = pct + '%';
}

/* ----- search ----- */
document.getElementById('q').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  nav.querySelectorAll('.cat').forEach(cat => {
    let any = false;
    cat.querySelectorAll('li').forEach(li => {
      const t = bySlug[li.dataset.slug];
      const hay = [t.title_zh, t.title_en, t.structure_zh, (t.tags || []).join(' '), t.purpose_zh].join(' ').toLowerCase();
      const hit = !q || hay.includes(q);
      li.hidden = !hit; any = any || hit;
    });
    cat.classList.toggle('nomatch', !any);
    if (q && any) cat.open = true;
  });
});

/* ----- rendering ----- */
let current = null, vidIdx = 0;
const art = document.getElementById('art');
function accRow(label, v){ return v && !/^(n\/a|not reported|none|-)$/i.test(v) ? `<div><b>${label}</b><span>${esc(v)}</span></div>` : ''; }

function render(slug){
  const t = bySlug[slug];
  if (!t) { renderWelcome(); return; }
  current = slug; vidIdx = 0;
  const c = catOf[slug];
  const zh = t.name_zh, enParts = [t.title_en];
  const a = t.accuracy || {};
  const accHtml = [accRow('Sensitivity 敏感度', a.sensitivity), accRow('Specificity 特異度', a.specificity), accRow('LR+', a.lr_plus), accRow('LR−', a.lr_minus)].join('');
  art.innerHTML = `
  <div class="player"><iframe id="yt" src="https://www.youtube-nocookie.com/embed/${t.youtube_ids[0]}?rel=0&modestbranding=1" title="${esc(t.title_en)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
  <div class="vids">${t.youtube_ids.length > 1 ? t.youtube_ids.map((v, i) => `<button data-v="${i}" class="${i === 0 ? 'on' : ''}">影片 ${i + 1}</button>`).join('') : ''}<a href="https://www.youtube.com/watch?v=${t.youtube_ids[0]}" target="_blank" rel="noopener">在 YouTube 開啟 ↗</a></div>
  <header class="head">
    <div class="eyebrow">${esc(c.en)} · ${esc(c.zh)}</div>
    <h2>${esc(zh)}<span class="en">${esc(enParts.join(' ') || t.title_en)}</span></h2>
    <div class="tags">${(t.tags || []).map(x => `<span>${esc(x)}</span>`).join('')}</div>
    <label class="doneRow"><input type="checkbox" id="doneBox" ${done.has(slug) ? 'checked' : ''}> 已看完此測試</label>
  </header>
  <section class="sec"><h3>目的<small>Purpose</small></h3><p>${esc(t.purpose_zh)}</p></section>
  <section class="sec"><h3>檢查結構<small>Structure</small></h3><p>${esc(t.structure_zh)}</p></section>
  <section class="sec"><h3>操作步驟<small>Procedure</small></h3><p>${esc(t.procedure_zh)}</p></section>
  <section class="sec positive"><h3>陽性判讀<small>Positive finding</small></h3><p>${esc(t.positive_zh)}</p></section>
  ${accHtml ? `<section class="sec"><h3>診斷準確度<small>Accuracy</small></h3><div class="acc">${accHtml}${a.source ? `<div class="src">來源 Source：${esc(a.source)}</div>` : ''}</div></section>` : ''}
  <section class="sec"><h3>臨床重點<small>Clinical notes</small></h3><p>${esc(t.notes_zh)}</p></section>
  <div class="foot"><span>原文頁面：<a href="${t.link}" target="_blank" rel="noopener">physiotutors.com ↗</a></span><span>影片版權屬 Physiotutors；本頁僅嵌入播放與整理筆記。</span></div>`;
  art.querySelectorAll('.vids button').forEach(b => b.addEventListener('click', () => {
    vidIdx = +b.dataset.v;
    document.getElementById('yt').src = `https://www.youtube-nocookie.com/embed/${t.youtube_ids[vidIdx]}?rel=0&modestbranding=1`;
    art.querySelectorAll('.vids button').forEach(x => x.classList.toggle('on', x === b));
  }));
  document.getElementById('doneBox').addEventListener('change', e => { e.target.checked ? done.add(slug) : done.delete(slug); saveDone(); refreshNav(); });
  document.getElementById('crumb').innerHTML = `${esc(DATA.region.en)} / ${esc(c.en)} / <b>${esc(t.title_en)}</b>`;
  const i = order.indexOf(slug);
  document.getElementById('prev').disabled = i <= 0;
  document.getElementById('next').disabled = i >= order.length - 1;
  document.getElementById('cat-' + c.id).open = true;
  refreshNav();
  document.getElementById('main').scrollTo({ top: 0 });
  document.body.classList.remove('nav-open');
  document.title = `${t.title_en} · Physio Exam Atlas`;
}
function renderWelcome(){
  current = null;
  art.innerHTML = `<div class="welcome"><h2>${esc(DATA.region.zh)}理學檢查影片地圖</h2>
  <p>${order.length} 支 Physiotutors 影片，依 ${CATS.length} 個主題排列。每支影片附繁中段落筆記（目的、操作、陽性判讀、診斷準確度、臨床重點），醫學名詞保留英文。觀看進度存在你的瀏覽器裡。</p>
  <div class="grid">${CATS.map((c, i) => `<button data-cat="${c.id}"><b>${esc(c.zh)}</b><small>${esc(c.en)}</small><i>${c.slugs.length} 支影片 · ${c.slugs.filter(s => done.has(s)).length} 已看</i></button>`).join('')}</div></div>`;
  art.querySelectorAll('button[data-cat]').forEach(b => b.addEventListener('click', () => { location.hash = CATS.find(c => c.id === b.dataset.cat).slugs[0]; }));
  document.getElementById('crumb').textContent = `${DATA.region.en} · 選擇左側測試開始`;
  document.getElementById('prev').disabled = true; document.getElementById('next').disabled = false;
  refreshNav();
}
document.getElementById('prev').addEventListener('click', () => { const i = order.indexOf(current); if (i > 0) location.hash = order[i - 1]; });
document.getElementById('next').addEventListener('click', () => { const i = order.indexOf(current); location.hash = order[i + 1] || order[0]; });
document.getElementById('menu').addEventListener('click', () => document.body.classList.toggle('nav-open'));
document.getElementById('scrim').addEventListener('click', () => document.body.classList.remove('nav-open'));
window.addEventListener('hashchange', () => render(location.hash.slice(1)));
render(location.hash.slice(1));
</script>
</body>
</html>
