<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumbar spine · Physio Exam Atlas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left index (course → category → test), scrolling reading pane with player on top. */
:root{
  --bg:#f7f5f1; --panel:#ffffff; --fg:#1d1b17; --muted:#6b665c; --line:#e3ded4;
  --accent:#1f5f6b; --accent-ink:#ffffff; --accent-soft:#e3eff1; --mark:#c8731b;
  --done:#2f7d4f; --code:#f0ede6;
  --display:"Fraunces","Noto Sans TC",Georgia,serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --sidebar:300px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#15171a; --panel:#1d2024; --fg:#ebe7df; --muted:#a19b90; --line:#2d3137;
  --accent:#6fb9c6; --accent-ink:#0f1a1d; --accent-soft:#1d3237; --mark:#e49a4c;
  --done:#6cc68f; --code:#24282d; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#15171a; --panel:#1d2024; --fg:#ebe7df; --muted:#a19b90; --line:#2d3137;
  --accent:#6fb9c6; --accent-ink:#0f1a1d; --accent-soft:#1d3237; --mark:#e49a4c;
  --done:#6cc68f; --code:#24282d; color-scheme:dark; }

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.65;display:flex;overflow:hidden}
a{color:var(--accent)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
h1,h2,h3{text-wrap:balance;margin:0}

/* ---- sidebar ---- */
#side{width:var(--sidebar);flex:0 0 auto;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;height:100%;padding-left:env(safe-area-inset-left,0px)}
.brand{padding:18px 18px 12px;border-bottom:1px solid var(--line)}
.brand .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.brand h1{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.2;margin-top:4px}
.brand .sub{color:var(--muted);font-size:12.5px;margin-top:4px}
.search{padding:10px 14px;border-bottom:1px solid var(--line)}
.search input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit;font-size:14px}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px}
.progress{padding:8px 18px;font-family:var(--mono);font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.bar{height:4px;background:var(--line);border-radius:2px;flex:1;margin:0 10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--done);width:0}
nav{overflow-y:auto;flex:1;padding:6px 0 24px}
.cat>summary{list-style:none;cursor:pointer;padding:9px 18px;display:flex;align-items:baseline;gap:8px;user-select:none}
.cat>summary::-webkit-details-marker{display:none}
.cat>summary .n{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:1.6em}
.cat>summary .zh{font-weight:700}
.cat>summary .en{color:var(--muted);font-size:12px;margin-left:auto;text-align:right}
.cat>summary::before{content:"";width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);margin-right:2px;transition:transform .15s;flex:none;position:relative;top:-2px}
.cat[open]>summary::before{transform:rotate(45deg)}
.cat ul{list-style:none;margin:0;padding:0 0 6px}
.cat li a{display:flex;gap:8px;align-items:flex-start;padding:6px 18px 6px 34px;text-decoration:none;color:var(--fg);font-size:13.5px;line-height:1.4;border-left:3px solid transparent}
.cat li a:hover{background:var(--accent-soft)}
.cat li a.active{border-left-color:var(--accent);background:var(--accent-soft);font-weight:500}
.cat li a .tick{flex:none;width:14px;height:14px;border:1.5px solid var(--line);border-radius:50%;margin-top:4px}
.cat li a.done .tick{background:var(--done);border-color:var(--done)}
.cat li a .t{flex:1;min-width:0}
.cat li a .t small{display:block;color:var(--muted);font-size:11.5px}
.cat li[hidden]{display:none}
.cat.nomatch{display:none}

/* ---- main ---- */
#main{flex:1;min-width:0;height:100%;overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:18px}
#menu{display:none;padding:6px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px}
.crumb{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb b{color:var(--fg);font-weight:500}
.navbtns{margin-left:auto;display:flex;gap:6px}
.navbtns button{padding:6px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px;background:var(--panel)}
.navbtns button:disabled{opacity:.4;cursor:default}

article{max-width:860px}
.player{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.18)}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vids{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.vids button{font-family:var(--mono);font-size:11.5px;padding:3px 9px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
.vids button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.vids a{font-family:var(--mono);font-size:11.5px;margin-left:auto;align-self:center}

.head{margin:22px 0 14px}
.head .eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.head h2{font-family:var(--display);font-size:30px;font-weight:600;line-height:1.15;margin-top:6px}
.head h2 .en{display:block;font-family:var(--body);font-size:16px;font-weight:400;color:var(--muted);margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tags span{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--code);color:var(--muted)}
.doneRow{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13.5px}
.doneRow input{width:16px;height:16px;accent-color:var(--done)}

.sec{display:grid;grid-template-columns:150px 1fr;gap:10px 18px;padding:14px 0;border-top:1px solid var(--line)}
.sec h3{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.02em;padding-top:2px}
.sec h3 small{display:block;font-family:var(--mono);font-weight:400;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.sec p{margin:0;max-width:65ch}
.sec.positive p{border-left:3px solid var(--mark);padding-left:12px}
.acc{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.acc div{background:var(--code);border-radius:6px;padding:8px 10px}
.acc b{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.acc span{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.acc .src{grid-column:1/-1;background:none;padding:2px 0;font-size:12px;color:var(--muted)}
.foot{margin-top:18px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.welcome h2{font-family:var(--display);font-size:30px;margin-bottom:8px}
.welcome p{max-width:65ch;color:var(--muted)}
.welcome .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:18px}
.welcome .grid button{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.welcome .grid b{display:block}
.welcome .grid small{color:var(--muted);font-size:12px}
.welcome .grid i{display:block;font-family:var(--mono);font-size:11px;color:var(--accent);margin-top:6px;font-style:normal}

#scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:9}
@media (max-width:820px){
  #side{position:fixed;left:0;top:0;bottom:0;z-index:10;transform:translateX(-100%);transition:transform .2s;width:min(var(--sidebar),88vw);padding-top:env(safe-area-inset-top,0px)}
  body.nav-open #side{transform:none}
  body.nav-open #scrim{display:block}
  #menu{display:inline-block}
  .sec{grid-template-columns:1fr;gap:4px}
  .head h2{font-size:24px}
  .cat>summary .en{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>

ty": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a (Sikandar & Dickenson 2012; Boissonnault & Bass 1990)"}, "title_zh": "腰椎內臟轉移痛篩檢 Lumbar Referred Pain", "name_zh": "腰椎內臟轉移痛篩檢", "purpose_zh": "在下背痛病人中篩檢真正的內臟痛 (visceral pain) 與內臟轉移痛 (visceral referred pain)，以排除嚴重病變或轉介；90% 的下背痛是非特異性的，但內臟來源常被忽略。", "structure_zh": "與腰椎共享節段神經支配的器官：泌尿生殖道；部分消化道（多數消化器官轉移到胸椎）；腹主動脈瘤 (abdominal aortic aneurysm, AAA)（心血管系統通常轉移到胸椎）。內臟痛因感覺神經分布稀疏與中樞訊號分散而瀰漫、位於中線、難以定位，常伴自主神經徵象（蒼白、大量出汗、噁心、腸胃不適、體溫／血壓／心跳變化）與強烈情緒反應（Sikandar 等人 2012）。", "procedure_zh": "以病史篩檢。泌尿生殖道：排尿疼痛或困難、血尿、失禁、頻尿、尿流變弱、陽痿、最後一次月經、陰道分泌物、停經後出血、泌尿道感染史、經痛、性交疼痛、性病史。消化道：吞嚥困難、噁心／胃灼熱／嘔吐、特定食物不耐、便秘、腹瀉、糞便顏色改變、直腸出血。AAA 早期警訊：平躺時腹部搏動感、中腹／左側腰／下背鈍痛。運動系統：多關節隱匿性疼痛、腫脹或活動受限（發炎性疾病）。先問一般性問題再深入，並向病人說明為何要問。", "positive_zh": "看的是型態而非單一答案：症狀與姿勢、動作無關、休息時也在、尤其夜間痛醒；瀰漫、鈍、絞痛樣、會漸強再消退；與進食、腸或膀胱脹滿、排尿或排便有關；無外傷的隱匿起病；發燒、畏寒、噁心、不明原因體重減輕、倦怠、嘔吐、排便習慣改變或直腸／陰道出血超過 1–2 週；年齡、性別、職業、族群與個人／家族病史的風險。", "notes_zh": "目標不是診斷器官病變（那是醫師的工作），而是把內臟篩檢納入例行流程以便轉介。原頁的器官一覽圖不在 API 文字中。配套頁面：胸椎與頸椎轉移痛（參考 Sikandar & Dickenson 2012、Boissonnault & Bass 1990）。", "tags": ["紅旗 red flags", "內臟轉移痛 visceral referred pain", "病史篩檢 screening"]}, {"slug": "referred-pain-explained", "title_en": "Somatic and Visceral Referred Pain Explained", "link": "https://www.physiotutors.com/wiki/referred-pain-explained/", "youtube_ids": ["jIJMfNQ1aU4"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a (Bogduk 2009; Vernon 2012)"}, "title_zh": "體感與內臟轉移痛原理 Somatic and Visceral Referred Pain Explained", "name_zh": "體感與內臟轉移痛原理", "purpose_zh": "說明體感 (somatic) 與內臟 (visceral) 轉移痛的神經生理，以及它與局部痛、神經病變痛 (neuropathic pain) 和神經根痛 (radicular pain) 的差別。", "structure_zh": "匯聚投射理論 (convergence-projection theory)：神經支配稀疏的深層／軸向／近端組織（韌帶、關節囊、肌腱、筋膜、肌肉，例如下背或髖）與支配密集的遠端組織匯聚到同一個背角二級神經元，體感覺皮質 (somatosensory cortex) 因而把疼痛誤投射到遠端。體感例子：右側 L5/S1 小面關節 (facet joint) 的痛感覺在右臀與大腿後側。內臟：器官的傷害性訊號投射到同節段的體壁結構，常伴自主神經現象。", "procedure_zh": "不適用（觀念頁）。線索：局部痛在痛處加壓會更痛；轉移痛在痛處加壓不會更痛，但在敏感化的來源加壓會同時增加局部與轉移區的痛。轉移痛落在同一骨節 (sclerotome)（圖譜並不一致），一律由近端轉向遠端，性質為深層酸痛或向外擴張的壓迫感，很少超過膝或肘（與神經根痛不同）。", "positive_zh": "不適用（觀念頁）。", "notes_zh": "深層酸痛來自無髓鞘第 IV 型／C 纖維（次級痛覺過敏 secondary hyperalgesia）；尖銳、定位清楚的痛來自有髓鞘第 III 型／A-delta 纖維（初級痛覺過敏）。轉移型態只能推估節段位置，不能指出解剖來源。原頁的器官轉移圖不在 API 文字中，文字殘留製作筆記（「Display overview from different studies if possible」）（參考 Bogduk 2009、Vernon 2012）。", "tags": ["轉移痛 referred pain", "疼痛神經生理 pain neurophysiology", "觀念 concept"]}, {"slug": "closed-fist-percussion-test", "title_en": "Closed Fist Percussion Test", "link": "https://www.physiotutors.com/wiki/closed-fist-percussion-test/", "youtube_ids": ["kkD8o5vlV8I"], "accuracy": {"sensitivity": "87.5%", "specificity": "90%", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Langdon et al. 2010"}, "title_zh": "握拳叩擊測試 Closed Fist Percussion Test", "name_zh": "握拳叩擊測試", "purpose_zh": "突發背痛病人的紅旗篩檢：偵測有症狀的脊椎（骨質疏鬆性）壓迫性骨折 (compression fracture)。", "structure_zh": "椎體；骨質疏鬆性壓迫性骨折是脊椎最常見的紅旗（65 歲以上女性盛行率 25%、80 歲以上 40%）。", "procedure_zh": "病人站在鏡子前以便觀察反應，檢查者站在病人後方，一手放在脊椎上，另一手握拳沿脊椎叩擊。", "positive_zh": "尖銳、突發的疼痛。", "notes_zh": "Langdon 等人 (2010)：敏感度 87.5%、特異度 90%。配套測試：仰臥徵象 (supine sign)。原頁也列出其他部位的骨折篩檢：Caradeniz 腕部規則、肘伸直測試、髕骨-恥骨叩擊、fulcrum 測試、渥太華膝／踝規則。", "tags": ["紅旗 red flags", "壓迫性骨折 compression fracture", "骨折篩檢 fracture screening"]}, {"slug": "supine-sign", "title_en": "Supine Sign", "link": "https://www.physiotutors.com/wiki/supine-sign/", "youtube_ids": ["5OQUYTuQrlM"], "accuracy": {"sensitivity": "81%", "specificity": "93%", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Langdon et al. 2010"}, "title_zh": "仰臥徵象 Supine Sign", "name_zh": "仰臥徵象", "purpose_zh": "有症狀脊椎壓迫性骨折的紅旗篩檢。", "structure_zh": "椎體，多在胸椎；仰臥會增加該處的壓迫。", "procedure_zh": "請病人只用一個枕頭仰臥在檢查床上。", "positive_zh": "因劇痛無法仰臥。病史中常會聽到病人只能坐在椅子上睡。", "notes_zh": "Langdon 等人 (2010)：敏感度 81%、特異度 93%。配套測試：握拳叩擊測試。", "tags": ["紅旗 red flags", "壓迫性骨折 compression fracture", "骨折篩檢 fracture screening"]}, {"slug": "babinski-sign", "title_en": "Babinski Sign", "link": "https://www.physiotutors.com/wiki/babinski-sign/", "youtube_ids": ["iV_a2WSbdM8"], "accuracy": {"sensitivity": "51%", "specificity": "99%", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Jaramillo et al. 2014"}, "title_zh": "Babinski 徵象 Babinski Sign", "name_zh": "Babinski 徵象", "purpose_zh": "篩檢上運動神經元 (upper motor neuron, UMN)／錐體徑 (pyramidal tract) 病變。", "structure_zh": "錐體系統（皮質脊髓徑 corticospinal tract）。", "procedure_zh": "以尖物從腳跟沿足底外側緣向前劃到大腳趾。", "positive_zh": "大腳趾伸直、其他腳趾扇形外展（扇形徵象 fan sign，signe de l'éventail）；嚴重時伴髖膝屈曲。正常反應為腳趾屈曲／抓握。陽性表示錐體系統的結構性損傷，或癲癇、中毒造成的暫時性干擾。", "notes_zh": "Jaramillo 等人 (2014)：敏感度 51%、特異度 99%。原頁列的其他 UMN 篩檢：Hoffmann 徵象、Lhermitte 徵象、inverted supinator 徵象（頸椎）。⚠ 原頁把 signe de l'éventail 寫成「signe de Levante」，且第一筆參考文獻錯亂（Jaramillo 與一篇無關的 BPPV 指引黏在一起）。", "tags": ["上運動神經元 UMN", "神經學篩檢 neurological screening", "紅旗 red flags"]}, {"slug": "schober-test", "title_en": "Schober Test", "link": "https://www.physiotutors.com/wiki/schober-test/", "youtube_ids": ["eYOUA9asDu8"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a; Castro et al. systematic review (cited as 2015 in text, 2016 in references) reports acceptable construct validity"}, "title_zh": "Schober 測試 Schober Test", "name_zh": "Schober 測試", "purpose_zh": "量化腰椎屈曲；改良版納入僵直性脊椎炎 (ankylosing spondylitis) 用的 BASMI 指數。", "structure_zh": "腰椎；以 S2 為基準做皮膚標記。", "procedure_zh": "病人赤腳站直、雙腳距 30 公分。在 S2 棘突下方 5 公分與上方 10 公分各做一記號（相距 15 公分）。病人膝伸直盡量前彎，再量一次，差值即為屈曲量。改良版 Schober 以髂嵴 (iliac crest) 高度為基準；改良改良版以髂後上棘 (PSIS) 為基準。", "positive_zh": "非陽性／陰性型檢查：距離的增加量即腰椎屈曲量。", "notes_zh": "Castro 等人的系統性回顧（內文寫 2015、文獻 2016）報告建構效度可接受。⚠ 本頁說改良版用髂嵴，而改良改良版 Schober 頁面卻說「原始 Schober」用髂嵴，兩頁說法不一致。", "tags": ["腰椎屈曲 lumbar flexion", "活動度 ROM", "BASMI"]}, {"slug": "modified-modified-schober-test", "title_en": "Modified-modified Schober Test", "link": "https://www.physiotutors.com/wiki/modified-modified-schober-test/", "youtube_ids": ["xijrrijZGqY"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a; Rezvani et al. 2012: intra-rater reliability r 0.97 (excellent), correlation with radiographic measurement r 0.67 (moderate)"}, "title_zh": "改良改良版 Schober 測試 Modified-modified Schober Test", "name_zh": "改良改良版 Schober 測試", "purpose_zh": "在診間不靠影像量化腰椎屈曲活動度（BASMI、僵直性脊椎炎情境）。", "structure_zh": "腰椎；以兩側 PSIS 連線為基準做皮膚標記。", "procedure_zh": "病人站直。找到兩側髂後上棘 (PSIS) 並畫一條水平線，在其上方 15 公分處再標一點。病人膝伸直盡量前彎，再量兩點距離。", "positive_zh": "非陽性／陰性型檢查：距離的增加量即屈曲量。", "notes_zh": "Rezvani 等人 (2012)：施測者內信度 r 0.97（極佳），但與放射學量測的相關只有中等（r 0.67），原頁給中等臨床價值。基準點的說法與 Schober 頁面不一致，見該筆說明。", "tags": ["腰椎屈曲 lumbar flexion", "活動度 ROM", "BASMI"]}, {"slug": "menell-test", "title_en": "Menell Test", "link": "https://www.physiotutors.com/wiki/menell-test/", "youtube_ids": ["QOM4fKkmurA"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a"}, "title_zh": "Menell 三階段測試 Menell Test", "name_zh": "Menell 三階段測試", "purpose_zh": "快速判斷疼痛來自髖關節、薦髂關節 (sacroiliac joint, SIJ) 還是腰椎的三階段測試。", "structure_zh": "髖關節（內轉加伸直為緊縮位 closed-packed position）、薦髂關節、腰椎。", "procedure_zh": "病人俯臥。第一階段（髖）：在坐骨粗隆 (ischial tuberosity) 往腹尾側固定骨盆，從內側握住同側腿使其內轉並把髖伸直。第二階段（SIJ）：在薦骨 S2 樞軸點下方往腹尾側固定薦骨，再把腿伸直。第三階段（腰椎）：以捏握固定 T12 往腹尾側，再伸腿，等於對整個腰椎做被動伸直加旋轉。", "positive_zh": "該階段重現病人熟悉的疼痛。", "notes_zh": "原頁建議各區域再用更特異的測試追查：Laslett 組合、van der Wurff 組合（SIJ）、FADDIR 測試（髖）。原頁未列參考文獻。", "tags": ["快速篩檢 quick screening", "髖／SIJ／腰椎鑑別 differential"]}, {"slug": "dermatomes-lower-limb", "title_en": "Dermatomes Lower Limb", "link": "https://www.physiotutors.com/wiki/dermatomes-lower-limb/", "youtube_ids": ["SzAyUsA25MQ"], "accuracy": {"sensitivity": "32-40% per dermatome (pooled 35%)", "specificity": "59-72% per dermatome (pooled 64%)", "lr_plus": "1.02-1.26 (pooled, all neurological examination components)", "lr_minus": "not reported", "source": "Al Nezari et al. 2013 systematic review/meta-analysis (14 studies, lumbar disc herniation); page spells 'Al Nazari'"}, "title_zh": "下肢皮節測試 Dermatomes Lower Limb", "name_zh": "下肢皮節測試", "purpose_zh": "懷疑腰椎神經根病變 (radiculopathy) 時的感覺（皮節 dermatome）測試，協助定位病變椎間盤節段。", "structure_zh": "腰薦皮節；神經根受壓最常見於 L4/L5 與 L5/S1，L3/L4 少得多，再往上罕見。", "procedure_zh": "病人仰臥、下肢裸露。用刷子（例如反射槌握柄內的）刷過兩側的各皮節區域，詢問兩側是否有差異。", "positive_zh": "某一皮節的感覺與對側不同。", "notes_zh": "Al Nezari 等人 (2013) 系統性回顧與統合分析（14 篇、腰椎椎間盤突出）：感覺測試敏感度 32–40%、特異度 59–72%，合併後敏感度 35%、特異度 64%；所有神經學檢查項目的合併 LR+ 僅 1.02–1.26，臨床價值弱，但仍是理學檢查中最好的工具（原頁拼成「Al Nazari」）。配套：下肢肌節（膝部模組亦有）與反射。", "tags": ["神經根病變 radiculopathy", "皮節 dermatome", "神經學檢查 neurological"]}, {"slug": "myotomes-lower-limb", "title_en": "Myotomes Lower Limb", "link": "https://www.physiotutors.com/wiki/myotomes-lower-limb/", "youtube_ids": ["ptO9ZvsUPDg"], "accuracy": {"sensitivity": "22-40% per myotome (pooled 31%)", "specificity": "62-79% per myotome (pooled 76%)", "lr_plus": "1.02-1.26 (pooled, all neurological examination components)", "lr_minus": "not reported", "source": "Al Nezari et al. 2013 systematic review/meta-analysis, 14 studies, lumbar disc herniation"}, "title_zh": "下肢肌節測試 Myotomes Lower Limb", "name_zh": "下肢肌節測試", "purpose_zh": "懷疑腰椎神經根病變 (radiculopathy) 時的肌節 (myotome) 肌力測試，協助定位病變椎間盤節段。", "structure_zh": "腰薦神經根：L2 髖屈曲、L3 髖伸直（原頁如此列）、L4 脛前肌 (tibialis anterior)／踝背屈、L5 伸拇長肌 (extensor hallucis longus)／大腳趾伸直、S1 小腿肌（反覆提踵）、S2 膝屈曲（神經根病變罕見）。", "procedure_zh": "病人仰臥，逐一測試各肌節，並與健側比較。", "positive_zh": "某一肌節的肌力相較對側減弱 (paresis)。", "notes_zh": "同一頁也收錄在膝部模組。Al Nezari 等人 (2013)：肌節無力敏感度 22–40%、特異度 62–79%，合併後敏感度 31%、特異度 76%；合併 LR+ 1.02–1.26，臨床價值弱，但仍是理學檢查中最好的工具。⚠ 原頁把 L3 列為髖伸直，未加說明。配套：下肢皮節與反射。", "tags": ["神經根病變 radiculopathy", "肌節 myotome", "神經學檢查 neurological"]}, {"slug": "lower-limb-reflex-testing", "title_en": "Lower Limb Reflex Testing", "link": "https://www.physiotutors.com/wiki/lower-limb-reflex-testing/", "youtube_ids": ["kFkRa17hlVc"], "accuracy": {"sensitivity": "25-29%", "specificity": "75-78%", "lr_plus": "1.02-1.26 (pooled, all neurological examination components)", "lr_minus": "not reported", "source": "Al Nezari et al. 2013 systematic review/meta-analysis"}, "title_zh": "下肢反射測試 Lower Limb Reflex Testing", "name_zh": "下肢反射測試", "purpose_zh": "懷疑腰椎神經根病變時的深肌腱反射 (deep tendon reflex) 測試，協助定位病變椎間盤節段。", "structure_zh": "髕腱反射 (patellar tendon reflex) 對應 L3–L4，阿基里斯腱反射 (Achilles tendon reflex) 對應 L5–S1。", "procedure_zh": "引出髕腱與阿基里斯腱反射並比較兩側（細節見影片）。", "positive_zh": "深肌腱反射相較對側減弱或消失。", "notes_zh": "Al Nezari 等人 (2013)：反射測試敏感度 25–29%、特異度 75–78%；合併 LR+ 1.02–1.26，臨床價值弱，但仍是理學檢查中最好的工具。配套：下肢皮節與肌節。", "tags": ["神經根病變 radiculopathy", "反射 reflex", "神經學檢查 neurological"]}, {"slug": "straight-leg-raise-test", "title_en": "Straight Leg Raise Test", "link": "https://www.physiotutors.com/wiki/straight-leg-raise-test/", "youtube_ids": ["CnITUzAD1SE"], "accuracy": {"sensitivity": "not reported (described as higher than specificity)", "specificity": "not reported (lower than sensitivity)", "lr_plus": "not reported", "lr_minus": "down to 0.27", "source": "van der Windt et al. 2010 Cochrane review; Scaia et al. 2012 systematic review (versus surgical findings; most primary studies biased)"}, "title_zh": "直膝抬腿測試 Straight Leg Raise Test", "name_zh": "直膝抬腿測試", "purpose_zh": "拉緊坐骨神經 (sciatic nerve) 以重現腰椎神經根痛，主要針對腰椎椎間盤突出 (lumbar disc herniation)。", "structure_zh": "坐骨神經與腰薦神經根（硬膜 dura）。文獻對陽性判準不一致（比較兩側髖屈曲角度 vs 重現熟悉的腿痛），且沒有公認的正常角度；Physiotutors 主張以重現熟悉的腿痛為準。", "procedure_zh": "病人仰臥。站在患側，握住腿確保膝完全伸直，緩慢抬腿做髖屈曲並觀察病人反應。可逐步加敏感化動作：在不適點加踝背屈，或請病人屈頸。", "positive_zh": "重現病人熟悉的、往腿部竄的疼痛。", "notes_zh": "van der Windt 等人 (2010) Cochrane 回顧與 Scaia 等人 (2012) 系統性回顧（以手術所見為對照）：敏感度整體高於特異度，陰性概似比 (LR−) 最低到 0.27；幾乎所有原始研究都有偏差，且多數未確認「重現的痛」是否為病人當前症狀。結論：對確認椎間盤突出造成的神經根痛沒有診斷價值，但排除時至少有中等臨床價值。相關：交叉直膝抬腿（較特異）、俯臥屈膝（L2–L4）、弓弦測試、slump 測試。", "tags": ["神經根症候群 radicular syndrome", "坐骨神經 sciatic nerve", "排除用 rule-out"]}, {"slug": "crossed-straight-leg-raise-test", "title_en": "Crossed Straight Leg Raise Test", "link": "https://www.physiotutors.com/wiki/crossed-straight-leg-raise-test/", "youtube_ids": ["Yp7es4deo0Q"], "accuracy": {"sensitivity": "28% (pooled)", "specificity": "90% (pooled)", "lr_plus": "2.8", "lr_minus": "not reported", "source": "van der Windt et al. 2010 Cochrane review"}, "title_zh": "交叉直膝抬腿測試 Crossed Straight Leg Raise Test", "name_zh": "交叉直膝抬腿測試", "purpose_zh": "抬起健側腿以確認椎間盤突出造成的腰薦神經根症候群。", "structure_zh": "硬膜與 L4–S2 神經根被向尾側拉動，間接壓迫患側，尤其是大型腋側 (axillary) 突出。", "procedure_zh": "病人仰臥。將健側腿膝伸直、髖屈曲至約 60–70°。", "positive_zh": "伸直的患側腿沿神經分布出現竄痛。", "notes_zh": "van der Windt 等人 (2010) Cochrane 回顧：合併敏感度 28%、特異度 90%，LR+ 2.8，適合用來確認。與敏感而不特異、適合排除的 SLR 互補。相關：俯臥屈膝（L4 以上）、弓弦測試、slump 測試。原頁提到的示意圖不在 API 文字中。", "tags": ["神經根症候群 radicular syndrome", "確認用 rule-in", "椎間盤突出 disc herniation"]}, {"slug": "bowstring-test", "title_en": "Bowstring Test", "link": "https://www.physiotutors.com/wiki/bowstring-test/", "youtube_ids": ["6fLeqG41qJ8"], "accuracy": {"sensitivity": "69%", "specificity": "not reported (all 50 patients had herniation, so specificity could not be calculated)", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Supik & Broom 1994 (page spells 'Supic')"}, "title_zh": "弓弦測試 Bowstring Test", "name_zh": "弓弦測試", "purpose_zh": "評估疑似腰椎椎間盤突出，確認坐骨神經受到張力或壓迫（又稱 cram test、脛後神經徵象）。", "structure_zh": "膕窩 (popliteal fossa) 內的坐骨／脛神經。", "procedure_zh": "病人仰臥。先做直膝抬腿直到出現症狀，維持該位置並把膝稍微屈曲約 20° 讓症狀減輕，然後按壓膕窩。", "positive_zh": "按壓膕窩重現症狀或造成不適。", "notes_zh": "Supik & Broom (1994)（原頁拼成 Supic）：50 名皆已確診椎間盤突出的病人中 69% 陽性，只能算出敏感度 69%、無法算特異度，臨床價值未知。相關：交叉直膝抬腿、俯臥屈膝、直膝抬腿、slump 測試。", "tags": ["神經根症候群 radicular syndrome", "坐骨神經 sciatic nerve", "效度未知 unvalidated"]}, {"slug": "slump-test", "title_en": "Slump Test", "link": "https://www.physiotutors.com/wiki/slump-test/", "youtube_ids": ["HFGfP84uwEo"], "accuracy": {"sensitivity": "44-87% (range)", "specificity": "23-63% (range)", "lr_plus": "not reported", "lr_minus": "not reported", "source": "van der Windt et al. 2010 Cochrane review"}, "title_zh": "Slump 測試 Slump Test", "name_zh": "Slump 測試", "purpose_zh": "對硬膜施加最大應力的高誘發性神經動力學 (neurodynamic) 測試，用於有症狀的腰椎神經根受壓；不同的加載順序可協助區分突出、硬膜外沾黏、神經根受壓與間歇性神經性跛行。", "structure_zh": "硬膜與腰薦神經根（軀幹、頸、膝、踝各成分合併拉緊）。", "procedure_zh": "病人坐在床的長邊、髖中立。雙手背在身後，軀幹駝背進入腰椎與胸椎屈曲、頭保持直立；檢查者在肩上加壓並請病人下巴收向胸口；維持三重屈曲，伸直患側膝（Physiotutors 主張由檢查者被動伸膝，與影片不同，因為病人可能自行迴避誘發姿勢）；再加被動踝背屈。任一階段症狀加重就停止。", "positive_zh": "重現熟悉的神經學症狀。腿後肌緊繃伴膝伸直受限、或 T8/T9 處的緊繃屬非病理性，不算陽性。", "notes_zh": "van der Windt 等人 (2010) Cochrane 回顧：敏感度範圍 44–87%、特異度範圍 23–63%。疑似嚴重脫出 (prolapse)／擠出 (extrusion) 時不建議做：腰椎屈曲會增加椎間盤負荷，且 SLR 或站姿前彎通常就足以誘發。即使陽性仍要做皮節、肌節與反射檢查。另見 Sizer 的 slump 加載版本。", "tags": ["神經動力學 neurodynamics", "硬膜 dura", "神經根症候群 radicular syndrome"]}, {"slug": "prone-knee-bending-test", "title_en": "Prone Knee Bending Test", "link": "https://www.physiotutors.com/wiki/prone-knee-bending-test/", "youtube_ids": ["whb3Rknage0"], "accuracy": {"sensitivity": "50% (L2-L4); 70% (L3 only)", "specificity": "100% (L2-L4); 88% (L3 only)", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Suri et al. 2011"}, "title_zh": "俯臥屈膝測試（反向 Lasègue） Prone Knee Bending Test", "name_zh": "俯臥屈膝測試（反向 Lasègue）", "purpose_zh": "拉緊股神經 (femoral nerve) 以偵測 L2–L4 的腰椎椎間盤突出合併神經根受壓。", "structure_zh": "股神經與 L2–L4 神經根。90% 的神經根症候群在 L4–L5 或 L5–S1，約 5% 在 L3–L4，更高節段更少。", "procedure_zh": "病人俯臥。小心地把患側膝屈曲到最大；若無法超過 90° 或想加強股神經牽張，可加被動髖伸直。部分作者建議維持 45–60 秒，但在活動性神經根受壓中可能過度誘發。", "positive_zh": "膝最大屈曲（加或不加髖伸直；原頁文字寫成「hip flexion」）時出現往腿或大腿前側竄的疼痛。", "notes_zh": "Suri 等人 (2011)：L2–L4 敏感度 50%、特異度 100%；單看 L3 敏感度 70%、特異度 88%，原頁給中等臨床價值、可提高診斷可能性。神經根症候群通常靠病史即可診斷。相關：SLR、交叉 SLR、弓弦、slump。", "tags": ["股神經 femoral nerve", "L2–L4 神經根", "確認用 rule-in"]}, {"slug": "slr-sizer", "title_en": "SLR Sizer", "link": "https://www.physiotutors.com/wiki/slr-sizer/", "youtube_ids": ["XAwQ5timVig"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a (Sizer et al. 2002)"}, "title_zh": "Sizer 版直膝抬腿鑑別 SLR Sizer", "name_zh": "Sizer 版直膝抬腿鑑別", "purpose_zh": "用直膝抬腿的遠端起始與近端起始兩種加載順序（Sizer 等人 2002），區分原發性椎間盤疾患（突出、脫出、擠出直接壓迫神經根）與續發性椎間盤疾患（硬膜外沾黏、神經根壓迫症候群 NRCS、間歇性神經性跛行 INC）。", "structure_zh": "硬膜、腰薦神經叢與坐骨神經；硬膜套 (dural sleeve) 相對其容器的滑動度。", "procedure_zh": "遠端起始：仰臥；屈髖屈膝讓硬膜鬆弛；踝背屈（遠端預張）；維持背屈下伸膝並屈髖直到出現症狀；病人屈頸（最大張力）；最後放掉背屈。近端起始：仰臥；屈髖屈膝；病人屈頭頸（頭側預張）；檢查者踝背屈、伸膝、屈髖直到出現症狀；最後病人頭頸伸直（硬膜往遠端移動）。", "positive_zh": "原發性椎間盤疾患：不論方向，在硬膜最大張力時誘發最強。續發性疾患：誘發有方向性，遠端起始時最強，加上屈頸後減輕，放掉背屈後消失；近端起始時只有在最後頭頸伸直、釋放近端預張時才痛。", "notes_zh": "機轉例子：被退化性椎間盤膨出與肥厚黃韌帶 (ligamentum flavum) 夾住的發炎神經根，被往遠端拉過狹窄通道時更痛。相關：Sizer 版 slump、SLR、交叉 SLR、俯臥屈膝。原頁無診斷準確度數值。", "tags": ["神經動力學 neurodynamics", "鑑別診斷 differential", "Sizer"]}, {"slug": "slump-test-sizer", "title_en": "Slump Test Sizer", "link": "https://www.physiotutors.com/wiki/slump-test-sizer/", "youtube_ids": ["ws5n1p2lsSI"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a (Sizer et al. 2002)"}, "title_zh": "Sizer 版 Slump 鑑別 Slump Test Sizer", "name_zh": "Sizer 版 Slump 鑑別", "purpose_zh": "用 slump 測試的遠端起始與近端起始兩種加載順序（Sizer 等人 2002），區分原發性椎間盤疾患、硬膜套沾黏，以及神經根受壓／間歇性神經性跛行。", "structure_zh": "硬膜與腰薦神經根；椎間孔 (intervertebral foramen) 大小隨屈伸改變。", "procedure_zh": "起始姿勢：脊椎直立、膝屈 90°、腿垂出床緣。遠端起始：先被動踝背屈（遠端預張），再被動伸膝並用檢查者的膝固定，接著病人收下巴、屈頸、軀幹駝背（最大張力），最後放掉背屈。近端起始：先完全屈頸並駝背（頭側預張），再踝背屈與伸膝，最後在維持駝背下讓頭頸伸直。", "positive_zh": "原發性椎間盤疾患：張力愈大愈痛、與方向無關（遠端起始：背屈加伸膝中等痛、加收下巴屈頸最痛、頸伸直減輕；近端起始：屈曲時輕微痛、加背屈伸膝最痛、頸伸直減輕）。硬膜套沾黏：硬膜往遠端移動時痛（遠端起始中等痛、加屈頸減輕、放掉背屈不痛；近端起始全程不痛，直到頭頸伸直才痛）。神經根受壓／神經性跛行：slump 全程不痛，因為腰椎屈曲會擴大椎間孔。", "notes_zh": "注意事項同 slump 測試：疑似嚴重脫出／擠出時避免。相關：slump、SLR、交叉 SLR、俯臥屈膝。原頁無診斷準確度數值。", "tags": ["神經動力學 neurodynamics", "鑑別診斷 differential", "Sizer"]}, {"slug": "lumbar-spinal-stenosis-cluster", "title_en": "Lumbar Spinal Stenosis Cluster", "link": "https://www.physiotutors.com/wiki/lumbar-spinal-stenosis-cluster/", "youtube_ids": ["BCMY8LftLPw"], "accuracy": {"sensitivity": "96% (0 positive findings as cut-off)", "specificity": "98% (≥4 positive findings)", "lr_plus": "4.6 (≥4 positive findings)", "lr_minus": "0.19 (0 positive findings)", "source": "Cook et al. (text says 2010; reference list 2011)"}, "title_zh": "腰椎狹窄組合測試（Cook） Lumbar Spinal Stenosis Cluster", "name_zh": "腰椎狹窄組合測試（Cook）", "purpose_zh": "Cook 的臨床預測規則：五項病史與觀察項目，預測伴神經性跛行 (neurogenic claudication) 的腰椎狹窄 (lumbar spinal stenosis)。", "structure_zh": "因退化性變化（骨贅、黃韌帶 (ligamentum flavum) 增厚、脊椎關節病變、椎間盤突出）而變窄的椎管／椎間孔，卡住脊髓或神經根。", "procedure_zh": "五項：雙側神經性症狀（兩腿疼痛、感覺異常、無力等）；腿痛大於背痛；走路或站立時痛（椎管與椎間孔在此姿勢變窄）；坐下緩解；年齡 > 48 歲（典型 > 60 歲）。", "positive_zh": "0 項陽性有助排除（敏感度 96%、LR− 0.19）；4 項以上陽性有助確認（特異度 98%、LR+ 4.6）。", "notes_zh": "Cook 等人（內文寫 2010，文獻 2011）。原頁認為此規則的實務價值中等。其他腰椎狹窄測試：modified Romberg 徵象、兩階段跑步機測試、Kemp's 測試。", "tags": ["腰椎狹窄 spinal stenosis", "神經性跛行 neurogenic claudication", "cluster"]}, {"slug": "kemps-test", "title_en": "Kemp's Test", "link": "https://www.physiotutors.com/wiki/kemps-test/", "youtube_ids": ["4GBjhAcwh90"], "accuracy": {"sensitivity": "70%", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Lyle et al. 2005"}, "title_zh": "Kemp's 測試（伸直象限測試） Kemp's Test", "name_zh": "Kemp's 測試（伸直象限測試）", "purpose_zh": "以伸直重現椎間孔狹窄，誘發腰椎狹窄造成的神經性跛行，也對小面關節 (facet joint) 施加最大應力（又稱 quadrant test、extension quadrant）。", "structure_zh": "腰椎椎間孔與小面關節。神經性跛行：背、臀、大腿痛，肌力與感覺減退，腿部沉重無力，站立與行走等伸直姿勢誘發。", "procedure_zh": "病人站立。檢查者扶住肩膀協助脊椎最大伸直，再請病人向疼痛側旋轉並側彎。", "positive_zh": "重現病人的症狀：若症狀符合神經性跛行，腰椎狹窄可能性高；若以疼痛為主，可能是小面關節退化性病變。", "notes_zh": "Lyle 等人 (2005)：敏感度 70%，特異度未報告。其他腰椎狹窄測試：Cook 的臨床預測規則、modified Romberg 徵象、兩階段跑步機測試。", "tags": ["腰椎狹窄 spinal stenosis", "小面關節 facet joint", "伸直誘發 extension"]}, {"slug": "modified-romberg-sign", "title_en": "Modified Romberg Sign", "link": "https://www.physiotutors.com/wiki/modified-romberg-sign/", "youtube_ids": ["y8can7nQFdc"], "accuracy": {"sensitivity": "40%", "specificity": "91%", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Katz et al. 1995, cited via Cook et al. systematic review (text 2019, reference list 2020)"}, "title_zh": "改良 Romberg 徵象 Modified Romberg Sign", "name_zh": "改良 Romberg 徵象", "purpose_zh": "閉眼站立 10 秒的平衡測試，用來協助確認腰椎狹窄。", "structure_zh": "受狹窄影響的本體感覺／感覺路徑；原始 Romberg 測試用來區分感覺性與小腦性共濟失調 (ataxia)。", "procedure_zh": "病人雙腳併攏、閉眼站立 10 秒。", "positive_zh": "需要代償動作才能讓雙腳留在原地。（原始 Romberg：閉眼後穩定度明顯下降＝感覺功能障礙；有共濟失調但 Romberg 陰性指向小腦疾病。）", "notes_zh": "Katz 等人 (1995) 的數據經 Cook 等人系統性回顧（內文寫 2019、文獻 2020）引用：敏感度 40%、特異度 91%，確認用中等、不適合排除。De Schepper 等人 (2013) 曾結論診斷應以病史為主、理學檢查無用；Cook 等人後來發現幾項理學檢查可用於確認。神經性跛行與活動有關，功能性測試合理。其他：Cook 的 CPR、兩階段跑步機、Kemp's。", "tags": ["腰椎狹窄 spinal stenosis", "平衡 balance", "確認用 rule-in"]}, {"slug": "two-stage-treadmill-test", "title_en": "Two-Stage Treadmill Test", "link": "https://www.physiotutors.com/wiki/two-stage-treadmill-test/", "youtube_ids": ["w4nkc_8hPIc"], "accuracy": {"sensitivity": "50%", "specificity": "92.3%", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Fritz et al. 1997, cited via Cook et al. systematic review (text 2019, reference list 2020); imaging was the reference standard although stenosis is a clinical diagnosis"}, "title_zh": "兩階段跑步機測試 Two-Stage Treadmill Test", "name_zh": "兩階段跑步機測試", "purpose_zh": "比較平地與上坡跑步機行走的耐受時間與症狀出現，協助確認腰椎狹窄（Fritz 等人 1997）。", "structure_zh": "椎管橫斷面積：上坡時腰椎前凸減少、椎管變大。", "procedure_zh": "平地跑步機走 10 分鐘；休息 10 分鐘；15° 上坡走 10 分鐘。", "positive_zh": "平地行走症狀較早出現、平地行走後恢復時間較長，或上坡的總行走時間較長。", "notes_zh": "Fritz 等人 (1997) 的數據經 Cook 等人系統性回顧（內文寫 2019、文獻 2020）引用：敏感度 50%、特異度 92.3%，確認用佳、不適合排除；但該研究以影像為參考標準，而狹窄其實是臨床診斷。De Schepper 2013 與 Cook 的背景見 modified Romberg 一筆。其他：Cook 的 CPR、modified Romberg、Kemp's。", "tags": ["腰椎狹窄 spinal stenosis", "功能性測試 functional", "確認用 rule-in"]}, {"slug": "prone-instability-test", "title_en": "Prone Instability Test", "link": "https://www.physiotutors.com/wiki/prone-instability-test/", "youtube_ids": ["OrgoC3mKhXQ"], "accuracy": {"sensitivity": "not reported (described as weak)", "specificity": "not reported (described as weak)", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Fritz et al. 2005; Ferrari et al. 2015 review; inter-rater kappa 0.46-0.87 (Hicks 2003, Schneider 2008, Rabin 2013)"}, "title_zh": "俯臥不穩定測試 Prone Instability Test", "name_zh": "俯臥不穩定測試", "purpose_zh": "評估放射學腰椎不穩定 (radiographic lumbar instability)（慢性下背痛的可能原因之一），以及病人能否主動穩定脊椎（與穩定運動是否適合有關）。", "structure_zh": "在後前向 (posterior-anterior, PA) 壓力下的腰椎節段，比較有無伸肌主動穩定。", "procedure_zh": "第一部分：病人俯臥、雙腿垂出床尾、腳踩地；對各腰椎節段施加 PA 壓力誘發疼痛。第二部分：若有痛，請病人把腳抬離地面，再施加 PA 壓力。", "positive_zh": "第一部分誘發的疼痛在第二部分減輕（病人能主動穩定脊椎），也表示適合穩定運動計畫。", "notes_zh": "施測者間 kappa 0.46（弱）至 0.87（強）（Hicks 2003、Schneider 2008、Rabin 2013）；診斷放射學不穩定的敏感度與特異度皆弱（Fritz 等人 2005、Ferrari 等人 2015 回顧），原頁認為是差的診斷測試，但它是 Hicks 穩定 CPR 的一項。⚠ 本頁與被動腰椎伸直測試頁面嵌入同一支影片。相關：被動腰椎伸直、棘突間隙變化、low midline sill 徵象。", "tags": ["腰椎不穩定 lumbar instability", "穩定運動 stabilization", "Hicks CPR"]}, {"slug": "passive-lumbar-extension-test", "title_en": "Passive Lumbar Extension Test", "link": "https://www.physiotutors.com/wiki/passive-lumbar-extension-test/", "youtube_ids": ["OrgoC3mKhXQ"], "accuracy": {"sensitivity": "84.2% (Kasai 2006); 43% (Ferrari 2014)", "specificity": "90.4% (Kasai 2006); 86% (Ferrari 2014)", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Kasai et al. 2006; Ferrari et al. 2014; inter-rater kappa 0.76 (Rabin et al. 2013)"}, "title_zh": "被動腰椎伸直測試 Passive Lumbar Extension Test", "name_zh": "被動腰椎伸直測試", "purpose_zh": "提示腰椎不穩定的理學檢查 (PLET)。", "structure_zh": "被動伸直／牽引下的腰椎。", "procedure_zh": "病人俯臥。雙腿被動抬離床面約 30 公分並輕輕拉動。", "positive_zh": "嚴重下背痛、下背沉重感，或下背「快要脫開」的感覺。", "notes_zh": "Kasai 等人 (2006)：敏感度 84.2%、特異度 90.4%；Ferrari 等人 (2014) 較不理想：敏感度 43%、特異度 86%；Rabin 等人 (2013) 施測者間 kappa 0.76。原頁認為中等有用；不穩定最好的診斷依據是主客觀發現的組合。⚠ 與俯臥不穩定測試頁面嵌入同一支影片。相關：俯臥不穩定、棘突間隙變化、low midline sill 徵象。", "tags": ["腰椎不穩定 lumbar instability", "中等價值 moderate"]}, {"slug": "low-midline-sill-sign", "title_en": "Low Midline Sill Sign", "link": "https://www.physiotutors.com/wiki/low-midline-sill-sign/", "youtube_ids": ["sND1YsNZhzo"], "accuracy": {"sensitivity": "60-88% (range)", "specificity": "87-100% (range)", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Petersen et al. 2017 review (slipping palpation); original description Ahn & Jhun 2015"}, "title_zh": "中線低階徵象 Low Midline Sill Sign", "name_zh": "中線低階徵象", "purpose_zh": "腰椎滑脫 (spondylolisthesis) 與放射學不穩定的視診／觸診徵象（又稱滑脫觸診 slipping palpation、step-off 徵象）。", "structure_zh": "棘突；上位棘突相對下位棘突向前位移，形成像大寫 L 的階梯 (sill)。", "procedure_zh": "病人站立、背部裸露。觀察中線是否有階梯，再以拇指沿棘突往下滑。", "positive_zh": "摸到上位棘突位移到下位棘突前方，通常有壓痛。", "notes_zh": "Petersen 等人 (2017) 回顧（滑脫觸診）：敏感度範圍 60–88%、特異度 87–100%；信賴區間有時很寬、肥胖等現實因素會干擾，但至少中等有用（原始描述 Ahn & Jhun 2015）。⚠ API 中本頁頁首區塊標題寫成「Interspinous Gap Change」（複製錯誤）。相關：俯臥不穩定、被動腰椎伸直、棘突間隙變化。", "tags": ["腰椎滑脫 spondylolisthesis", "觸診 palpation", "腰椎不穩定 lumbar instability"]}, {"slug": "interspinous-gap-change", "title_en": "Interspinous Gap Change", "link": "https://www.physiotutors.com/wiki/interspinous-gap-change/", "youtube_ids": ["Jk1MxlQ98Us"], "accuracy": {"sensitivity": "82%", "specificity": "61%", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Ahn & Jhun 2015 (vs flexion-extension radiographs, cut-offs 10° sagittal rotation / 4 mm translation)"}, "title_zh": "棘突間隙變化 Interspinous Gap Change", "name_zh": "棘突間隙變化", "purpose_zh": "在屈伸動作中觸診棘突間隙，評估腰椎滑脫與放射學不穩定。", "structure_zh": "屈曲與伸直時的棘突間隙與棘突排列。", "procedure_zh": "病人站在離床約一腿長處、雙腳與肩同寬，雙手扶床緣前彎。由上而下視診與觸診，找出看起來彎折或間隙較寬的節段；兩拇指各放在相鄰棘突上，請病人把骨盆推向床面做伸直，同時觸診。", "positive_zh": "棘突間隙相較其他節段突然變窄，或上位棘突相對下位棘突向前或向後移位；寬間隙處通常有壓痛。", "notes_zh": "Ahn & Jhun (2015)（以屈伸 X 光為對照，切點矢狀旋轉 10°／位移 4 公釐）：敏感度 82%、特異度 61%。腰椎不穩定沒有公認定義，且這是第一篇研究，臨床價值至多中等。相關：俯臥不穩定、被動腰椎伸直、low midline sill 徵象。", "tags": ["腰椎滑脫 spondylolisthesis", "觸診 palpation", "單一研究 single study"]}, {"slug": "lumbar-motor-control-impairment", "title_en": "Lumbar Motor Control Impairment", "link": "https://www.physiotutors.com/wiki/lumbar-motor-control-impairment/", "youtube_ids": ["9uns1OrBUG8"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a (Cook et al. 2006 Delphi study)"}, "title_zh": "腰椎動作控制障礙徵象與症狀 Lumbar Motor Control Impairment", "name_zh": "腰椎動作控制障礙徵象與症狀", "purpose_zh": "臨床腰椎不穩定／動作控制障礙 (motor control impairment, MCI) 的專家共識徵象與症狀（Cook 等人 2006 Delphi 研究）；因為沒有公認定義、黃金標準與經驗證的測試。", "structure_zh": "中性區 (neutral zone) 擴大的腰椎節段（Panjabi 概念）；局部穩定肌。", "procedure_zh": "主觀前五項：膝軟般的「背要垮掉」感；常自行扳背；頻繁發作；扭轉或彎腰時痛性卡住或鎖住的病史；轉換姿勢（如坐到站）時痛。客觀前五項：腰骨盆控制差，動作中出現節段性折點 (hinging/pivoting)、本體感覺差；協調或神經肌肉控制差，出現顫抖；不穩定節段局部肌肉的肌力與耐力下降；異常動作，包括主動活動中側移 (lateral shift) 改變；維持姿勢時痛。", "positive_zh": "符合多項者，理論上較可能從穩定運動計畫獲益。", "notes_zh": "避免反安慰劑 (nocebo)：不要告訴病人他的背「不穩定」，改說是在評估運動計畫是否適合。相關：Luomajoki 動作控制測試組、局部穩定肌評估，以及放射學不穩定的各測試。原頁無診斷準確度數值。", "tags": ["動作控制 motor control", "臨床不穩定 clinical instability", "Delphi 共識"]}, {"slug": "motor-control-dysfunction-screening", "title_en": "Motor Control Dysfunction Screening", "link": "https://www.physiotutors.com/wiki/motor-control-dysfunction-screening/", "youtube_ids": ["A4gU0YD6HS4"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a; Luomajoki et al. 2007: intra- and inter-rater kappa > 0.6, no difference between novice and experienced raters, clear difference between patients and healthy subjects"}, "title_zh": "動作控制障礙測試組（Luomajoki） Motor Control Dysfunction Screening", "name_zh": "動作控制障礙測試組（Luomajoki）", "purpose_zh": "Luomajoki 等人 (2007) 的六項測試組，評估非特異性、機械性下背痛的動作控制障礙。", "structure_zh": "腰骨盆動作控制。原頁背景：只有 10% 的下背痛是特異性的；90% 非特異性中約三分之一是非機械性（中樞／心理社會因素），70% 是機械性、與動作或姿勢相關。", "procedure_zh": "1) 侍者鞠躬 (waiter's bow)：脊椎中立下做髖鉸鏈前彎。2) 骨盆後傾（腰椎屈曲）。3) 單腳站：雙腳距離為大轉子間距的三分之一，單腳站立，量側移量（正常 8 公分，兩側差 > 2 公分為異常）。4) 坐姿伸膝：矯正腰椎前凸後伸膝，腰不可屈曲。5) 四足跪姿前後搖擺：骨盆前移不可伸腰、後移時背保持中立。6) 俯臥屈膝：腳跟碰臀部、背不可動。指令標準化；不懂時再解釋並示範一次。", "positive_zh": "無法正確完成測試（喪失對腰椎動作的有意識控制），如原頁的正確／錯誤圖示。", "notes_zh": "Luomajoki 等人 (2007)：施測者內／間 kappa > 0.6，新手與資深評分者沒有差異，下背痛病人與健康人有明顯差異。正確／錯誤示範圖不在 API 文字中。另引 O'Sullivan 2000。相關：MCI 徵象與症狀、局部穩定肌評估。", "tags": ["動作控制 motor control", "非特異性下背痛 NSLBP", "測試組 test battery"]}, {"slug": "lumbar-local-stabilizers-assessment", "title_en": "Lumbar Local Stabilizers Assessment", "link": "https://www.physiotutors.com/wiki/lumbar-local-stabilizers-assessment/", "youtube_ids": ["O0bMUrzZxAA"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "close to 1 (pressure biofeedback vs ultrasound TrA activity)", "lr_minus": "close to 1", "source": "Grooms et al. 2013"}, "title_zh": "腰椎局部穩定肌評估（壓力生物回饋） Lumbar Local Stabilizers Assessment", "name_zh": "腰椎局部穩定肌評估（壓力生物回饋）", "purpose_zh": "以腹部內收手法 (abdominal draw-in maneuver, ADIM) 與壓力生物回饋儀 (pressure biofeedback unit) 評估並再訓練腰椎局部穩定肌（腹橫肌 transversus abdominis、多裂肌 multifidi）的徵召。", "structure_zh": "腹橫肌與多裂肌。", "procedure_zh": "第一步，四足跪姿：脊椎中立，深吐氣時完全放鬆腹部，再把肚臍拉向脊椎，閉氣維持最多 10 秒；10 次 × 10 秒，進階到 3 組 × 90 秒。第二步，俯臥：壓力袋置於腹部下、充氣至 70 mmHg；呼吸一次後閉氣做 ADIM，目標壓力下降 2–4 mmHg，10 × 10 秒；注意腹斜肌代償（壓力下降過多）。第三步，仰臥：壓力袋置於 L3 下、充氣至 40 mmHg；做 ADIM 時壓力應以 2–4 mmHg 逐步上升，同時能平靜呼吸，維持 15 秒兩次。", "positive_zh": "達到上述壓力變化目標且無代償。", "notes_zh": "Physiotutors 的批判性評讀：壓力生物回饋的量測與超音波量到的腹橫肌活動不相關，不是偵測腹橫肌功能障礙的有效工具；Grooms 等人 (2013) 的概似比接近 1，檢後機率不變。相關：MCI 徵象與症狀、Luomajoki 測試組。", "tags": ["腹橫肌 transversus abdominis", "壓力生物回饋 pressure biofeedback", "效度不佳 poor validity"]}, {"slug": "cluster-of-van-der-wurff", "title_en": "Cluster of van der Wurff", "link": "https://www.physiotutors.com/wiki/cluster-of-van-der-wurff/", "youtube_ids": ["0fQYI5CVjvk"], "accuracy": {"sensitivity": "85% (≥3 of 5)", "specificity": "79% (≥3 of 5)", "lr_plus": "not reported", "lr_minus": "not reported", "source": "van der Wurff et al. 2006"}, "title_zh": "van der Wurff 組合測試 Cluster of van der Wurff", "name_zh": "van der Wurff 組合測試", "purpose_zh": "五項薦髂關節 (sacroiliac joint, SIJ) 疼痛誘發測試的組合，判斷疼痛是否來自 SIJ。", "structure_zh": "薦髂關節；疼痛必須出現在同側 L5 以下的臀部區域。", "procedure_zh": "每項維持約 5 秒：牽張測試（仰臥，雙手交叉壓兩側 ASIS 往背外側，逐漸加到 25–30 公斤）；壓迫測試（患側在上側臥，髖屈 45°、膝屈 90°，雙手疊放在髂嵴前緣往下壓，25–30 公斤）；大腿推擠（仰臥，髖屈 90° 略內收，沿股骨長軸施力，25–30 公斤）；Gaenslen（仰臥於床緣，對側髖固定在最大屈曲與略外展，患側腿放下到伸直並施加約 15 公斤壓力，只做患側）；Patrick's／FABER（固定對側 ASIS，患側膝下放，加壓 15 公斤）。", "positive_zh": "5 項中 3 項以上陽性。每一項只有在誘發出熟悉的疼痛、且疼痛位於同側 L5 以下臀部時才算陽性。", "notes_zh": "van der Wurff 等人 (2006)：3 項以上陽性的敏感度 85%、特異度 79%。各單項測試（牽張、壓迫、大腿推擠、Gaenslen、Patrick's）與 Laslett 組合都在髖部模組。", "tags": ["薦髂關節 SIJ", "cluster", "疼痛誘發 pain provocation"]}, {"slug": "active-straight-leg-raise-test", "title_en": "Active Straight Leg Raise Test", "link": "https://www.physiotutors.com/wiki/active-straight-leg-raise-test/", "youtube_ids": ["qhDv5ZmQFhs"], "accuracy": {"sensitivity": "87%", "specificity": "94%", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Mens et al. 2001 (healthy vs posterior pelvic pain since pregnancy; test-retest reliability 0.87 at 1 week)"}, "title_zh": "主動直膝抬腿測試 Active Straight Leg Raise Test", "name_zh": "主動直膝抬腿測試", "purpose_zh": "測試骨盆帶疼痛 (pelvic girdle pain)（產後後骨盆痛）病人把負荷從下肢傳到軀幹的能力。", "structure_zh": "腰骨盆負荷傳遞／薦髂關節的力量閉鎖 (force closure)。", "procedure_zh": "病人仰臥，雙腿伸直、放鬆呈外轉、雙腳距 20 公分；依序把每條腿膝伸直抬離床面 5 公分。若疼痛或困難，改以雙手壓迫兩側 ASIS 或綁薦髂帶 (sacroiliac belt) 重做。每側 0–5 分（0 無困難、5 無法抬起）；總分 0 為陰性、1–10 為陽性。", "positive_zh": "抬腿困難／疼痛在骨盆加壓後消失（力量閉鎖不足）。力量閉鎖過度者通常陰性，加壓反而可能誘發（O'Sullivan 等人 2007）。", "notes_zh": "Mens 等人 (2001)（健康人 vs 產後後骨盆痛）：敏感度 87%、特異度 94%，一週再測信度 0.87，原頁給高臨床價值。分數與骨盆關節活動度相關（Mens 1999），也與 Quebec 下背痛失能量表強烈相關、可作為嚴重度量表（Mens 2002）。Mens & Pool-Goudzwaard (2017)：長期妊娠相關骨盆帶疼痛病人在 ASLR 時腹橫肌過度活化，因此沒有理由開立加強腹橫肌收縮的運動。⚠ API 中本頁頁首區塊標題寫成「Yeoman Test | Sacroiliitis Examination」（複製錯誤）。", "tags": ["骨盆帶疼痛 pelvic girdle pain", "力量閉鎖 force closure", "高臨床價值 high value"]}, {"slug": "standing-bent-over-test", "title_en": "Standing Bent Over Test", "link": "https://www.physiotutors.com/wiki/standing-bent-over-test/", "youtube_ids": ["dvhvKXnXAac"], "accuracy": {"sensitivity": "17%", "specificity": "79%", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Levangie 1999; inter-rater kappa 0.32 (Riddle et al. 2002)"}, "title_zh": "站姿前彎測試（Vorlauf） Standing Bent Over Test", "name_zh": "站姿前彎測試（Vorlauf）", "purpose_zh": "薦髂關節「功能障礙」（低動度）的觸診測試，又稱 Vorlauf 測試或站姿屈曲測試。", "structure_zh": "前彎時 PSIS 相對薦骨的移動；正常約在屈曲 60° 開始反點頭 (counternutation)。", "procedure_zh": "病人站立，觸診兩側 PSIS，請病人前彎，判斷兩側 PSIS 的移動是否對稱。", "positive_zh": "一側 PSIS 較早、較多地往頭側移動＝低動度側（低動度時薦髂之間點頭較少，髂骨連同 PSIS 必須提早移動）。", "notes_zh": "Levangie (1999)：敏感度 17%、特異度 79%；Riddle 等人 (2002) 施測者間 kappa 0.32，價值弱。Physiotutors 建議放棄 SIJ 功能障礙測試，只做 Laslett 組合等疼痛誘發測試（在髖部模組）。⚠ 本頁嵌入的影片與髖部模組的 Gillet 測試頁相同。相關：Shimpi 俯臥 SIJ 測試、Gillet、SIJ 點頭／反點頭。", "tags": ["薦髂關節 SIJ", "功能障礙測試 dysfunction", "信度低 low reliability"]}, {"slug": "shimpi-prone-si-joint-test", "title_en": "Shimpi Prone SI Joint Test", "link": "https://www.physiotutors.com/wiki/shimpi-prone-si-joint-test/", "youtube_ids": ["SedsvjW22_Y"], "accuracy": {"sensitivity": "82%", "specificity": "77%", "lr_plus": "not reported", "lr_minus": "not reported", "source": "Shimpi et al. 2018 (45 participants, first study, no fluoroscopically guided block as reference standard)"}, "title_zh": "Shimpi 俯臥薦髂關節測試 Shimpi Prone SI Joint Test", "name_zh": "Shimpi 俯臥薦髂關節測試", "purpose_zh": "Shimpi 等人 (2018) 提出的新 SIJ 功能障礙測試。", "structure_zh": "薦髂關節／俯臥髖伸直時 ASIS 的移動。", "procedure_zh": "病人俯臥。檢查者在患側站或坐，手掌放在病人 ASIS 下方；請病人把髖伸直約 15°，讓伸直的腿稍微離開床面。", "positive_zh": "ASIS 離開檢查者手掌並重現熟悉的 SIJ 疼痛。陰性：ASIS 壓進手掌且無疼痛。", "notes_zh": "Shimpi 等人 (2018)：敏感度 82%、特異度 77%；樣本僅 45 人、第一篇研究、未使用透視導引 SIJ 阻斷作為參考標準，臨床價值弱。原頁重申 SIJ 功能障礙測試不可靠、大概應該放棄。相關：站姿前彎、Gillet、SIJ 點頭／反點頭（髖部模組）。", "tags": ["薦髂關節 SIJ", "功能障礙測試 dysfunction", "單一研究 single study"]}, {"slug": "lumbar-stabilization-cpr", "title_en": "Lumbar Stabilization CPR", "link": "https://www.physiotutors.com/wiki/lumbar-stabilization-cpr/", "youtube_ids": ["qWigT_By10E"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "4.0 (success rule, ≥3 of 4)", "lr_minus": "0.18 (failure rule, ≥2 of 4)", "source": "Hicks et al. 2005 (values are likelihood ratios for treatment success, not diagnostic accuracy)"}, "title_zh": "腰椎穩定運動臨床預測規則（Hicks） Lumbar Stabilization CPR", "name_zh": "腰椎穩定運動臨床預測規則（Hicks）", "purpose_zh": "Hicks 等人 (2005) 的臨床預測規則 (clinical prediction rule, CPR)，找出可能從穩定運動計畫獲益的下背痛病人。", "structure_zh": "異質性慢性下背痛的次分組；研究中的運動計畫針對腹橫肌、多裂肌、腰方肌與腹斜肌。", "procedure_zh": "成功規則，4 項中 3 項以上：年齡 < 40 歲；直膝抬腿 > 90°；腰椎主動活動中有異常動作；俯臥不穩定測試陽性。失敗規則，4 項中 2 項以上：恐懼逃避信念問卷活動分量表 (FABQ-A) ≤ 8；無異常動作；俯臥不穩定測試陰性；腰椎彈性測試 (spring test) 無低動度。", "positive_zh": "成功規則 ≥ 3/4：穩定運動成功的勝算 × 4.0。失敗規則 ≥ 2/4：成功勝算 × 0.18。", "notes_zh": "原頁指出較不恐懼活動的病人（FABQ-A ≤ 8）用穩定運動的成功機會反而較差。數值是治療成功的概似比，不是診斷準確度。配套：Flynn 徒手整復 CPR。", "tags": ["臨床預測規則 CPR", "穩定運動 stabilization", "次分組 subgrouping"]}, {"slug": "lumbar-manipulation-cpr", "title_en": "Lumbar Manipulation CPR", "link": "https://www.physiotutors.com/wiki/lumbar-manipulation-cpr/", "youtube_ids": ["vky_6Nv0KK0"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "2.61 (≥3 of 5); 24.38 (≥4 of 5)", "lr_minus": "not reported", "source": "Flynn et al. 2002; Childs et al. 2004 validation (manipulation + exercise beat exercise alone in this subgroup); values are likelihood ratios for treatment success"}, "title_zh": "腰椎徒手整復臨床預測規則（Flynn） Lumbar Manipulation CPR", "name_zh": "腰椎徒手整復臨床預測規則（Flynn）", "purpose_zh": "Flynn 等人 (2002) 的臨床預測規則（Childs 等人 2004 驗證），找出可能因腰椎徒手整復 (manipulation) 而改善的下背痛病人。", "structure_zh": "下背痛的次分組；髖與脊椎的關係（髖內轉活動度）。", "procedure_zh": "五項：膝以下無症狀；症狀 < 16 天；FABQ 工作分量表 (FABQ-W) < 19；腰椎低動度；至少一側髖內轉 > 35°。", "positive_zh": "≥ 3/5：成功可能性 × 2.61；≥ 4/5：× 24.38；5 項全有：原頁描述為「無限大」。≤ 2 項：考慮其他做法，例如穩定運動。", "notes_zh": "原頁的理由：膝以下症狀多為神經根症候群，整復證據不一且 Flynn 研究已排除；亞急性／慢性常有心理社會因素；髖內轉少的病人屬髖-脊椎兩難 (hip-spine dilemma)，應先鬆動髖。Childs 等人 (2004)：此次分組中整復加運動優於單獨運動。數值是治療成功的概似比，不是診斷準確度。配套：Hicks 穩定運動 CPR。", "tags": ["臨床預測規則 CPR", "徒手整復 manipulation", "次分組 subgrouping"]}, {"slug": "direction-specific-exercises", "title_en": "Direction-specific Exercises", "link": "https://www.physiotutors.com/wiki/direction-specific-exercises/", "youtube_ids": ["ShM14BoX2WE"], "accuracy": {"sensitivity": "not reported", "specificity": "not reported", "lr_plus": "not reported", "lr_minus": "not reported", "source": "n/a"}, "title_zh": "方向特異性運動 Direction-specific Exercises", "name_zh": "方向特異性運動", "purpose_zh": "運用方向偏好 (directional preference) 與中央化 (centralization)（McKenzie「derangement」分類的概念），為急性下背痛（有或無神經根病變）選擇能改變症狀的反覆動作。", "structure_zh": "腰椎；方向偏好＝往某一方向（屈曲、伸直或側彎）反覆動作可逐步消除症狀或增加活動度；中央化＝反覆動作使脊椎痛與轉移痛由遠端往近端消退。", "procedure_zh": "找出偏好的方向，讓病人朝該方向反覆動作；影片示範 Physiotutors 實務上常用的幾個例子（原頁明言並非嚴格的 McKenzie 應用）。", "positive_zh": "不適用（治療頁面）。", "notes_zh": "May & Aina (2012) 系統性回顧：70% 的病人有方向偏好；44% 出現中央化（急性下背痛 74%，持續性或 65 歲以上 42%），中央化在 8 篇納入研究中有 7 篇是治療效果修飾因子。另引 Laslett (2009) 的急性腰椎側移徒手矯正。原頁第二個 YouTube 連結（Jarod Hall）是參考資料而非嵌入，因此只列一支影片。", "tags": ["方向偏好 directional preference", "中央化 centralization", "McKenzie"]}]}</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const CATS = DATA.categories, T = DATA.tests;
const order = CATS.flatMap(c => c.slugs);
const bySlug = Object.fromEntries(T.map(t => [t.slug, t]));
const catOf = Object.fromEntries(CATS.flatMap(c => c.slugs.map(s => [s, c])));
const LS = 'physio-atlas-done-lumbar';
let done = new Set(); try { done = new Set(JSON.parse(localStorage.getItem(LS) || '[]')); } catch (e) {}
function saveDone(){ try { localStorage.setItem(LS, JSON.stringify([...done])); } catch (e) {} }
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ----- sidebar ----- */
const nav = document.getElementById('nav');
nav.innerHTML = CATS.map((c, i) => `
<details class="cat" id="cat-${c.id}" ${i === 0 ? 'open' : ''}>
  <summary><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="zh">${esc(c.zh)}</span><span class="en">${esc(c.en)}</span></summary>
  <ul>${c.slugs.map(s => { const t = bySlug[s]; return `<li data-slug="${s}"><a href="#${s}" data-slug="${s}"><span class="tick"></span><span class="t">${esc(t.name_zh)}<small>${esc(t.title_en)}</small></span></a></li>`; }).join('')}</ul>
</details>`).join('');

function refreshNav(){
  nav.querySelectorAll('a').forEach(a => {
    a.classList.toggle('done', done.has(a.dataset.slug));
    a.classList.toggle('active', a.dataset.slug === current);
  });
  const n = done.size, N = order.length, pct = Math.round(100 * n / N);
  document.getElementById('pct').textContent = pct + '%';
  document.getElementById('cnt').textContent = `${n} / ${N}`;
  document.getElementById('barfill').style.width = pct + '%';
}

/* ----- search ----- */
document.getElementById('q').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  nav.querySelectorAll('.cat').forEach(cat => {
    let any = false;
    cat.querySelectorAll('li').forEach(li => {
      const t = bySlug[li.dataset.slug];
      const hay = [t.title_zh, t.title_en, t.structure_zh, (t.tags || []).join(' '), t.purpose_zh].join(' ').toLowerCase();
      const hit = !q || hay.includes(q);
      li.hidden = !hit; any = any || hit;
    });
    cat.classList.toggle('nomatch', !any);
    if (q && any) cat.open = true;
  });
});

/* ----- rendering ----- */
let current = null, vidIdx = 0;
const art = document.getElementById('art');
function accRow(label, v){ return v && !/^(n\/a|not reported|none|-)$/i.test(v) ? `<div><b>${label}</b><span>${esc(v)}</span></div>` : ''; }

function render(slug){
  const t = bySlug[slug];
  if (!t) { renderWelcome(); return; }
  current = slug; vidIdx = 0;
  const c = catOf[slug];
  const zh = t.name_zh, enParts = [t.title_en];
  const a = t.accuracy || {};
  const accHtml = [accRow('Sensitivity 敏感度', a.sensitivity), accRow('Specificity 特異度', a.specificity), accRow('LR+', a.lr_plus), accRow('LR−', a.lr_minus)].join('');
  art.innerHTML = `
  <div class="player"><iframe id="yt" src="https://www.youtube-nocookie.com/embed/${t.youtube_ids[0]}?rel=0&modestbranding=1" title="${esc(t.title_en)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
  <div class="vids">${t.youtube_ids.length > 1 ? t.youtube_ids.map((v, i) => `<button data-v="${i}" class="${i === 0 ? 'on' : ''}">影片 ${i + 1}</button>`).join('') : ''}<a href="https://www.youtube.com/watch?v=${t.youtube_ids[0]}" target="_blank" rel="noopener">在 YouTube 開啟 ↗</a></div>
  <header class="head">
    <div class="eyebrow">${esc(c.en)} · ${esc(c.zh)}</div>
    <h2>${esc(zh)}<span class="en">${esc(enParts.join(' ') || t.title_en)}</span></h2>
    <div class="tags">${(t.tags || []).map(x => `<span>${esc(x)}</span>`).join('')}</div>
    <label class="doneRow"><input type="checkbox" id="doneBox" ${done.has(slug) ? 'checked' : ''}> 已看完此測試</label>
  </header>
  <section class="sec"><h3>目的<small>Purpose</small></h3><p>${esc(t.purpose_zh)}</p></section>
  <section class="sec"><h3>檢查結構<small>Structure</small></h3><p>${esc(t.structure_zh)}</p></section>
  <section class="sec"><h3>操作步驟<small>Procedure</small></h3><p>${esc(t.procedure_zh)}</p></section>
  <section class="sec positive"><h3>陽性判讀<small>Positive finding</small></h3><p>${esc(t.positive_zh)}</p></section>
  ${accHtml ? `<section class="sec"><h3>診斷準確度<small>Accuracy</small></h3><div class="acc">${accHtml}${a.source ? `<div class="src">來源 Source：${esc(a.source)}</div>` : ''}</div></section>` : ''}
  <section class="sec"><h3>臨床重點<small>Clinical notes</small></h3><p>${esc(t.notes_zh)}</p></section>
  <div class="foot"><span>原文頁面：<a href="${t.link}" target="_blank" rel="noopener">physiotutors.com ↗</a></span><span>影片版權屬 Physiotutors；本頁僅嵌入播放與整理筆記。</span></div>`;
  art.querySelectorAll('.vids button').forEach(b => b.addEventListener('click', () => {
    vidIdx = +b.dataset.v;
    document.getElementById('yt').src = `https://www.youtube-nocookie.com/embed/${t.youtube_ids[vidIdx]}?rel=0&modestbranding=1`;
    art.querySelectorAll('.vids button').forEach(x => x.classList.toggle('on', x === b));
  }));
  document.getElementById('doneBox').addEventListener('change', e => { e.target.checked ? done.add(slug) : done.delete(slug); saveDone(); refreshNav(); });
  document.getElementById('crumb').innerHTML = `${esc(DATA.region.en)} / ${esc(c.en)} / <b>${esc(t.title_en)}</b>`;
  const i = order.indexOf(slug);
  document.getElementById('prev').disabled = i <= 0;
  document.getElementById('next').disabled = i >= order.length - 1;
  document.getElementById('cat-' + c.id).open = true;
  refreshNav();
  document.getElementById('main').scrollTo({ top: 0 });
  document.body.classList.remove('nav-open');
  document.title = `${t.title_en} · Physio Exam Atlas`;
}
function renderWelcome(){
  current = null;
  art.innerHTML = `<div class="welcome"><h2>${esc(DATA.region.zh)}理學檢查影片地圖</h2>
  <p>${order.length} 支 Physiotutors 影片，依 ${CATS.length} 個主題排列。每支影片附繁中段落筆記（目的、操作、陽性判讀、診斷準確度、臨床重點），醫學名詞保留英文。觀看進度存在你的瀏覽器裡。</p>
  <div class="grid">${CATS.map((c, i) => `<button data-cat="${c.id}"><b>${esc(c.zh)}</b><small>${esc(c.en)}</small><i>${c.slugs.length} 支影片 · ${c.slugs.filter(s => done.has(s)).length} 已看</i></button>`).join('')}</div></div>`;
  art.querySelectorAll('button[data-cat]').forEach(b => b.addEventListener('click', () => { location.hash = CATS.find(c => c.id === b.dataset.cat).slugs[0]; }));
  document.getElementById('crumb').textContent = `${DATA.region.en} · 選擇左側測試開始`;
  document.getElementById('prev').disabled = true; document.getElementById('next').disabled = false;
  refreshNav();
}
document.getElementById('prev').addEventListener('click', () => { const i = order.indexOf(current); if (i > 0) location.hash = order[i - 1]; });
document.getElementById('next').addEventListener('click', () => { const i = order.indexOf(current); location.hash = order[i + 1] || order[0]; });
document.getElementById('menu').addEventListener('click', () => document.body.classList.toggle('nav-open'));
document.getElementById('scrim').addEventListener('click', () => document.body.classList.remove('nav-open'));
window.addEventListener('hashchange', () => render(location.hash.slice(1)));
render(location.hash.slice(1));
</script>
</body>
</html>
